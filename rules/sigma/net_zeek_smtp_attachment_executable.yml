title: Executable Payload Sent as an Email Attachment (Zeek Files) — Plaintext SMTP Only
id: ac644b20-a43f-49fb-b488-f6b958c05a5a
status: experimental
description: |
    Detects an executable or script MIME type extracted from an SMTP
    attachment, as recorded in Zeek's files.log (shipped via Filebeat) —
    the classic spearphishing-attachment delivery mechanism.
    Modeled directly on net_zeek_executable_download.yml (same
    product/service, same mime_type list, same file-extraction framework)
    with `source: 'SMTP'` instead of `'HTTP'` — Zeek's file-analysis
    framework tags every extracted file with the protocol that carried it
    regardless of transport, confirmed against
    base/protocols/smtp/entities.zeek's own `$source="SMTP"` assignment.
    #365: mime_type list rewritten from 9 entries to 4 — see
    net_zeek_executable_download.yml's own description for the full live-
    verification methodology and findings (identical list, kept in sync;
    the underlying MIME-detection engine is the same regardless of which
    protocol carried the bytes). That pass served every payload over HTTP,
    not SMTP — filed as #382 to independently confirm this rule's specific
    behavior on a genuine plaintext SMTP MIME attachment.
    #382 (live-verified, 2026-08-17; full methodology, SHA-256 hashes and
    raw files.log records in findings/20260817-382-smtp-mime-verification.md):
    a real plaintext SMTP session (raw socket client/server, captured to a
    real pcap, replayed through the same pinned zeek/zeek:8.2.1 image #365
    used) carrying a genuine Windows PE executable (notepad.exe, pulled
    from a real Windows host) as a base64 MIME attachment, declared
    `Content-Type: application/x-msdownload` in the MIME headers —
    confirmed `source: "SMTP"` on the extracted files.log entry (settling
    the base/protocols/smtp/entities.zeek source-code assertion above with
    a runtime observation, not just a code read) and `mime_type:
    "application/x-dosexec"` — identical to #365's HTTP-served result for
    the same binary, confirming content-magic detection is genuinely
    transport-agnostic in practice, not just by design. Verified at Zeek's
    files.log output; the Filebeat→Logstash `source`→`zeek.source` rename
    the deployed query actually depends on (field-mapping-zeek-files) was
    not separately re-exercised with SMTP-sourced data here — covered by
    its own test_field_mapping_drift.py coverage, unchanged by this issue.
    The declared-Content-Type-fallback question needed two attempts: the
    same binary truncated to 16 bytes still produced `mime_type:
    "application/x-dosexec"` (content-magic still had enough of the real
    PE header to recognize it — not the inconclusive case intended, but
    itself informative about how little content-magic needs). Escalated
    to 200 zero-bytes (no MZ/PE signature at all, same declared
    Content-Type: application/x-msdownload header) to reach a genuinely
    inconclusive input — that produced a files.log entry with the
    `mime_type` field entirely absent, not `application/x-msdownload`,
    not a generic fallback. Confirmed for this one all-zero-byte case
    that content-magic does not fall back to the declared header — not
    exhaustively tested against other ambiguous-but-nonzero byte
    patterns a real mismatched-Content-Type attachment might produce, or
    against a payload content-magic types as some OTHER wrong-but-
    conclusive type. Separately, a quoted-printable-encoded attachment
    (same binary, non-base64 transfer encoding) decoded correctly and
    still typed `application/x-dosexec` — not a bypass, at least for this
    one alternate encoding; uuencode/yEnc/a declared-but-wrong CTE remain
    untested.
    On this evidence, `application/x-msdownload` remains correctly
    excluded from this rule's mime_type list (as it already was from the
    HTTP sibling's, per #365) — but the absent-`mime_type` result IS a
    real, disclosed coverage gap, not just a settled question: an SMTP
    attachment whose bytes match none of Zeek's narrow signature set
    produces no `mime_type` at all, and this rule's equality selection
    can never fire against a missing field. Archive/packed/container and
    script-interpreter payload classes are the realistic instances of
    this gap, not a theoretical edge case — confirmed by #384's own
    live-fire sweep, which added 6 new script-interpreter/LNK/Mach-O
    mime_type entries to this list (kept in sync with the HTTP sibling's,
    per the existing convention) but confirmed archive/container formats
    (.iso tested) and generic scripting languages with no distinct Zeek
    signature (.ps1/.vbs/.js/.wsf, all type text/plain — too broad to
    ever add) remain permanent, disclosed gaps at this logsource. Full
    methodology: net_zeek_executable_download.yml's own description and
    findings/20260817-384-mime-type-coverage.md.
    `filename` on the same files.log entry (e.g. "notepad.exe" above) is
    the MIME-declared filename, fully attacker-controlled and NOT
    content-derived (double extensions, spoofed extensions) — useful for
    triage context, never as a type signal.
    Reuses field-mapping-zeek-files (configs/detections/suburban-soc-ecs.yml)
    entirely as-is — no new prerequisite mapping work needed for this rule.
    Same correlation caveat as its HTTP sibling: files.log doesn't carry the
    sender/subject (that's in smtp.log, joined only by uid, which this
    logsource's fixture convention doesn't carry) - correlate manually
    before escalating.
    Real-world coverage caveat (security-auditor round 2, applies equally to
    net_zeek_smtp_mass_outbound): Zeek's file-extraction framework can only
    see attachment bytes in PLAINTEXT SMTP. Any session using STARTTLS or
    implicit TLS — which is the default for SMTP submission on port 587/465
    on essentially every modern mail client and provider — is opaque to
    this rule entirely. This rule's practical coverage is unencrypted
    MTA-to-MTA relay on port 25, not general inbound phishing-attachment
    delivery; the T1566.001 tag below should be read with that scope, not
    as blanket coverage of the technique. This caveat did not survive
    into docs/detections/SIEM_KQL_Documentation.md (title/tags/query only)
    — fixed (#410) by moving the scope limit into the rule title itself,
    the one field every downstream rendering keeps.
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://docs.zeek.org/en/master/logs/files.html
author: Suburban-SOC
date: 2026-08-06
tags:
    - attack.initial_access
    - attack.t1566.001
logsource:
    product: zeek
    service: files
detection:
    selection_transport:
        source: 'SMTP'
    selection_payload:
        mime_type:
            - 'application/x-dosexec'
            - 'application/x-executable'
            - 'application/x-sharedlib'
            - 'text/x-shellscript'
            - 'text/x-python'
            - 'text/x-perl'
            - 'text/x-ruby'
            - 'text/x-msdos-batch'
            - 'application/x-ms-shortcut'
            - 'application/x-mach-o-executable'
    condition: selection_transport and selection_payload
falsepositives:
    - Legitimate IT-distributed software, scripts, or installers sent by email — encourage a non-email distribution channel rather than allowlisting. security-auditor review (#384), the "uncommon practice" framing this bullet used to carry was calibrated when the list was PE/ELF/shell-script only; a developer or vendor emailing a .py/.rb/.pl script attachment is genuinely common, not a rare edge case, now that this rule's mime_type list covers those interpreters too — the `level` field below is kept as-is pending a dedicated review of whether the expanded match surface should change it, not silently left stale.
level: medium
