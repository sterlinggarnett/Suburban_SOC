title: Suspicious PowerShell Encoded Command Execution
id: 11111111-1111-1111-1111-111111111111
status: stable
description: >
    Detects the use of encoded commands in PowerShell, a common technique for
    obfuscation.
    #217 (2nd pass, security-auditor review): the first fix added a trailing
    space to bare ' -enc' to stop it matching '-Encoding' (a totally
    unrelated Out-File-style cmdlet parameter that happens to share the
    prefix) as a substring - but that traded a real true-positive surface for
    it: PowerShell resolves -EncodedCommand from any unambiguous prefix, and
    real attacker command lines commonly use the short forms (-e, -en, -enc,
    -enco, -encod, -encode, -encoded, ...), not just the exact 4-letter '-enc'
    the previous fix required a trailing space after. Restored the
    abbreviation range as selection entries (each still requiring a
    boundary), and excluded the '-Encoding' collision with a dedicated
    filter instead of trying to solve both problems with one boundary
    choice.
    3rd-pass security-auditor findings: the filter only excluded the
    space-separated form (' -encoding '), so PowerShell's colon-binding
    syntax (`Out-File -Encoding:UTF8`) still matched ' -enco'/' -encod' and
    re-opened the exact false positive this rule exists to close - added
    ' -encoding:' to the filter. Also added '/'-prefixed mirrors of every
    abbreviation: powershell.exe accepts '/' as a switch prefix identically
    to '-' (e.g. `powershell /?`), so `powershell.exe /enc <b64>` matched
    none of the '-'-only entries. Known residual scope limit, not fixed
    here: CommandLineToArgvW also accepts a literal tab as an argument
    separator, so a tab-delimited `-enc` with no adjacent space would still
    evade every entry in this rule - low real-world likelihood (no common
    tool invokes PowerShell this way) and left as a documented gap rather
    than doubling the entry list for an unobserved technique.
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - ' -e '
            - ' -en '
            - ' -enc '
            - ' -enco'
            - ' -encod'
            - ' -EncodedCommand'
            - ' -ec '
            - ' /e '
            - ' /en '
            - ' /enc '
            - ' /enco'
            - ' /encod'
            - ' /EncodedCommand'
            - ' /ec '
    filter_encoding_cmdlet_param:
        CommandLine|contains:
            - ' -encoding '
            - ' -encoding:'
    condition: selection and not filter_encoding_cmdlet_param
falsepositives:
    - Legitimate administrative scripts that use encoding.
level: medium
tags:
    - attack.execution
    - attack.t1059.001