title: DNS Query for a Known Cryptocurrency Mining Pool
id: f7ddae10-0d45-4778-8023-c68fe9f2c425
status: experimental
description: |
    Detects a DNS query for a well-known cryptomining pool hostname —
    unauthorized cryptojacking (a compromised host, or a misused campus
    machine) reaching a mining pool to submit shares.
    Uses a small hardcoded reference list, not the abuse.ch/Emerging Threats
    keyless intel feed pattern #222 built. Correction (security-auditor
    round 2): round-1's stated blocker — that #222's feed installer,
    systemd timer, and Intel-framework wiring couldn't support this without
    a much larger build — was factually wrong; configs/intel/refresh_intel.sh
    already branches non-`Intel::ADDR` entries into a `domain` field
    (Intel::DOMAIN is already supported), and configs/intel/config.zeek
    already loads the Notice-framework wiring #222 built. What's still
    genuinely missing, and still out of this batch's scope: a vetted,
    keyless, freely-redistributable mining-pool domain feed source to point
    the installer at, and a way to disambiguate a mining-pool Intel::Notice
    hit from any other feed's hit on the same `service: notice` logsource
    (Zeek's Notice framework doesn't tag which feed matched without a
    custom hook) — real design work, not a checkbox. Keeping the hardcoded
    list for now on that basis, corrected rationale only.
    Switched to operator-domain suffixes rather than full pool hostnames
    (security-auditor round 2): matches every subdomain a given operator
    uses (xmr-eu2/xmr-asia1/xmr-us-west1.nanopool.org, eu.hashvault.pro,
    pool2.supportxmr.com, etc.) with fewer, more durable entries, instead of
    one brittle full-hostname match per mining server. Two 2022-era entries
    from round 1 (MineXMR, shut down; Ethermine's Ethereum pools, defunct
    since the Merge) replaced with currently-active, higher-volume
    operators. Needs periodic maintenance regardless; treat this list as a
    starting point, not a complete one. Downgraded high -> medium to match
    that residual staleness risk rather than presenting stale-list coverage
    as high-confidence.
    security-auditor finding, same class as #428's own fix for
    net_zeek_dns_doh_non_standard.yml: `query|endswith` against a bare
    suffix with no leading dot (e.g. `nanopool.org`) is an UNANCHORED
    match — a domain like `evilnanopool.org` shares the same trailing
    11 characters and fired this rule despite being a different
    registered domain entirely, at this rule's own `level: medium`
    (a higher tier than the DoH rule this pattern was first found in,
    and more likely to be actioned). Rewritten to selection_bare (exact
    match on each operator domain) OR selection_subdomain (a genuine
    dot-anchored subdomain, e.g. `.nanopool.org`) — preserves every
    currently-covered real operator subdomain (xmr-eu2.nanopool.org
    etc.) while excluding a same-suffix-but-different-domain lookalike.
    Does NOT make this rule unforgeable: it matches on the observed
    query, not the response, so any host that can send a DNS packet can
    emit an arbitrary label under a real operator domain (e.g.
    `dig <random>.nanopool.org` in a loop) and produce a hit without
    controlling that domain at all — this fix closes the lookalike-
    registration trick, not lookalike-emission. A hit on a random-
    looking subdomain of a real operator is an emission signal, not
    proof the query resolved or that a real mining session followed.
    #434 decision: pursued the threshold/cardinality-companion option
    (rules/elastic/threshold/net-zeek-dns-crypto-mining-pool-cardinality.ndjson)
    rather than a response-side qualifier on this rule itself — buckets
    matching queries by source.ip and alerts on >=5 distinct
    dns.question.name values in a 10-minute window (a lower bar than the
    DoH sibling's 10, since legitimate mining-pool-operator traffic has
    essentially no baseline). This rule (the single-event logic-of-record)
    is unchanged and still carries the emission-only caveat above — the
    companion adds a corroborating signal, it does not replace or narrow
    this rule's own matching. See that companion's own description for
    the full tradeoffs (not live-verified end to end; still forgeable
    below the cardinality bar; NAT/proxy false-positive risk).
references:
    - https://attack.mitre.org/techniques/T1496/
author: Suburban-SOC
date: 2026-08-06
tags:
    - attack.impact
    - attack.t1496
logsource:
    product: zeek
    service: dns
detection:
    selection_bare:
        query:
            - 'nanopool.org'
            - 'supportxmr.com'
            - 'hashvault.pro'
            - 'moneroocean.stream'
            - 'minexmr.com'
            - 'nicehash.com'
            - 'f2pool.com'
            - '2miners.com'
            - 'c3pool.com'
            - 'herominers.com'
            - 'unmineable.com'
    # Invariant: each entry here must be "." + the matching
    # selection_bare entry, same order — a future operator domain added
    # to only one of the two lists reintroduces either an unanchored-
    # suffix gap (bare-only) or drops real subdomain coverage
    # (subdomain-only).
    selection_subdomain:
        query|endswith:
            - '.nanopool.org'
            - '.supportxmr.com'
            - '.hashvault.pro'
            - '.moneroocean.stream'
            - '.minexmr.com'
            - '.nicehash.com'
            - '.f2pool.com'
            - '.2miners.com'
            - '.c3pool.com'
            - '.herominers.com'
            - '.unmineable.com'
    condition: selection_bare or selection_subdomain
falsepositives:
    - Deliberate, authorized crypto/security research on an isolated segment.
    - A hit on a random-looking subdomain of a real operator domain is an
      emission signal only — this rule matches the observed query, not the
      response, so any host that can send a DNS packet can produce a hit
      under a real operator domain without controlling that domain or the
      query actually resolving; do not treat a hit alone as proof a mining
      session followed.
level: medium
