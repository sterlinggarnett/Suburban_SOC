title: LaZagne Credential Harvester Execution
id: b52e8c07-9d34-41fa-8e26-7c1f0a5b9d38
status: experimental
description: |
    Detects the LaZagne credential harvester by its distinctive argument
    surface: a module-category keyword (`all`, `browsers`, `windows`, ...)
    together with an output-format switch (`-oN`/`-oJ`) — no common Windows
    tool combines those two token types, so that pairing alone is a real
    signal even with no filename match at all.
    Security review (#232) found the original design — filename match AND
    a single arg keyword — defeatable: LaZagne's official builds are
    PyInstaller EXEs, which frequently ship with no populated
    `OriginalFileName`, so renaming the binary and staging it off a
    `lazagne`-containing path could clear every `selection_name` branch,
    and a single arg keyword like `windows` is common enough alone to be a
    weak gate anyway. The category+output-switch pairing below survives
    that rename; the filename+single-keyword path is kept alongside it as a
    second, independent way to fire. A renamed binary invoked with no
    arguments, or a category keyword with no output switch, still evades
    this — an accepted limit, not an oversight.
references:
    - https://attack.mitre.org/techniques/T1555/
    - https://github.com/AlessandroZ/LaZagne
author: Suburban-SOC
date: 2026-08-05
tags:
    - attack.credential_access
    - attack.t1555
logsource:
    category: process_creation
    product: windows
detection:
    selection_name:
        - Image|contains: 'lazagne'
        - OriginalFileName|contains: 'lazagne'
        - CommandLine|contains: 'lazagne'
    selection_category:
        CommandLine|contains:
            - ' all'
            - ' browsers'
            - ' windows'
    selection_output:
        CommandLine|contains:
            - ' -oN'
            - ' -oJ'
    # Fires two ways: a filename match plus any single arg keyword (original
    # design), OR the category+output-switch pairing alone with no filename
    # match at all — the second path is what survives the PyInstaller rename
    # bypass described above.
    condition: (selection_name and (selection_category or selection_output)) or (selection_category and selection_output)
falsepositives:
    - A security team running LaZagne during an authorised credential-hygiene assessment.
    - Re-review (#232) flagged that the category+output pairing has no name
      anchor, so it can also match an unrelated tool that happens to combine
      those tokens — e.g. nmap's `-p all -oN <file>` (a scope keyword plus its
      normal-format output flag) satisfies both blocks. Triage any hit that
      lacks `lazagne` anywhere on the command line as this class of collision
      first, before escalating as credential harvesting.
level: high
