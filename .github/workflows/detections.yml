name: Detections CI

# WS1.2 detection-as-code gate: validate that the Sigma rules are the single source
# of truth and convert cleanly to Elastic detection rules. (Full experimental->stable
# promotion gating on replayable fixtures is WS2.1.)
# audit #168: runs on EVERY PR, no path filter — a change that looks unrelated
# must not silently skip this gate. Known tradeoff: this also means the
# pysigma MITRE-ATT&CK-data-fetch flakiness (external, rate-limited) can now
# surface on any PR, not just detection-focused ones — not fixable from here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Install the Sigma toolchain
        # pyyaml/requests declared explicitly (security-auditor follow-up,
        # #291) — the "Zeek rules carry the event.dataset scoping
        # condition" step below imports both directly in
        # tests/detections/test_live_fire.py, currently satisfied only as
        # transitive deps of pysigma-backend-elasticsearch. If that ever
        # changes, this step should fail with a normal ModuleNotFoundError,
        # not something that looks unrelated to detections.
        #
        # #330: sigma-cli/pysigma/pysigma-backend-elasticsearch pinned —
        # an unpinned install here silently picks up whatever's newest on
        # PyPI, and a newer pysigma-backend-elasticsearch release changing
        # its Lucene multi-word-term escaping (quoted vs. backslash-escaped
        # — semantically identical, textually different) fails
        # build_kql_docs.py --check below on a diff completely unrelated to
        # the PR. These are the exact versions docs/detections/
        # SIEM_KQL_Documentation.md was generated against, on this job's
        # own pinned Python (.python-version) — see build_kql_docs.py's own
        # docstring for why the Python version matters here too, not just
        # the package versions.
        #
        # To deliberately bump these (all three pins live here, in the
        # live-fire job below, and in deploy_detections.sh — update all
        # three together): under this same Python version, `pip install
        # --upgrade sigma-cli pysigma pysigma-backend-elasticsearch`, run
        # `python scripts/setup/build_kql_docs.py` to regenerate the doc,
        # review the diff, then commit the new pins + the regenerated doc
        # together.
        run: pip install --quiet sigma-cli==3.1.0 pysigma==1.5.0 pysigma-backend-elasticsearch==2.1.1 pytest pyyaml requests

      - name: Install suricata + scapy (#445 — SID registry/pcap-replay promotion gate)
        # Real host package (same choice #443 made for the sensor itself —
        # see configs/suricata/suricata.yaml's header), not a Docker image
        # pull, so this isn't the class of infra flakiness the live-fire
        # job below exists to isolate. scapy builds the small synthetic
        # pcap fixtures the replay harness runs suricata against.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends suricata
          pip install --quiet scapy==2.7.0

      - name: Pipeline consistency tests
        # #286 security-auditor MEDIUM: this used to invoke
        # test_framework_enrichment.py by exact filename, so
        # test_grok_parse_failures.py and the new test_mac_correlation.py
        # never ran in CI at all — the file-scoped invocation meant every
        # new tests/pipeline/*.py needed its own workflow edit to be gated
        # by default. Directory glob so future additions are covered
        # automatically.
        run: python -m pytest tests/pipeline -q

      - name: Dashboard field-mapping tests (#341 — no .keyword on a bare-keyword field)
        # Directory glob, same reasoning as the tests/pipeline step above —
        # a future tests/dashboards/*.py addition is covered automatically.
        run: python -m pytest tests/dashboards -q

      - name: Detection fixture tests (WS2.1 — TP fires, TN regression, promotion gate)
        run: python -m pytest tests/detections/test_sigma_detections.py -q

      - name: Threshold-rule companions are well-formed and paired (issue #192)
        run: python tests/detections/test_threshold_rules.py

      - name: Suricata SID registry + pcap-replay promotion gate (issue #445)
        run: python -m pytest tests/detections/test_suricata_rules.py -v

      - name: Zeek rules carry the event.dataset scoping condition (#291)
        # Compile-only (no live Elasticsearch needed) — security-auditor
        # review found the live-fire proof of this fix lived only in the
        # non-required live-fire job below, so a regression to
        # suburban-soc-ecs.yml's add-condition-zeek-event-dataset
        # transformation (or a future zeek rule missing logsource.service,
        # which pySigma's template substitution would silently render as
        # the literal "event.dataset:zeek.None") could merge with no gate
        # objecting. This class needs only the sigma CLI already installed
        # above, not the live-fire job's Elasticsearch service container.
        run: python -m pytest tests/detections/test_live_fire.py::ZeekEventDatasetScopingTests -v

      - name: Every Sigma rule converts to an Elastic detection rule
        run: |
          set -euo pipefail
          n_rules=$(ls rules/sigma/*.yml | wc -l)
          sigma convert -t lucene -f siem_rule_ndjson \
            -p configs/detections/suburban-soc-ecs.yml rules/sigma/*.yml 2>err.log \
            | grep '^{' > converted.ndjson || { echo "::error::sigma conversion failed"; cat err.log; exit 1; }
          n_conv=$(wc -l < converted.ndjson)
          echo "Converted $n_conv / $n_rules Sigma rules."
          test "$n_conv" -eq "$n_rules" || { echo "::error::expected $n_rules converted rules, got $n_conv"; exit 1; }
          # Each converted rule must query our ECS fields, not the ECS-standard
          # process.command_line (this stack uses process.args).
          ! grep -q "process.command_line" converted.ndjson || { echo "::error::rule queries process.command_line; pipeline mapping is wrong"; exit 1; }

      - name: Setup-script unit tests (#281 — ATT&CK coverage Navigator-layer dedup)
        # security-auditor finding: tests/setup/test_build_attack_coverage.py
        # (#281's own regression guard) was never wired into any workflow —
        # a regression back to the issue's own wrong suggested fix
        # (dedup by techniqueID alone, which drops a real multi-tactic
        # Navigator cell) would merge green with the guard never running.
        # Directory glob, same reasoning as the tests/pipeline/tests/dashboards
        # steps above — also picks up tests/setup/test_systemd_environment_
        # no_expansion.py, itself not run anywhere before this. Runs BEFORE
        # --check below so a real logic regression fails on the assertion,
        # not on a confusing "DRIFT, re-run and commit" message.
        run: python -m pytest tests/setup -q

      - name: ATT&CK coverage matrix is in sync with the rules (WS1.5)
        run: python scripts/setup/build_attack_coverage.py --check

      - name: SIEM KQL docs are in sync with the rules (audit P1-18)
        run: python scripts/setup/build_kql_docs.py --check

      - name: Emulation-to-telemetry map is wired up (purple-team loop is real)
        # Fails on ERRORs only (a referenced sim/rule/log-source is missing, i.e.
        # the map has drifted). Tag-match and exec-bit issues surface as WARN in
        # the log without failing — exec bit is meaningless for .ps1 on Linux, and
        # the .sh sims are committed mode 644.
        run: python tests/validate_emulation_map.py --no-color

      - name: Hunt library is well-formed (WS2.2)
        run: |
          python - <<'PY'
          import glob, sys, yaml
          required = {"id", "title", "hypothesis", "attack", "data_source", "query"}
          hunts = sorted(glob.glob("hunts/*.yml"))
          assert len(hunts) >= 5, f"expected >=5 hunts, found {len(hunts)}"
          bad = []
          for f in hunts:
              h = yaml.safe_load(open(f, encoding="utf-8"))
              missing = required - set(h or {})
              if missing:
                  bad.append(f"{f}: missing {sorted(missing)}")
              if h and h.get("status") == "promoted" and not h.get("promoted_to"):
                  bad.append(f"{f}: status=promoted but no promoted_to")
          assert not bad, "malformed hunts: " + "; ".join(bad)
          print(f"OK: {len(hunts)} hunts well-formed.")
          PY

  # #221: separate job, not a step in `detections` above — that job is a
  # required, no-path-filter merge gate (see the comment at the top of this
  # file) and must never fail because of Elasticsearch container-pull/OOM/
  # health-check flakiness rather than an actual detection-logic regression.
  # This job can go red on infra without blocking any PR until it is
  # deliberately added to branch protection's required checks.
  live-fire:
    runs-on: ubuntu-latest
    # Ephemeral, unauthenticated single-node ES for test_live_fire.py — NOT
    # the production stack (that runs TLS + xpack security; this container
    # exists only for the lifetime of this job and is discarded after). GH
    # Actions waits for the service's health check before running any step,
    # so no manual polling loop is needed here.
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Install the Sigma toolchain
        # #330: pinned to the same versions as the `detections` job above —
        # see that step's comment for why an unpinned install here would
        # silently drift.
        run: pip install --quiet sigma-cli==3.1.0 pysigma==1.5.0 pysigma-backend-elasticsearch==2.1.1 pytest "requests==2.33.0" pyyaml

      - name: Live-fire detection tests against a real Elasticsearch (issue #221)
        # GitHub Actions sets CI=true by default on every runner — test_live_fire.py's
        # _sigma_binary() relies on that to skip its local-dev-only .venv-detections
        # fallback path here, using only the pip-installed sigma-cli on PATH.
        run: python -m pytest tests/detections/test_live_fire.py -v

      - name: Install tcpdump (issue #411 — real packet capture for the Zeek mime-detection live-fire test)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tcpdump

      - name: Zeek mime-detection live-fire tests against the pinned image (issue #411)
        # Same non-required-job placement as the ES live-fire step above, and for the
        # identical reason (this job's header comment): a Docker image-pull or
        # loopback-capture-permission flake here must never block an unrelated PR via
        # the required `detections` job's tests/pipeline glob. SKIPS (not fails) if
        # docker/tcpdump/the pinned image aren't usable on this runner — see the test
        # module's own docstring.
        run: python -m pytest tests/detections/test_zeek_mime_detection.py -v
