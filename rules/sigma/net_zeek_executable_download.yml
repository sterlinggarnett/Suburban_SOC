title: Executable or Script Payload Downloaded Over HTTP (Zeek Files)
id: ffde19ce-a7f2-4637-a25d-eb839b694697
status: experimental
description: |
    Detects transfer of executable or script payloads over HTTP as recorded in
    Zeek's files.log (shipped via Filebeat).
    security-auditor review (#365): the EXPLOITATION emulation
    (tests/anomaly_simulation/sim_malware_download.sh) this description
    previously claimed to "pair with" cannot actually exercise this rule —
    it fetches EICAR over HTTPS (SOP-147-evidence-validation-procedure.md's
    own note: "neither crosses bat0 nor exposes the file to Zeek"), and its
    plaintext fallback yields mime_type=application/zip, which is in
    neither this rule's old 9-entry list nor the new 4-entry one. Filed as
    #383 (not this issue's scope) rather than silently left as a false
    claim now that this description block is being rewritten anyway.
    #217: demoted medium -> low rather than adding an allowlist filter.
    files.log does not carry the HTTP hostname/server (that lives in the
    separately-logged http.log, correlated only via connection uid, which
    this stack's Sigma logsource/fixture convention for zeek/files doesn't
    carry either) - so a legitimate-CDN/update-server allowlist isn't
    achievable at this logsource without fabricating an unverified field.
    Network-layer executable-download detection alone genuinely can't
    distinguish attacker staging from routine software updates without more
    context; correlate with http.log (by uid) or endpoint telemetry before
    escalating a hit from this rule.
    #365: the mime_type list below (kept in sync with the identical list in
    net_zeek_smtp_attachment_executable.yml) was rewritten from 9 entries
    to 4, ALL individually live-verified against the real pinned zeek/zeek
    image (the exact tag+digest enforced by
    tests/pipeline/test_zeek_image_pin.py's EXPECTED_TAG/EXPECTED_DIGEST,
    e.g. configs/systemd/zeek-host-capture.service's own docker invocation
    — NOT docker-compose.yml, which doesn't reference zeek/zeek at all) —
    not general-purpose libmagic, which Zeek does NOT use at all for
    file-analysis MIME detection: it has its own, much narrower,
    independent signature engine
    (base/frameworks/files/magic/libmagic.sig inside the image), confirmed
    via `find`/`ldd` inside the container that no system libmagic is even
    linked. Verified end to end (a real HTTP download of each payload type,
    captured to a real pcap, replayed through the real pinned image,
    files.log's actual mime_type read back) for: a shell script (`#!/bin/bash`
    - Zeek reports `text/x-shellscript`, the exact gap #365 was filed
    over — application/x-sh and application/x-shellscript, both REMOVED
    below, are never produced), a statically-linked ELF, a non-PIE ELF, a
    PIE ELF, a true shared library (.so), and — security-auditor review
    round 2, replacing an initial hand-crafted-PE-header test whose
    representativeness was fairly questioned — three REAL, genuinely
    compiler-produced Windows binaries pulled from this WSL host's own
    mounted C:\Windows (notepad.exe, kernel32.dll, and a real .NET-managed
    assembly, System.dll, each with a full Rich header/section table/CLI
    header a hand-crafted minimal PE lacks): all three landed
    application/x-dosexec, identically to the original synthetic PE test.
    Findings beyond the issue's own literal ask (verified, not assumed):
    application/x-msdownload, application/vnd.microsoft.portable-executable,
    application/x-elf, and application/x-pie-executable (all REMOVED) never
    appear ANYWHERE in the pinned image's entire /usr/local/zeek/share/zeek/
    tree — security-auditor review round 2: broadened from an initial
    single-file grep (just libmagic.sig) to a full recursive grep across
    every script/signature resource the image ships, zero matches — Zeek
    reports EVERY MS-DOS/PE variant tested (2 synthetic + 3 real, EXE or
    DLL) as application/x-dosexec, the one entry kept. Most surprising:
    application/x-pie-executable — added in #228 on the strength of
    "modern libmagic reports this for PIE executables", true for
    general-purpose libmagic but NOT for Zeek's own detector, which cannot
    distinguish a PIE executable from a genuine shared library (both are
    ET_DYN ELF at the byte level) and reports BOTH as application/x-sharedlib
    — meaning #228's own live PIE-executable test case was ALREADY covered
    by the pre-existing application/x-sharedlib entry the whole time; the
    dedicated entry it added was dead weight, not a fix (see the now-
    corrected note in configs/systemd/zeek-host-capture.service's own
    image-bump precedent list, which cited this exact addition as a prior
    "value moved under an upstream rebuild" case — it never did).
    application/x-executable (kept) matches both static and non-PIE
    dynamically-linked ELF binaries.
    #384 (live-verified, 2026-08-17; full methodology, SHA-256 hashes and
    raw files.log records in findings/20260817-384-mime-type-coverage.md):
    #365 confirmed the 4-entry list had no regression, but the review also
    surfaced real pre-existing coverage gaps the old and new lists both
    shared — payload/delivery classes real attackers commonly use that
    neither list has ever covered. Live-tested 13 real payloads (real
    genisoimage/msitools/clang output where a real tool exists, spec-
    accurate hand-built structures only where none does — never an
    arbitrary byte blob) over real plaintext HTTP, captured to a real
    pcap, replayed through the same pinned zeek/zeek:8.2.1 image #365
    used, AND cross-checked every result against Zeek's own signature
    source (base/frameworks/files/magic/*.sig inside the image) so this
    isn't pcap-replay alone. 6 new entries added, each independently
    confirmed both ways:
    - text/x-python, text/x-perl, text/x-ruby: shebang-anchored
      signatures (`^#![^\n]{1,15}bin/(env )?python|perl|ruby`, priority
      60) - a Python/Perl/Ruby dropper is the identical bug class #365
      was filed over (a shell-script gap), just for three more
      interpreters. SHEBANG-GATED, same narrowness class as the batch
      entry below: a `.py`/`.pl`/`.rb` payload with no shebang line at
      all (the normal case for `python stage2.py` or an
      `exec(open(...).read())`-style invocation), or an `env -S`
      shebang (breaks the `(env )?` adjacency), types `text/plain` and
      is NOT covered. Interpreter paths longer than 15 characters
      between `#!` and `bin/` (e.g. a Homebrew-style
      `/opt/homebrew/opt/python@3.11/bin/python3`) also miss.
    - text/x-msdos-batch: THREE distinct signatures, all content-based,
      not extension-based - the payload must literally START with
      `@echo off`, `@rem`, or `@set ` (case-insensitive) to match; a
      batch file starting with a label or a plain command is invisible
      to this signature and falls through to text/plain instead. This
      is a one-keystroke-wide net, not just a narrow one -
      security-auditor review (#384): `@setlocal ...` (a genuinely
      common real first line) misses `@set ` by exactly one missing
      space; a leading blank line, leading whitespace, or a UTF-8 BOM
      before `@echo off` defeats the `^` anchor with zero behavioral
      change to the batch file; `:: comment` or `:LABEL` as line 1 is
      routine in real droppers and also misses. Treat this entry as
      opportunistic coverage of one common authoring style, not as
      T1059.003 coverage - the T1059.003 ATT&CK tag is deliberately NOT
      in this rule's tags below; keep it that way.
    - application/x-ms-shortcut (T1204.002): signature is a fixed
      20-byte magic
      (`^\x4c\x00\x00\x00\x01\x14\x02\x00\x00\x00\x00\x00\xc0\x00\x00\x00
      \x00\x00\x00\x46` - HeaderSize + LinkCLSID per MS-SHLLINK 2.1),
      confirmed with a minimal-but-spec-accurate 76-byte header (no
      optional LinkTargetIDList/LinkInfo/StringData structures, valid
      per their own presence-bit flags) - matches the exact signature
      bytes, not a hand-wavy guess. Covers a BARE .lnk on the wire only
      - security-auditor review (#384): the LNK delivery chain widely
      considered dominant specifically WRAPS the shortcut in an
      .iso/.img/.zip to defeat mail-gateway extension filtering and
      MOTW propagation, which (see the archive gap below) produces NO
      mime_type at all. This entry does not cover that dominant
      variant, only the less-common bare-file case.
    - application/x-mach-o-executable (T1105, macOS cross-platform):
      TWO signatures, both confirmed live, not just one. Thin binaries
      (`^[\xce\xcf]\xfa\xed\xfe`) are confirmed FILETYPE-AGNOSTIC
      directly from source - matches MH_OBJECT/MH_EXECUTE/MH_DYLIB/etc.
      alike, since the filetype field (offset 12) isn't part of the
      magic check - tested with a real clang-cross-compiled object file
      (`clang -target x86_64-apple-macos11`), not a linked executable
      but the identical magic bytes one would carry. Fat/universal
      binaries (`^\xca\xfe\xba\xbe..\x00[\x01-\x14]`) are a SEPARATE
      signature, initially untested - security-auditor review (#384)
      correctly flagged that fat/universal is the dominant modern macOS
      distribution form post-Apple-Silicon and that the thin signature
      structurally cannot match it (different magic entirely,
      `\xca\xfe\xba\xbe` vs `\xce\xfa\xed\xfe`/`\xcf\xfa\xed\xfe`).
      Closed, not just disclosed: built a REAL universal binary
      (`llvm-lipo -create` combining genuine x86_64+arm64 clang objects,
      Debian's `llvm` package, no macOS SDK needed) and live-fire
      confirmed it produces the SAME `application/x-mach-o-executable`
      mime_type - one entry in this list genuinely covers both thin and
      fat Mach-O, not just the thin case.
    Two classes tested and confirmed as REAL, PERMANENT gaps - not
    addable via mime_type, disclosed rather than silently absorbed:
    - .ps1/.vbs/.js/.wsf all typed `text/plain` - Zeek has no distinct
      signature for PowerShell/VBScript/JScript/WSF content at all.
      Adding `text/plain` to this list would match literally any
      plaintext HTTP download (logs, configs, READMEs) - too broad to
      ever be a specific signal at this logsource. T1059.001/.005/.007
      genuinely cannot be covered here; needs endpoint telemetry
      (Sysmon ScriptBlockText) instead. .hta also typed `text/plain`'s
      sibling `text/html` (HTA is just HTML+script to Zeek's detector) -
      same "too broad" verdict, also NOT added.
      `proc_creation_win_mshta_remote.yml` is NOT a substitute for this
      gap: it requires `CommandLine|contains: http|javascript|vbscript`
      alongside `mshta.exe`, so a locally-saved `.hta` invoked by bare
      path (`mshta.exe C:\Users\...\dropper.hta`) fires neither that
      rule nor this one - a real, currently uncovered T1218.005 delivery
      chain, not just a network-layer gap with an endpoint-side
      fallback.
    - Archive/container formats (.iso tested, real genisoimage output,
      valid CD001 signature at the standard 32769-byte offset) produce
      NO mime_type at all - confirmed both live and via source (no
      ISO9660 signature exists anywhere in the image's magic/*.sig
      files). Same structural gap class #382 found for SMTP: an absent
      mime_type can never match this rule's equality selection, and
      Zeek's file-analysis framework doesn't recurse into archives at
      all - an EXE inside a .zip/.7z/.iso is invisible regardless of
      what's in this list. T1566.001's "over-claims blanket coverage"
      concern from this issue is confirmed real for exactly this reason
      (this is also why the LNK entry above only covers the bare-file
      case, not the dominant ISO-wrapped one).
    One unplanned, security-relevant finding beyond this issue's own
    ask: a minimal real MSI (msitools' msibuild, genuine OLE Compound
    File output, confirmed magic `\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1`)
    types as `application/msword` - Zeek's own signature file comments
    this heuristic as "non-specific and terrible but ... there doesn't
    seem to be a better option" (base/frameworks/files/magic/office.sig).
    Deliberately NOT added to this list: application/msword would match
    every legitimate Word-document download (a payload class this rule
    was never meant to flag), and Zeek's file-analysis framework cannot
    distinguish a malicious MSI installer (T1218.007) from a real .doc
    at this logsource - a genuine, currently-unclosable blind spot, not
    an oversight. Filed as #417 for anyone who wants to pursue a
    hash/heuristic-based secondary check instead of mime_type filtering.
    Tags deliberately UNCHANGED by #384, recorded so this reads as a
    decision, not an oversight: an ATT&CK tag for LNK delivery
    (T1204.002) and one for scripting (the T1059 family) were considered
    and rejected for this rule specifically - the LNK entry only covers
    the non-dominant bare-file delivery (see above), and the script
    entries are shebang-gated/content-anchored narrow enough that
    tagging the broader technique would overclaim coverage this rule
    doesn't actually have. `docs/detections/attack-coverage.md`'s rollup
    intentionally does not count this rule toward those techniques.
    security-auditor review (#384) also flagged that this single
    `level: low` OR-block now spans very different real-world base rates
    - a bare LNK or Mach-O hit is far higher-fidelity than a routine
    shell-script download, but inherits the same severity. Not split
    here (a bigger design/test-invariant change than a mime_type-list
    fix); filed as #418.
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://docs.zeek.org/en/master/logs/files.html
author: Suburban-SOC
date: 2026-06-18
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    product: zeek
    service: files
detection:
    selection_transport:
        source: 'HTTP'
    selection_payload:
        mime_type:
            - 'application/x-dosexec'
            - 'application/x-executable'
            - 'application/x-sharedlib'
            - 'text/x-shellscript'
            - 'text/x-python'
            - 'text/x-perl'
            - 'text/x-ruby'
            - 'text/x-msdos-batch'
            - 'application/x-ms-shortcut'
            - 'application/x-mach-o-executable'
    condition: selection_transport and selection_payload
falsepositives:
    - Legitimate software distribution, installers, and update downloads
    - Internal patch-management or deployment traffic
    - Provisioning and configuration-management scripts fetched over
      plaintext HTTP (cloud-init, kickstart %post, PXE, internal
      artifact/mirror servers) - security-auditor review (#384), the
      dominant real source of text/x-shellscript/text/x-python/
      text/x-perl/text/x-ruby hits on this rule, not package-manager
      installs (pip/gem/cpan are HTTPS and ship archives, both opaque
      to this rule)
level: low
