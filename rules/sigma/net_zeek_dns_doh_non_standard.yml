title: DNS Lookup for a Known Public DNS-over-HTTPS Provider — Blind to Hardcoded-IP DoH Clients
id: ea6d5688-e872-4d41-b362-80d1e2bd7b56
status: experimental
description: |
    Detects a plain DNS query resolving the hostname of a major public DoH
    (DNS-over-HTTPS) resolver. This catches only the plaintext lookup phase
    a client performs before establishing the encrypted DoH channel (or a
    client/browser probing DoH availability) — it does not and cannot detect
    the DoH traffic itself, which is opaque HTTPS and never produces a
    dns.log entry for the tunneled queries. A host actually using DoH with a
    hardcoded resolver IP (skipping this lookup entirely) is invisible to
    this rule; see net_zeek_ssl_self_signed_c2 / conn rules in this batch for
    complementary encrypted-channel coverage. #426 (code-reviewer finding,
    same class of bug #410 fixed for the SMTP rules): this caveat did not
    survive into docs/detections/SIEM_KQL_Documentation.md (title/tags/
    query only) — fixed by moving it into the title itself, the one field
    every downstream rendering keeps. security-auditor review (#426): an
    earlier draft of the title suffix read "Hostname-Lookup Phase Only,"
    which named WHEN this rule sees traffic, not the operationally
    relevant fact of WHAT it misses — an analyst reading only the title
    still had to infer that a hardcoded-resolver-IP client is invisible.
    Reworded to state that gap directly, since it's the one an attacker
    can actually exploit to stay undetected.
    On a campus network, DoH bypasses whatever DNS-based content filtering
    or detection the organization relies on, which is the actual risk this
    rule flags — not that DoH itself is malicious.
    Two fixes from security-auditor round 2: the Quad9 entry matched only
    the literal `dns.quad9.net` and missed the hostnames browsers actually
    configure (`dns9`/`dns10`/`dns11.quad9.net`) — widened to the bare
    `quad9.net` suffix. Also added `use-application-dns.net`, Firefox's DoH
    canary domain: Firefox queries this before enabling DoH and disables it
    if the query returns NXDOMAIN, so a filtering resolver expected to
    NXDOMAIN it makes this the single strongest DoH-adoption signal
    available on this logsource — its absence from the round-1 list was an
    oversight given how directly it fits this rule's exact purpose.
    #428 (security-auditor finding, #426's own review): `query|endswith`
    against a bare suffix like `quad9.net` (no leading dot) is an
    UNANCHORED match — `evilquad9.net` shares the same trailing 9
    characters and fired this rule despite not being a Quad9 hostname at
    all, exactly the attacker-registrable lookalike-domain gap this fix
    closes. Rewritten to selection_bare (exact match on each literal
    hostname) OR selection_subdomain (a genuine dot-anchored subdomain,
    e.g. `.quad9.net`) — this preserves every currently-covered real
    value (the bare hostnames themselves, and the dns9/dns10/dns11.
    quad9.net subdomains #228's own round-2 review widened this rule
    for) while excluding the same-suffix-but-different-registrable-
    domain lookalike class. Does NOT make this rule unforgeable
    (security-auditor finding): it matches on the observed query, not
    the response, so any host that can send a DNS packet can emit an
    arbitrary label under a real provider domain (e.g. `dig
    <random>.quad9.net` in a loop) and produce a hit without controlling
    that domain at all — this closes the lookalike-REGISTRATION trick,
    not lookalike-EMISSION. A hit on a random-looking subdomain of a
    real provider is an emission signal, not proof the query resolved
    or that a real DoH bootstrap followed. Same underlying gap in
    net_zeek_dns_crypto_mining_pool.yml (fixed in the same change, one
    severity tier higher at level: medium) — see that rule's own
    description for the same caveat in that rule's context.
    #434 decision: pursued the threshold/cardinality-companion option
    (rules/elastic/threshold/net-zeek-dns-doh-non-standard-cardinality.ndjson)
    rather than a response-side qualifier on this rule itself — buckets
    matching queries by source.ip and alerts on >=10 distinct
    dns.question.name values in a 10-minute window, catching the volume
    shape a scripted forged-query loop produces (many random-looking
    labels) that a real client's one-or-two-hostname DoH bootstrap does
    not. This rule (the single-event logic-of-record) is unchanged and
    still carries the emission-only caveat above — the companion adds a
    corroborating signal, it does not replace or narrow this rule's own
    matching. See that companion's own description for the full
    tradeoffs (not live-verified end to end; still forgeable below the
    cardinality bar; NAT/proxy false-positive risk).
references:
    - https://attack.mitre.org/techniques/T1572/
author: Suburban-SOC
date: 2026-08-06
tags:
    - attack.command_and_control
    - attack.t1572
logsource:
    product: zeek
    service: dns
detection:
    selection_bare:
        query:
            - 'cloudflare-dns.com'
            - 'dns.google'
            - 'dns.google.com'
            - 'doh.opendns.com'
            - 'quad9.net'
            - 'doh.cleanbrowsing.org'
            - 'doh.libredns.gr'
            - 'dns.nextdns.io'
            - 'use-application-dns.net'
    # Invariant (#428): each entry here must be "." + the matching
    # selection_bare entry, same order — a future domain added to only
    # one of the two lists reintroduces either an unanchored-suffix gap
    # (bare-only) or drops real subdomain coverage (subdomain-only).
    selection_subdomain:
        query|endswith:
            - '.cloudflare-dns.com'
            - '.dns.google'
            - '.dns.google.com'
            - '.doh.opendns.com'
            - '.quad9.net'
            - '.doh.cleanbrowsing.org'
            - '.doh.libredns.gr'
            - '.dns.nextdns.io'
            - '.use-application-dns.net'
    condition: selection_bare or selection_subdomain
falsepositives:
    - Organization-approved DoH usage (if a deployment intentionally standardizes on one of these providers, allowlist it here rather than treating every hit as an incident).
    - Browsers with DoH enabled by default performing routine background lookups even when not actively used for resolution.
    - A hit on a random-looking subdomain of a real provider domain is an emission signal only — this rule matches the observed query, not the response, so any host that can send a DNS packet can produce a hit under a real provider domain without controlling that domain or the query actually resolving.
level: low
