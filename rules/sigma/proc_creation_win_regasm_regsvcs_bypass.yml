title: Regasm/Regsvcs Proxy Execution
id: 1e68b1e5-1a1c-452f-b57c-ca4a5def0fd7
status: experimental
description: |
    Detects regasm.exe or regsvcs.exe invoked with the uninstall switch
    (`/U`, the path attackers prefer since it runs the assembly's
    `[ComUnregisterFunction]`-attributed method) or against an assembly
    staged in a user-writable directory. A prior draft of this rule
    required a user-writable directory unconditionally, which a relative
    path or an unlisted directory (ProgramData, Downloads) trivially
    defeated; the `/U` flag is now matched independently of path.
references:
    - https://attack.mitre.org/techniques/T1218/009/
author: Suburban-SOC
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1218.009
logsource:
    category: process_creation
    product: windows
detection:
    selection_binary:
        Image|endswith:
            - '\regasm.exe'
            - '\regsvcs.exe'
    selection_signal:
        CommandLine|contains:
            - '/u'
            - '\appdata\'
            - '\temp\'
            - '\users\public\'
            - '\programdata\'
            - '\downloads\'
    condition: selection_binary and selection_signal
falsepositives:
    - Legitimate .NET COM-interop assembly registration/unregistration during install or CI, especially from ProgramData or a temp staging directory.
level: medium
