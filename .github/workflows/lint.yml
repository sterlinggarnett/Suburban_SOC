name: Lint

# audit #168: always-on style/type gate — runs on every PR and push to main
# with NO path filter, unlike detections.yml/soar-tests.yml. A bash-only or
# reporting-script-only change must not skip every automated check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install shellcheck
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-stable/shellcheck /usr/local/bin/shellcheck

      - name: Run shellcheck on every tracked .sh file
        run: git ls-files '*.sh' | xargs shellcheck -S warning

  ruff:
    name: ruff (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      # Pinned: unpinned installs drifted to whatever ruff shipped that day
      # (e.g. 0.16.x enabling UP045 by default), failing every PR on 144
      # pre-existing findings unrelated to any given diff. Bump deliberately.
      - run: pip install --quiet ruff==0.15.15
      - run: ruff check .

  mypy:
    name: mypy (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - run: pip install --quiet mypy
      - name: Run mypy on every tracked .py file
        run: git ls-files '*.py' | xargs mypy --ignore-missing-imports --follow-imports=silent

  yamllint:
    name: yamllint (configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - run: pip install --quiet yamllint
      - run: yamllint -c .yamllint configs/

  compose-config:
    name: docker compose config (interpolation/syntax)
    # #303: yamllint/bash -n/pytest all validate DIFFERENT layers than Compose's
    # own variable-interpolation pass, which runs on the raw YAML string before
    # any shell-word splitting. A bare `$` (not `$$`, `${VAR}`, or `$VAR`)
    # anywhere in a command: block — including inside a `#`-comment, since
    # Compose has no concept of "this text is a bash comment, skip it" — fails
    # the WHOLE file with "invalid interpolation format" and nothing else here
    # would catch it. This is the single check that actually would have caught
    # #303 before it reached a live `docker compose up`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # No .env / real credentials needed — `config -q` only resolves and
      # validates the compose file, it never starts anything. Unset vars
      # just interpolate to blank (Compose's own warning, not a failure).
      - name: Validate scripts/setup/docker-compose.yml
        run: docker compose -f scripts/setup/docker-compose.yml config -q

      - name: Validate scripts/setup/docker-compose.ha.yml
        run: docker compose -f scripts/setup/docker-compose.ha.yml config -q
