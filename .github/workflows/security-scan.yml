name: Security Scan

# WS3.6 vulnerability management: scan the SOC's own images + Python dependencies.
# Fails on CRITICAL findings (blocks a known-critical CVE from merging). The weekly
# schedule is the patch-cadence checkpoint (see docs/SOP-008-vuln-management.md).
on:
  pull_request:
    paths:
      - "scripts/setup/ai_agent/**"
      - "scripts/hive-mind-broker/**"
      - "scripts/setup/docker-compose*.yml"   # audit P2-15: scan the compose IaC too
      - "configs/elasticsearch/**"
      - "configs/systemd/**"                  # #355: covers the zeek/zeek pin (#293)
      - "scripts/setup/*.sh"                  # #355: covers the zeek/zeek pin (#293)
      - "tests/pipeline/test_zeek_image_pin.py" # #355: the zeek-image job's own pin source
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly patch cadence
  workflow_dispatch:

jobs:
  dependencies:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: pip install --quiet pip-audit
      - name: Audit AI-agent dependencies
        run: pip-audit -r scripts/setup/ai_agent/requirements.txt
      - name: Audit hive-mind-broker dependencies
        # PYSEC-2026-161 (starlette) fix is 1.0.1, which FastAPI doesn't yet support
        # (it caps starlette < 0.50). Tracked exception until FastAPI catches up —
        # see docs/SOP-008-vuln-management.md. pip-audit still fails on any NEW vuln.
        run: pip-audit -r scripts/hive-mind-broker/requirements.txt --ignore-vuln PYSEC-2026-161

  images:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-agent
            context: scripts/setup/ai_agent
          - name: hive-mind-broker
            context: scripts/hive-mind-broker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build ${{ matrix.name }} image
        run: docker build -t suburban-soc/${{ matrix.name }}:scan ${{ matrix.context }}
      - name: Trivy — fail on CRITICAL (fixed) vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: suburban-soc/${{ matrix.name }}:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  zeek-image:
    # #355: the zeek/zeek image #293 pinned to a specific tag+digest sits
    # outside `images`' matrix above (no local Dockerfile to build — it's a
    # remote, pre-published image, scanned by reference instead) and is now
    # frozen indefinitely by that pin, with no automatic path back to a
    # patched build except a human bumping it. Reads EXPECTED_TAG/
    # EXPECTED_DIGEST directly from tests/pipeline/test_zeek_image_pin.py
    # (the same constants that test enforces the 4 real capture paths match)
    # rather than duplicating the value here, so this job can never scan a
    # stale reference that's already drifted from what the repo actually pins.
    name: Container image scan (Trivy) (zeek/zeek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Resolve the pinned zeek/zeek reference
        id: zeek-ref
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "tests/pipeline")
          import test_zeek_image_pin as t
          print(f"image=zeek/zeek:{t.EXPECTED_TAG}@{t.EXPECTED_DIGEST}")
          PY
      - name: Trivy — fail on CRITICAL (fixed) vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.zeek-ref.outputs.image }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  iac:
    name: IaC / compose misconfig scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy config — scan the docker-compose + ES config (audit P2-15)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: scripts/setup
          severity: CRITICAL,HIGH
          exit-code: "1"
