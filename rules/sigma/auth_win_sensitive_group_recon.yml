title: Object Access Against a Privileged AD Group
id: 802b55c8-1dc9-4583-ad04-211274b5e5cb
status: experimental
description: |
    Detects a handle-to-object request (Security 4661) targeting a
    well-known privileged Active Directory group — Domain Admins,
    Enterprise Admins, Schema Admins, or the builtin Administrators group.
    4661 fires on read access as well as modification, so this is a
    reconnaissance-capable signal (an attacker enumerating who's in these
    groups before targeting them) — independent of and complementary to
    this repo's existing auth_win_priv_group_membership_change.yml, which
    only catches actual membership additions/removals, not read-only
    enumeration.
    Matches on the group's display name AND its well-known SID suffix in
    parallel, the same locale/rename-invariant pattern this repo's existing
    auth_win_priv_group_membership_change.yml already established for
    membership CHANGES — applied here for read-only enumeration instead.
    (Round-1 claimed ObjectName also carries a "resolved group name"
    representation for 4661 specifically, sourced from assumption rather
    than a verified reference — corrected: matching on name alone is not
    proven reliable for this event, which is exactly why the SID-suffix
    arm, not the name arm, is this rule's load-bearing detection path.)
    RID suffix uses `endswith`, not `contains` (security-auditor round 1): a
    domain SID's sub-authority components (S-1-5-21-A-B-C-RID) are shared
    across every object in the domain, so `contains: '-512'` would false-
    fire on any unrelated object whose A/B/C component happens to start
    with those digits (e.g. `...-5129999999...-1105`, RID 1105, not Domain
    Admins) — every object touched under a SACL in an unlucky domain, not
    an edge case. Anchoring to the end of the string is what makes this a
    RID match rather than a substring coincidence. Includes -544
    (Administrators, a builtin SID rather than a domain-relative RID, but
    still endswith-matchable) — missing from round 1 despite the sibling
    membership-change rule already covering it correctly.
    Needed configs/endpoint/winlogbeat.yml to add EventID 4661 to the
    collected Security-channel list (#229 prerequisite fix). Requires the
    "Audit SAM" and/or "Audit Directory Service Access" advanced audit
    subcategory AND a SACL configured on the target group object(s) —
    4661 is not emitted for arbitrary objects by default even with the
    subcategory enabled, the same operational prerequisite shape as this
    repo's existing DCSync rule (auth_win_dcsync_replication_rights_used.yml).
references:
    - https://attack.mitre.org/techniques/T1069/002/
author: Suburban-SOC
date: 2026-08-07
tags:
    - attack.discovery
    - attack.t1069.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4661
    selection_name:
        ObjectName|contains:
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - 'Administrators'
    selection_rid:
        ObjectName|endswith:
            - '-512'
            - '-519'
            - '-518'
            - '-544'
    condition: selection and (selection_name or selection_rid)
falsepositives:
    - Legitimate AD administration or auditing tooling enumerating privileged group membership as part of routine access reviews — baseline expected accounts/tools before escalating every hit.
    - Domain-joined workstations resolving group membership as part of normal Kerberos/Group Policy processing may incidentally reference these objects; scope the underlying SACL narrowly to reduce this before deploying.
level: medium
