# ============================== Filebeat inputs ===============================
# Suburban-SOC Zeek Integration — authoritative config (matches SOP-002)
# Stack: ELK 9.3.2 | Input: Zeek JSON logs via filestream

filebeat.inputs:
  - type: filestream
    id: zeek-logs
    enabled: true
    paths:
      - /storage/PCAP/zeek_logs/*.log
      # #291: scripts/setup/zeek_run_pcap.sh (offline PCAP-replay analysis)
      # writes into a per-pcap subdirectory (zeek_logs/<pcap_name>/<stream>.log)
      # so the live-capture path's bare zeek_logs/<stream>.log filenames stay
      # untouched by that script's own re-run/no-collision behavior — this
      # second glob is what makes Filebeat actually pick up the replay logs.
      - /storage/PCAP/zeek_logs/*/*.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    # Zeek detection logs are tiny and volatile: a single Scan::Port_Scan in
    # notice.log is ~336 B, and the live capture stream rewrites it in place with
    # the SAME size on every restart. Two failure modes to avoid:
    #   * fingerprint default length (1024 B) skips files smaller than that, so
    #     detection logs never ship while bulky conn/dns/ssl logs do;
    #   * native (inode/offset) identity is content-blind — a same-size rewrite
    #     leaves the offset at EOF, so the NEW notice is silently never re-read.
    # Use fingerprint identity with the 64 B floor: it hashes the first 64 bytes,
    # so it both harvests small files (>=64 B) AND detects content changes (a
    # different notice => different fingerprint => re-read from 0 => ships), which
    # native cannot. Changing file_identity invalidates the registry — deploy with
    # `systemctl stop filebeat && rm -rf /var/lib/filebeat/registry && start`.
    prospector.scanner.fingerprint.enabled: true
    prospector.scanner.fingerprint.length: 64
    file_identity.fingerprint: ~
    # #228 (M13 US5): Zeek http.log's `host` field (the Host header) is a bare
    # string landing at the event root (target: "" above) — Filebeat's own
    # `host.*` object (host.name etc.) is injected by the publisher pipeline
    # AFTER input processors run and unconditionally overwrites it, destroying
    # the value before Logstash ever sees it. Verified empirically: without
    # this rename, a synthetic http.log line with host="evil.example.com"
    # arrives at Logstash as {"host":{"name":"<filebeat-hostname>"}} — Zeek's
    # value is gone, not just unmapped. Renaming here (input-processor stage,
    # before that merge) is the only point that survives it.
    #
    # Scoped to http.log specifically (security-auditor + code-reviewer, #228
    # round 1): this input's glob covers every Zeek log type, and conn.log,
    # known_hosts.log, software.log, and known_services.log all carry their
    # own unrelated top-level `host` field (an asset IP, not an HTTP Host
    # header) that an unscoped rename would mislabel as zeek.http.host -
    # worse than the pre-fix behavior, which just silently dropped it.
    # fail_on_error deliberately left at its default (true, not false):
    # ignore_missing already covers the legitimate no-`host`-field case: a
    # real rename failure should surface in the Filebeat log, not repeat the
    # exact silent-failure mode this processor exists to close.
    processors:
      - rename:
          when:
            regexp:
              log.file.path: 'http\.log$'
          fields:
            - {from: "host", to: "zeek.http.host"}
          ignore_missing: true

  # #443/#444 (M23): Suricata's eve.json, written by suricata-host-capture.
  # service (configs/systemd/) under the same /storage/PCAP tree Zeek uses,
  # per docs/detections/suricata-evaluation.md's own recommended path — no
  # new transport, same Filebeat -> Logstash :5044 pipe as the Zeek input
  # above. `event.module`/`event.dataset` stamping and the alert.* -> ECS
  # rule.*/threat.technique.* mapping happen downstream in Logstash
  # (configs/logstash.conf's eve.json branch, #444), not here.
  - type: filestream
    id: suricata-eve
    enabled: true
    paths:
      - /storage/PCAP/suricata/eve.json
      # rotate-interval: day (configs/suricata/suricata.yaml) renames the
      # active file and starts a fresh eve.json daily — this second glob
      # picks up the dated rotated files the same way the Zeek input's
      # second glob covers zeek_run_pcap.sh's own per-run subdirectories.
      - /storage/PCAP/suricata/eve.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    # Same fingerprint-identity reasoning as the Zeek input above: eve.json
    # is a single actively-rewritten file, and a content-blind native
    # (inode/offset) identity risks the same same-size-rewrite blind spot
    # documented there. No Suricata-specific record has been measured small
    # enough to need the same 64 B floor override, but there's no reason to
    # expect eve.json's alert/flow records behave differently from Zeek's
    # own small notice.log records, so the same floor is used defensively.
    prospector.scanner.fingerprint.enabled: true
    prospector.scanner.fingerprint.length: 64
    file_identity.fingerprint: ~

  # #556: the capture host's own syslog — systemd unit-lifecycle lines
  # (`<unit>.service: Failed with result '...'`) and script-emitted FATAL
  # lines (verify_ca_fingerprint.sh) are already on disk here (rsyslog
  # already captures them; a 30-day event.dataset aggregation over the live
  # indices was 100% zeek.* before this input existed — no syslog, no
  # journal, so no unit-level failure was ever observable in the SIEM). This
  # is what makes SOC self-integrity detectable at all: without it, a unit
  # in `failed` state or a CA-pin mismatch produces a journal line nobody
  # queries. Deliberately added HERE (this host's own deployed config, not
  # configs/endpoint/filebeat_endpoint.yml, which already ships /var/log/
  # syslog for OTHER hosts but is not what actually runs on the capture
  # host) rather than asking operators to also stand up a second Filebeat
  # instance for one file.
  - type: filestream
    id: capture-host-syslog
    enabled: true
    paths:
      - /var/log/syslog
    # Same fingerprint-identity reasoning as the two inputs above: a small,
    # append-only-but-rotatable text file, where a content-blind native
    # (inode/offset) identity risks the same same-size-rewrite blind spot
    # documented there (logrotate's copytruncate mode in particular). No
    # syslog line has been measured small enough to need the 64 B floor the
    # Zeek input uses, but there's no reason to expect otherwise, so the
    # same floor is applied defensively.
    prospector.scanner.fingerprint.enabled: true
    prospector.scanner.fingerprint.length: 64
    file_identity.fingerprint: ~

# ============================== Tenant attribution ===========================
# Edge-stamping (WS0.3): each deployment sets TENANT_ID so every shipped event
# carries [tenant][id]. Storage routing, ES role isolation, and tenant-scoped
# response all key on this. Use a lowercase slug (e.g. "home-smith"); defaults
# to "unassigned" so events are never dropped, just clearly unattributed.
fields_under_root: true
fields:
  tenant:
    id: "${TENANT_ID:unassigned}"

# ============================== Logstash Output ===============================
output.logstash:
  # LOGSTASH_HOST env var allows team members to change target without editing this file.
  # Default: localhost:5044 (works for Docker stack on same host)
  hosts: ["${LOGSTASH_HOST:localhost:5044}"]
  # WS3.1: encrypt telemetry in transit. Logstash's Beats input serves a CA-signed
  # cert; verify it against the stack CA. Ship the CA to the endpoint and point
  # FILEBEAT_CA at it (default path matches the agent-deploy bundle).
  ssl.enabled: true
  ssl.certificate_authorities: ["${FILEBEAT_CA:/etc/filebeat/certs/ca.crt}"]
  ssl.verification_mode: "${FILEBEAT_SSL_VERIFY:full}"
  # WS3.1 mTLS: Logstash's Beats input requires client authentication
  # (ssl_certificate_authorities is set). Present this CA-signed client cert as
  # Filebeat's identity, or the server rejects the batch with "tls: certificate
  # required". Generated by the docker-compose `setup` service (filebeat cert).
  ssl.certificate: "${FILEBEAT_CERT:/etc/filebeat/certs/filebeat.crt}"
  ssl.key: "${FILEBEAT_KEY:/etc/filebeat/certs/filebeat.key}"
