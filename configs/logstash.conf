input {
  # Standard Beats input for endpoint logs (Winlogbeat / Sysmon / Filebeat)
  # WS3.1: TLS terminated here so Filebeat->Logstash telemetry is encrypted in
  # transit (no plaintext on :5044). Server cert is the dedicated logstash cert
  # signed by the stack CA (see setup); clients verify it against ca.crt.
  beats {
    port => 5044
    tags => ["endpoint_logs"]
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    # #219: ssl_certificate_authorities alone does not by itself guarantee
    # client-cert enforcement - configs/network/filebeat.yml asserted the
    # server "requires client authentication" with nothing in this file
    # actually setting that. Verified live, both directions, via
    # scripts/setup/verify_encryption.sh (which checks Logstash's own log
    # output, not just the TLS client's handshake summary - a clean
    # client-side "Verify return code: 0 (ok)" from a certless probe does NOT
    # by itself prove the server accepted the connection: under TLS 1.3 that
    # summary reflects the client verifying the SERVER's cert, which
    # completes before the server has even processed the client's empty
    # Certificate message):
    #   - WITH a valid client cert (the filebeat cert): connects normally.
    #   - WITHOUT one: Logstash immediately logs and closes the connection -
    #     "SSLHandshakeException: (certificate_required) Empty client
    #     certificate chain".
    ssl_client_authentication => "required"
  }
  
  # Network tap input (Zeek / Suricata / Syslog).
  # SECURITY (audit P1-8): this input is PLAINTEXT and is intentionally NOT
  # published to the host — docker-compose maps only :5044 (Beats, TLS), so :5514 is
  # reachable only by peers on the internal `soc-mesh-net` bridge, never the LAN.
  # That is the only reason plaintext is acceptable here. To harden for a routed/
  # production deployment, terminate TLS on this input (ssl_enabled => true with the
  # logstash cert, as the :5044 beats input does) and switch every :5514 shipper to
  # https — do NOT expose :5514 to the host without TLS.
  http {
    port => 5514
    host => "0.0.0.0"   # mesh-internal only; not in compose `ports:` (see above)
    tags => ["network_logs"]
  }
}

filter {
  # --- WS0.3: tenant attribution ---
  # Every event must carry a tenant id. The beats shippers edge-stamp [tenant][id];
  # the :5514 http input and any unstamped source default to "unassigned" so data is
  # never dropped, just clearly unattributed. The id becomes part of the index name,
  # so force lowercase for Elasticsearch index-name validity.
  if ![tenant][id] {
    mutate { add_field => { "[tenant][id]" => "unassigned" } }
  }
  mutate { lowercase => ["[tenant][id]"] }
  # #286 security-auditor HIGH: [tenant][id] was validated nowhere before this
  # — safe as long as it only ever fed a WRITE index name (ES itself rejects
  # a malformed one, e.g. containing "," or "*", so a bad value just errored
  # the write). #286 adds the first READ use of this field (the uid-keyed
  # correlation's `index => "logstash-security-%{[tenant][id]}"` below) —
  # unlike a write, a read index pattern is fail-OPEN: "*" reads every
  # tenant, "a,logstash-security-victim" is an explicit cross-tenant read.
  # Same slug grammar erase_tenant.sh already enforces (scripts/setup/
  # erase_tenant.sh:35) — fail closed to "unassigned" (a real, always-valid
  # tenant, same fallback the block above uses) rather than let a malformed
  # value reach either the write or the new read path. _invalid_tenant_id is
  # a high-fidelity forged/malformed-event signal: no legitimate shipper
  # produces one.
  if [tenant][id] !~ /\A[a-z0-9][a-z0-9-]{1,38}\z/ {
    mutate {
      replace => { "[tenant][id]" => "unassigned" }
      add_tag => ["_invalid_tenant_id"]
    }
  }

  # --- Category 0: Zeek logs shipped by Filebeat from /storage/PCAP/zeek_logs ---
  # Filebeat's ndjson parser already expanded each line into top-level fields, so
  # Zeek's native keys (id, source, ts, note, auth_success, mime_type) arrive as-is.
  # These come in tagged "endpoint_logs" (Beats input :5044), NOT "network_logs",
  # so they would otherwise skip all parsing. Here we (a) stamp event.dataset from
  # the source filename (conn.log -> zeek.conn) — the field the verifier, the
  # dashboards, and #286's uid-keyed correlation below all key on — and (b) tag
  # them "zeek" (WS1.4's per-source Data Quality panel dimension; #286 review:
  # despite this comment's own prior claim, the output{} block below has no
  # "zeek" in [tags] branch — every event, zeek-tagged or not, lands in the same
  # logstash-security-<tenant> data stream, not a separate zeek-* index).
  # Zeek's nested `id` object and string `source` field collide with the ECS
  # mappings in logstash-security-* (HTTP 400) otherwise.
  if [log][file][path] =~ "zeek_logs" {
    grok {
      match => { "[log][file][path]" => "/(?<zeek_stream>[a-z0-9_]+)\.log$" }
      tag_on_failure => ["_zeek_path_nomatch"]
    }
    if [zeek_stream] {
      mutate {
        add_field    => { "[event][dataset]" => "zeek.%{zeek_stream}" }
        # WS1.4: event.module is the per-source dimension for the Data Quality
        # heartbeat panel (last-seen per source per tenant).
        add_field    => { "[event][module]" => "zeek" }
        add_tag      => ["zeek"]
        remove_field => ["zeek_stream"]
      }
    }

    # Zeek files.log/http.log use `source` as a plain string (e.g. "HTTP"); move
    # it aside so `source` can hold the ECS source.* object without a string-vs-
    # object mapping collision.
    if [source] {
      mutate { rename => { "[source]" => "[zeek][source]" } }
    }

    # Map Zeek-native connection fields (stored as literal dotted keys) to ECS so
    # the dashboards' panels populate. note/auth_success/mime_type are left intact
    # for the issue-#22 verifier.
    mutate {
      rename => {
        "[id.orig_h]"   => "[source][ip]"
        "[id.resp_h]"   => "[destination][ip]"
        "[id.orig_p]"   => "[source][port]"
        "[id.resp_p]"   => "[destination][port]"
        "[proto]"       => "[network][transport]"
        "[service]"     => "[network][protocol]"
        "[query]"       => "[dns][question][name]"
        # #228 (M13 US5): qtype_name/rcode_name were only ever mapped in the
        # network_logs branch below, which real Filebeat-shipped Zeek data
        # never reaches (see the zeek.ssl comment a few lines down for the
        # same gap already found and fixed once). dns_txt_record_abuse and
        # dns_dga_nxdomain_burst select on these; without this they'd be
        # silent no-ops identical in shape to #217's ImagePath defect.
        "[qtype_name]"  => "[dns][question][type]"
        # ECS is dns.response_code (flat, underscore) - matched exactly to
        # suburban-soc-ecs.yml's field-mapping-zeek-dns target.
        "[rcode_name]"  => "[dns][response_code]"
        "[method]"      => "[http][request][method]"
        "[status_code]" => "[http][response][status_code]"
        # #228 rule-writing phase: uri/request_body_len needed by
        # http_cobalt_strike_beacon / http_exfil_large_post. `host` is
        # handled separately, upstream in filebeat.yml (input-processor
        # rename), not here - see that file's comment for why. user_agent/
        # resp_bytes deliberately NOT renamed here (code-reviewer, #228
        # round 2): no rule selects on them yet, and suburban-soc-ecs.yml
        # doesn't map them either - add both together, in the same commit,
        # when a rule actually needs one.
        "[uri]"               => "[url][path]"
        "[request_body_len]"  => "[http][request][body][bytes]"
        # Needed by conn_icmp_tunnel_large's volume threshold.
        "[orig_bytes]"  => "[source][bytes]"
        # #286: mac-logging (config.zeek, below) writes these onto conn.log
        # ONLY — this is the fix for HALF of #286's two stacked breaks (the
        # rename existed only in the dead network_logs branch, same defect
        # shape as qtype_name/rcode_name above). source.mac is already
        # mapped `keyword` in logstash-security-template.json. The OTHER
        # half — getting this onto the zeek.intel event that actually
        # triggers SOAR containment — is the uid-keyed lookup in the
        # zeek.intel branch below, since intel.log never carries L2
        # addresses itself.
        "[orig_l2_addr]" => "[source][mac]"
        "[resp_l2_addr]" => "[destination][mac]"
      }
    }
    # #267: some zeek.notice types (e.g. detect-bruteforcing's
    # Password_Guessing) set Notice::Info$src without $conn, so notice.log
    # carries a bare top-level src field but no id sub-record — the generic
    # id.orig_h rename above never fires for them, leaving source.ip empty.
    # Scan::Port_Scan sets $conn too, so it is already covered; this is a
    # fallback only, never overwriting a value the generic rename already set.
    if [event][dataset] == "zeek.notice" and ![source][ip] and [src] {
      mutate { rename => { "[src]" => "[source][ip]" } }
    }

    # WS2.4: skip GeoIP for RFC1918 / loopback / link-local / ULA — internal IPs never
    # resolve, so the lookup is pure per-event overhead on internal conn telemetry.
    if [source][ip] and [source][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
      geoip { source => "[source][ip]" target => "[source]" }
    }
    if [destination][ip] and [destination][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
      geoip { source => "[destination][ip]" target => "[destination]" }
    }

    # WS2.4 (parse-drop fix): Zeek software.log emits a structured `version` record as
    # literal dotted keys (version.major/minor/addl). logstash-security-* maps `version`
    # as keyword, so the implied object collides -> document_parsing_exception (HTTP 400,
    # event dropped). Keep the human-readable string in ECS package.version and drop the
    # dotted numerics so nothing named version.* reaches ES.
    if [event][dataset] == "zeek.software" {
      if [unparsed_version] { mutate { rename => { "[unparsed_version]" => "[package][version]" } } }
      mutate {
        # Cover both shapes the Filebeat ndjson codec can deliver: literal dotted
        # string keys ("version.major") and a proper nested object (version.major).
        # The bare "[version]" removal alone resolves the collision; the rest make it
        # unambiguous regardless of codec behavior. remove_field on an absent key is a
        # no-op, so listing both forms is safe.
        remove_field => [
          "[version.major]", "[version.minor]", "[version.minor2]", "[version.minor3]", "[version.addl]",
          "[version][major]", "[version][minor]", "[version][minor2]", "[version][minor3]", "[version][addl]",
          "[version]"
        ]
      }
    }

    # --- #160: ECS-normalize zeek.ssl TLS fields (SNI + Cipher dashboard panels) ---
    # zeek.ssl arrives via Filebeat (tagged endpoint_logs) and is handled HERE in
    # Category 0 — NOT the network_logs branch below, which already maps these but
    # which real Filebeat-shipped Zeek data never reaches. Filebeat's ndjson codec
    # delivers server_name/cipher/curve/version/validation_status as top-level keys;
    # rename to ECS tls.* so the Network dashboard "SNI / Server Name (TLS)" and
    # "Cipher Suite Audit" panels (which query tls.client.server_name / tls.cipher)
    # populate. Scoped to zeek.ssl so the generic `version` key can't collide with
    # the zeek.software version handling above.
    if [event][dataset] == "zeek.ssl" {
      mutate {
        rename => {
          "[server_name]"       => "[tls][client][server_name]"
          "[cipher]"            => "[tls][cipher]"
          "[curve]"             => "[tls][curve]"
          "[version]"           => "[tls][version]"
          "[validation_status]" => "[tls][validation_status]"
        }
      }
    }

    # --- WS1.1: Zeek Intel framework hits (intel.log) -> ECS threat.indicator.* ---
    # The Intel framework (configs/intel/) matches live-feed indicators (WS1.3) against
    # connections and writes intel.log. Mapping the hit to ECS is what makes the SOAR
    # trigger fire on a REAL match — it replaces the dead `[threat][indicator][domain]`
    # condition (nothing ever set that field). Zeek JSON emits literal dotted keys.
    if [event][dataset] == "zeek.intel" {
      mutate {
        rename => {
          "[seen.indicator]"      => "[threat][indicator][value]"
          "[seen.indicator_type]" => "[threat][indicator][type]"
          "[seen.where]"          => "[threat][indicator][sighting]"
          "[sources]"             => "[threat][feed][name]"
        }
        add_tag => ["intel_match", "CRITICAL_THREAT"]
      }
      # Route the indicator value into the typed ECS field so detections/dashboards
      # can key on threat.indicator.ip / threat.indicator.domain.
      if [threat][indicator][type] == "Intel::ADDR" {
        mutate { add_field => { "[threat][indicator][ip]" => "%{[threat][indicator][value]}" } }
      } else if [threat][indicator][type] == "Intel::DOMAIN" {
        mutate { add_field => { "[threat][indicator][domain]" => "%{[threat][indicator][value]}" } }
      }

      # #286: uid-keyed conn.log<->intel.log correlation — MAC-based
      # containment's real load-bearing fix. mac-logging (config.zeek)
      # writes orig_l2_addr/resp_l2_addr onto conn.log ONLY; intel.log
      # never carries L2 addresses itself, so source.mac (the SOAR webhook
      # body's source_mac, built further down this pipeline) stays empty
      # for every zeek.intel-triggered containment without this. `uid` is
      # Zeek's own per-connection correlation key (present on both logs —
      # Intel::Info logs it whenever the match's Seen record carries
      # connection context, which every IP/host-based indicator match does)
      # and effectively collision-free, so an exact match is sufficient —
      # no time-window narrowing needed.
      #
      # DIRECTION-AWARE, on purpose (security-auditor round 1 HIGH): only
      # populate source.mac when the indicator matched the RESPONDER side
      # ([threat][indicator][sighting] == "Conn::IN_RESP", set from
      # seen.where above) — i.e. an internal device (source.ip = id.orig_h)
      # connecting OUT to a known-bad IP. In that direction, orig_l2_addr is
      # the internal originator's real MAC, observable on the monitored
      # link, and correctly pairs with source.ip for containment. For the
      # OTHER direction (Conn::IN_ORIG — a known-bad IP connecting IN to an
      # internal host), source.ip is the external attacker's IP, but
      # orig_l2_addr is NOT the attacker's MAC — it's the last-hop L2
      # address on the monitored link, i.e. the gateway/router's MAC. Since
      # operators are explicitly instructed (governance/exclusion_list.txt)
      # to list router MACs as protected assets, populating source.mac here
      # would make agent.py's is_excluded(ip=.., mac=..) match the ROUTER
      # and silently suppress containment of a genuine external attacker —
      # the opposite of this feature's intent. destination.mac (the
      # internal victim's MAC in that direction) is deliberately NOT
      # collected either: nothing consumes it (the broker always blocks by
      # source.ip; a MAC field only feeds the exclusion check and the audit
      # trail for source.ip's own device), and containment always targets
      # the external attacker's IP, never the internal victim's device.
      #
      # KNOWN LIMITATION (code-reviewer round 1: this undersold the failure
      # mode — corrected): this is a live query against this event's own
      # tenant index at the moment intel.log is processed, not a replay.
      # Zeek writes conn.log at connection TEARDOWN (inactivity timeout,
      # FIN/RST) — often minutes or more after a match on a still-active
      # connection fires, since intel matches typically trigger near
      # connection START (e.g. the first packet to a known-bad IP). That
      # means the traffic pattern this feature exists for MOST — a long-
      # lived, actively-beaconing C2 connection — is also the pattern MOST
      # likely to have no conn.log record yet when this lookup runs, not
      # merely an edge case. Short/already-closed connections (a blocked
      # scan probe, a single completed DNS lookup) are the case that reliably
      # works today. Accepted for this fix regardless: even a partial hit
      # rate is strictly better than the current "always empty" for every
      # match, and a delayed/asynchronous re-enrichment (replaying intel.log
      # once its conn.log record exists) is a larger design change, out of
      # scope here — tracked as a follow-up. The soar_mac_correlation_miss
      # tag below exists so this could be measured, but nothing consumes it
      # yet (security-auditor round 2: no slo_metrics.py metric, no
      # dashboard panel — the hit rate is not actually monitored today,
      # only queryable ad-hoc in Kibana; building that is a follow-up).
      #
      # FURTHER LIMITATIONS (security-auditor round 2):
      # - Conn::IN_RESP sightings come from Zeek's connection_established
      #   handler, which is TCP-only — a UDP or ICMP connection to a
      #   known-bad IP can never produce a sighting this gate keys on, so
      #   it can never be MAC-enriched regardless of timing.
      # - The RFC1918 check just above (source.ip must be internal) closes
      #   the case where an internal address is itself an intel indicator,
      #   but does NOT fix a routed topology where the originating device
      #   is on a different L2 segment than the sensor (a second VLAN, a
      #   mesh node behind a router, a WAN-side tap): orig_l2_addr there is
      #   still the gateway's MAC even though source.ip is genuinely
      #   internal. This needs either a MAC-to-IP consistency check against
      #   the asset inventory, or accepting that this feature's device-
      #   level attribution is only reliable when the sensor shares an L2
      #   segment with monitored devices — a topology precondition, not
      #   fixable in Logstash. Tracked as a follow-up.
      #
      # `uid` guard: security-auditor round 1 HIGH — Logstash conditionals
      # compile to Ruby/Joni regex, where ^/$ match LINE boundaries, not
      # string boundaries. A uid value with an embedded newline could pass a
      # ^...$ check on its first line while smuggling arbitrary Lucene
      # query_string syntax on a later line into the sprintf-interpolated
      # `query` below. \A/\z are true STRING anchors — use those, plus an
      # explicit length bound (real Zeek uids are ~18 chars; 64 is a
      # generous ceiling that still bounds the interpolated query size).
      # security-auditor round 2 MEDIUM: Conn::IN_RESP alone means "the bad
      # indicator matched the connection's RESPONDER" — it does NOT by
      # itself guarantee the ORIGINATOR (source.ip, whose MAC we're about
      # to trust) is actually an internal device. If an internal IP is ever
      # itself an intel indicator (a locally-added entry for a known-
      # compromised host, a honeypot, a recycled address in a feed), an
      # INBOUND connection to it also produces Conn::IN_RESP, with
      # source.ip = the external attacker and orig_l2_addr = the gateway
      # again — the exact suppression round 1 found, on a narrower trigger.
      # Require source.ip to actually BE internal (same RFC1918/ULA
      # predicate already used for the geoip guards above and at the SOAR
      # signing block below) before trusting its MAC.
      if [uid] and [uid] =~ /\A[A-Za-z0-9]{1,64}\z/
         and [threat][indicator][sighting] == "Conn::IN_RESP"
         and [source][ip] =~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|fc|fd)/ {
        elasticsearch {
          hosts   => ["${ELASTIC_HOSTS:https://elasticsearch:9200}"]
          index   => "logstash-security-%{[tenant][id]}"
          # Scoped to this SAME event's own (now-validated, see the tenant
          # guard above) tenant index (WS0.3/WS0.5 isolation) and to
          # zeek.conn specifically, so a uid collision across unrelated
          # event.dataset values (extremely unlikely regardless — Zeek uids
          # are effectively unique) can't matter.
          # Exact-match correctness here depends on `uid` mapping to
          # `keyword` (not analyzed `text`) in logstash-security-template.json
          # — it does, via that template's strings_as_keyword dynamic
          # catch-all, same as note/auth_success/mime_type (the other
          # Zeek-native passthrough fields this pipeline leaves unmapped
          # deliberately, per Category 0's own comment above).
          query   => "uid:%{[uid]} AND event.dataset:zeek.conn"
          fields  => { "[source][mac]" => "[source][mac]" }
          sort    => "@timestamp:desc"
          # security-auditor round 2 HIGH: an explicit `timeout` option was
          # here in round 1 to bound worst-case pipeline stall — REMOVED.
          # Could not verify against a live Logstash instance (no
          # `logstash --config.test_and_exit` available in this
          # environment) whether `timeout` is actually a declared option on
          # logstash-filter-elasticsearch (vs. only the OUTPUT plugin) — an
          # unrecognized option is a fatal ConfigurationError at pipeline
          # startup, which would silently blind the entire stack, a far
          # worse outcome than the stall this was meant to bound. Verify
          # against the real plugin version before re-adding (tester-
          # debugger follow-up); until then this filter has no explicit
          # request timeout, same as every other elasticsearch use in this
          # file.
          # security-auditor round 1 CRITICAL: logstash_internal (used
          # everywhere else in this pipeline) holds ONLY logstash_writer —
          # write/manage, no read privilege at all — so this query would
          # 403 on every single event using that credential, making this
          # entire fix silently inert. A dedicated, read-only credential
          # (#286, configs/elasticsearch/roles/logstash_enrich_reader.json)
          # exists specifically so this lookup can read without widening
          # the shared Logstash/agent credential's privileges — see
          # docker-compose.yml's #286 provisioning comment for why NOT
          # logstash_internal.
          user     => "${LOGSTASH_ENRICH_USER:logstash_enrich}"
          password => "${LOGSTASH_ENRICH_PASS:}"
          ssl_enabled => true
          ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
          # security-auditor round 1 MEDIUM: without this, a genuine query
          # failure (bad credential, ES down) is indistinguishable from
          # "conn.log not indexed yet" — both just leave source.mac unset.
          # Split them: a real failure tags _mac_enrich_failed (a config/
          # permission bug, should be investigated); the accepted race
          # below tags soar_mac_correlation_miss (expected, bounded by the
          # KNOWN LIMITATION above). Neither tag currently feeds a metric
          # or dashboard (security-auditor round 2: tracked as a follow-up,
          # not yet built) — until one exists, treat these as available for
          # ad-hoc Kibana investigation, not as an active alert.
          tag_on_failure => ["_mac_enrich_failed"]
        }
        # code-reviewer round 1: a zero-hit result and a never-attempted
        # lookup were indistinguishable from the outside (source.mac just
        # stays unset either way). Tag a definite miss so it's queryable —
        # but ONLY when the lookup itself succeeded and genuinely found
        # nothing; a query FAILURE already gets its own, more specific
        # _mac_enrich_failed tag above, and must not also count as a
        # "miss" (security-auditor round 2: the miss tag was firing on
        # failures too, silently absorbing every credential/connectivity
        # problem into what's supposed to be a benign, expected rate).
        if ![source][mac] and "_mac_enrich_failed" not in [tags] {
          mutate { add_tag => ["soar_mac_correlation_miss"] }
        }
      }

      # #177: the ntfy push output (below, in the output{} block) is a public
      # third-party relay — mask the source IP in that notification's text by
      # default (last octet -> .0), computed into [@metadata] so the indexed
      # [source][ip] field itself is never touched. NOTIFY_INCLUDE_RAW_IOCS=true
      # (same flag name/shape as the AI agent's) restores the unmasked IP.
      if [source][ip] {
        mutate { add_field => { "[@metadata][notify_source_ip]" => "%{[source][ip]}" } }
        if "${NOTIFY_INCLUDE_RAW_IOCS:false}" != "true" {
          mutate { gsub => [ "[@metadata][notify_source_ip]", "\.\d+$", ".0" ] }
          # gsub only matches a trailing IPv4 octet, so an IPv6 address (no dotted
          # tail) would otherwise pass through this untouched and reach the ntfy
          # output below fully unmasked (audit #177). Fail safe: anything still
          # containing a colon after the IPv4 attempt gets a fixed placeholder.
          if [@metadata][notify_source_ip] =~ ":" {
            mutate { replace => { "[@metadata][notify_source_ip]" => "[masked-ipv6]" } }
          }
        }
      }
      # The :5514 HTTP input enriches every request with transport metadata
      # (user_agent/http/url + the posting client's host.ip). None of these belong to a
      # Zeek intel record, and `user_agent` arrives as an ECS object which collides with
      # the strict keyword mapping -> document_parsing_exception (HTTP 400, event dropped
      # silently). Gate the strip on [user_agent] so it only touches the :5514 HTTP-input
      # path: Filebeat-shipped intel.log (:5044) carries none of these, and we must keep
      # its host.ip sensor provenance intact for multi-sensor correlation.
      if [user_agent] {
        mutate { remove_field => ["[user_agent]", "[http]", "[url]", "[host][ip]"] }
      }
    }
  }

  # --- Category 1: Network & Application Telemetry ---
  if "network_logs" in [tags] {
    # Parse standard Zeek/Suricata JSON outputs if applicable
    json {
      source => "message"
      target => "network_parsed"
    }
    
    # Map raw fields to ECS Network & Application fields + Zeek IPs.
    # NOTE: targets MUST use Logstash bracket notation ([source][ip]) — a dotted
    # string target ("source.ip") creates a *flat* field literally named
    # "source.ip", which the GeoIP conditional below (`if [source][ip]`) never
    # matches, so GeoIP silently never ran. ECS transport/protocol also follow
    # Zeek semantics (matching the Beats/Zeek branch above): Zeek `proto` is the
    # L4 transport (tcp/udp/icmp) and `service` is the application protocol
    # (dns/http/ssl) — these were previously swapped.
    mutate {
      rename => {
        "[network_parsed][id.orig_h]"   => "[source][ip]"
        "[network_parsed][id.resp_h]"   => "[destination][ip]"
        "[network_parsed][id.orig_p]"   => "[source][port]"
        "[network_parsed][id.resp_p]"   => "[destination][port]"
        "[network_parsed][proto]"       => "[network][transport]"
        "[network_parsed][service]"     => "[network][protocol]"
        "[network_parsed][query]"       => "[dns][question][name]"
        "[network_parsed][qtype_name]"  => "[dns][question][type]"
        # #228 round-2 review: kept in sync with the Category 0 branch and
        # field-mapping-zeek-dns's dns.response_code target — this branch
        # isn't fully dead, it's reachable via the :5514 HTTP input.
        "[network_parsed][rcode_name]"  => "[dns][response_code]"
        "[network_parsed][method]"      => "[http][request][method]"
        "[network_parsed][status_code]" => "[http][response][status_code]"
        # Phase A: SOAR MAC enrichment — maps Zeek conn MAC fields to ECS
        # Requires @load policy/protocols/conn/mac-logging in local.zeek
        "[network_parsed][orig_l2_addr]" => "[source][mac]"
        "[network_parsed][resp_l2_addr]" => "[destination][mac]"
        # Component 2: SSL/TLS telemetry from Zeek ssl.log (Network Dashboard)
        # Requires @load base/protocols/ssl in local.zeek
        "[network_parsed][server_name]"       => "[tls][client][server_name]"
        "[network_parsed][cipher]"            => "[tls][cipher]"
        "[network_parsed][curve]"             => "[tls][curve]"
        "[network_parsed][version]"           => "[tls][version]"
        "[network_parsed][validation_status]" => "[tls][validation_status]"
        # Component 1: surface Zeek notice/ssh fields for MITRE/NIST tagging
        "[network_parsed][note]"         => "note"
        "[network_parsed][auth_success]" => "auth_success"
      }
    }

    # GeoIP Enrichment for Kibana Dashboards
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "[source]"
      }
    }
    if [destination][ip] {
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
      }
    }
  }

  # --- Category 2: Host, Process, & Identity Telemetry ---
  if "endpoint_logs" in [tags] {
    # WS1.4: per-source dimension for the Data Quality heartbeat (last-seen per
    # source per tenant). Windows (Winlogbeat) vs Linux auth (Filebeat).
    if [winlog] {
      mutate { add_field => { "[event][module]" => "windows" } }
    } else if [log][file][path] =~ /(auth\.log|secure)$/ {
      # M13 US7 (#230/#243) security review: configs/endpoint/filebeat_endpoint.yml
      # collects BOTH /var/log/auth.log (Debian/Ubuntu) AND /var/log/secure
      # (RHEL/CentOS) into this same input, but this condition only ever
      # matched the first - every RHEL/CentOS host silently never got
      # event.module=system stamped, and all 5 auth_linux_* rules require
      # exactly that field. Also anchored and escaped the dot (was an
      # unescaped "auth.log" wildcard-matching "authXlog" too).
      mutate { add_field => { "[event][module]" => "system" } }
    }
    # If processing Windows Sysmon Events via Winlogbeat
    if [winlog][channel] == "Microsoft-Windows-Sysmon/Operational" {
      mutate {
        rename => {
          "[winlog][event_data][Image]"             => "process.executable"
          "[winlog][event_data][OriginalFileName]"  => "process.pe.original_file_name"
          "[winlog][event_data][CommandLine]"       => "process.args"
          "[winlog][event_data][ParentImage]"       => "process.parent.name"
          "[winlog][event_data][ParentCommandLine]" => "process.parent.args"
          "[winlog][event_data][User]"              => "user.name"
          "[winlog][event_data][TargetUserName]"    => "user.target.name"
          "[winlog][event_data][TargetFilename]"    => "file.path"
          "[winlog][event_data][Hashes]"            => "file.hash.sha256"
        }
      }
      # M13 US3 (#233/#234) found the OriginalFileName rename was missing:
      # field-mapping-sysmon-process-creation in
      # configs/detections/suburban-soc-ecs.yml had claimed
      # OriginalFileName -> process.pe.original_file_name since before this
      # batch, but nothing here ever performed that rename, so every rule
      # filtering on OriginalFileName (8 rules added in this batch, verified
      # by grep) compiled to a query against a field real data never
      # populates — a silent permanent no-op, the same #217 shape (a mapping
      # claim the pipeline doesn't honor). Confirmed no pre-existing rule
      # used OriginalFileName before this batch, so this had never surfaced.
      # Security review (#233) then found the SAME shape a second time,
      # still latent: ecs.yml also claims ParentCommandLine ->
      # process.parent.args, which this block never performed either — added
      # above too, pre-emptively, though no rule uses it yet (a landmine for
      # whichever future rule is first to reference it).
      # ----------------------------------------------------------------------
      # WS1.2: Sigma detection logic is NO LONGER inlined here. The 10 rules in
      # rules/sigma/*.yml are the single source of truth, deployed to the Elastic
      # Detection Engine by scripts/setup/deploy_detections.sh (pySigma). They run
      # against logstash-* and raise alerts in Security → Alerts, with native MITRE
      # ATT&CK coverage. This block now only normalizes Sysmon fields to ECS above;
      # detection + ATT&CK/NIST classification live in the rules, not the pipeline.
      # ----------------------------------------------------------------------
    }

    # Component 3: Windows Security events (4624/4625 login tracking)
    if [winlog][channel] == "Security" {
      if [winlog][event_id] == 4625 {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      }
      if [winlog][event_id] == 4624 {
        mutate { add_field => { "[event][outcome]" => "success" } }
      }
    }

    # If processing Linux Auth Logs (/var/log/auth.log or /var/log/secure)
    # Cheap literal pre-filter: auth.log is dominated by sudo/cron/systemd/PAM
    # lines that can never match the sshd grok. Gating on "sshd[" keeps those
    # tens-of-thousands of lines out of the grok engine entirely (ingest-lag
    # hygiene) and shrinks the attacker-controlled-input surface for backtracking.
    # M13 US7 (#230/#243) security review: same RHEL/CentOS gap as the
    # event.module condition above - /var/log/secure carries identically-
    # formatted sshd lines on that OS family and was never matched here.
    if [log][file][path] =~ /(auth\.log|secure)$/ and "sshd[" in [message] {
      # #161: capture into ECS BRACKET notation ([source][ip], not the dotted
      # "source.ip"). The dotted form creates a *flat* key that the geoip
      # conditional below (`if [source][ip]`) never matches — the exact trap the
      # network_logs NOTE documents, and why source geoip silently never ran for
      # SSH sources. `(?:invalid user )?` also captures brute-force attempts
      # against non-existent accounts (the bulk of attacker traffic), which the
      # old pattern dropped entirely.
      #
      # SECURITY (grok anchoring): the username is ATTACKER-CONTROLLED and is
      # echoed BEFORE the client IP that sshd appends. A non-greedy, unanchored
      # capture lets `user=victim from 8.8.8.8 port 22` bind [source][ip] to the
      # injected IP and drop the real one (source-IP/country spoof, geoip-guard
      # evasion, HUNT-002 poisoning). So the pattern is fully anchored (^…$) and
      # the username is GREEDY: the trailing, sshd-supplied `from <ip> port <n>`
      # is always the LAST match and therefore always wins. NOTSPACE (not WORD)
      # for the auth method covers `keyboard-interactive/pam`. timeout_millis
      # bounds worst-case backtracking on adversarial input.
      # M13 US7 (#230/#243) security review: modern OpenSSH (~6.8+) appends a
      # key-fingerprint suffix to publickey accept/fail lines - "... port
      # 54321 ssh2: RSA SHA256:<b64>" - which the old pattern's `\s*$` right
      # after the optional " ssh2" could never match (a literal colon and
      # fingerprint text isn't whitespace), silently grokparsefailure-ing
      # every publickey auth line, success or failure. `(?:\:.*)?` consumes
      # that optional trailing fingerprint; it sits entirely AFTER the
      # username/IP/port capture the anchoring above protects, so it cannot
      # reopen that injection vector - it only ever matches content sshd
      # itself appends at the very end of an already-fully-anchored line.
      grok {
        match => { "message" => "^%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:[host][name]} sshd\[%{POSINT:[process][pid]}\]: %{WORD:[event][outcome]} %{NOTSPACE:[system][auth][method]} for (?:invalid user )?%{GREEDYDATA:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]}(?:\s+ssh2)?(?:\:.*)?\s*$" }
        timeout_millis => 1000
      }
      # Normalize the sshd auth verb to ECS event.outcome. Raw logs emit
      # "Failed password ..." / "Accepted publickey ..." -> grok captures
      # "Failed"/"Accepted"; the Endpoint dashboard panels query
      # event.outcome:failure, so without this the SSH panels never match.
      if [event][outcome] =~ /(?i)^fail/ {
        mutate { replace => { "[event][outcome]" => "failure" } }
      } else if [event][outcome] =~ /(?i)^accept/ {
        mutate { replace => { "[event][outcome]" => "success" } }
      }
      # #161: geoip-enrich the SSH client (attacker) source IP so the Endpoint
      # dashboard "Failed SSH by Country" panel (buckets on
      # source.geo.country_name) populates. Inbound brute-force sources only get
      # source.geo here — the zeek/network geoip filters never touch auth.log.
      # Guard RFC1918/loopback/link-local/ULA — internal IPs never resolve (same
      # guard as the Category 0 zeek branch).
      if [source][ip] and [source][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
        geoip { source => "[source][ip]" target => "[source]" }
      }
    }
  }

  # --- Category 2.5: ABAC Contextual Data Enrichment (NIST 800-162) ---
  if [user][name] {
    translate {
      field => "[user][name]"
      destination => "[user][abac_attribute]"
      dictionary_path => "/usr/share/logstash/config/lookups/abac-attributes.csv"
      fallback => "unassigned"
      refresh_interval => 300
    }
  }
  if [winlog][event_data][LogonType] {
    translate {
      field => "[winlog][event_data][LogonType]"
      destination => "[event][logon_type_desc]"
      dictionary_path => "/usr/share/logstash/config/lookups/windows-logon-type.csv"
      fallback => "unknown"
      refresh_interval => 300
    }
  }

  # --- Category 3: Operational Metadata Enrichment ---
  # Component 4 (audit P2-4): ingest timestamp for the Document Lag panel, pinned to
  # UTC so it matches @timestamp regardless of the JVM/host timezone. The previous
  # sprintf %{+...} form rendered in JVM-local TZ, skewing the document-lag math.
  ruby { code => "event.set('[event][created]', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ'))" }
  mutate {
    add_field => {
      "[@metadata][pipeline]" => "security-enrichment"
    }
    # Ensure all field copies capture structural tracking metrics
    copy => {
      "[agent][name]" => "agent.hostname"
      "[log][file][path]" => "log.file.path"
    }
  }

  # Component 4: tag parse failures for the Data Quality dashboard
  if "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] {
    mutate {
      add_field => { "[pipeline][error]" => "true" }
    }
  }

  # #252: process.args/process.parent.args/ScriptBlockText/ImagePath carry
  # attacker-controlled content and are mapped ignore_above (#249/#250,
  # raised from 1024 to 8191; #263 raised again to 32766, the Lucene keyword
  # term byte ceiling, after 8191 turned out to still be below real
  # PowerShell 4104 chunk sizes and encoded command-line lengths, letting
  # both PowerShell rules AND system_win_suspicious_service_binpath_lolbin.yml
  # be bypassed by payload length). A value longer than that ceiling is
  # silently dropped from the index while staying in _source - a query can
  # never find it. Tag it instead of leaving the drop invisible -
  # metric_field_truncation_count() in slo_metrics.py turns this into a
  # measured rate. Keep `ceiling` below in lockstep with the template's
  # ignore_above - a mismatch would tag values that are actually indexed
  # fine as falsely truncated (tests/pipeline/test_field_truncation.py's
  # CeilingConsistencyTests enforces this as a CI gate, not just a comment).
  #
  # #263 review (security-auditor + tester-debugger, live-verified): two
  # bugs found in this exact block.
  # (1) ignore_above is a CHARACTER count but Lucene's own per-term hard
  #     limit is a UTF-8 BYTE count (32766) - a value under the char ceiling
  #     but byte-heavy (multi-byte UTF-8, e.g. Unicode identifier/homoglyph
  #     obfuscation in ScriptBlockText - a real T1027 technique, not
  #     theoretical) doesn't get gracefully ignore_above-dropped, it makes
  #     Elasticsearch reject the WHOLE DOCUMENT: confirmed live, HTTP 400
  #     document_parsing_exception -> illegal_argument_exception "Document
  #     contains at least one immense term ... UTF8 encoding is longer than
  #     the max length 32766". That's total event loss - strictly worse than
  #     the original bug (one field silently unindexed, document and every
  #     other field survives). Guarded below by clamping to byte_ceiling
  #     (kept under 32766 for margin: lowercase_normalizer's case-folding,
  #     applied by ES after this filter runs, can grow a small number of
  #     Unicode code points' byte length, e.g. U+0130 -> 2 bytes becomes a
  #     3-byte decomposition) before the value ever reaches Elasticsearch.
  # (2) The Sysmon `mutate.rename` block above (~line 514) targets bare
  #     dotted strings ("process.args", not "[process][args]"), which
  #     Logstash creates as a FLAT field literally named "process.args" -
  #     not the nested structure this filter's long_fields keys expect
  #     (same footgun this file already documents at its network-rename
  #     block, ~line 441). Confirmed live: event.get("[process][args]")
  #     returns nil for real Sysmon-sourced events, so process.args/
  #     process.parent.args were never actually tagged - dead code since
  #     whenever the Sysmon rename block was introduced. winlog.event_data.
  #     ScriptBlockText is unaffected (nothing renames it, always genuinely
  #     nested). Worked around here by falling back to the flat dotted key
  #     when the nested lookup misses, rather than fixing the rename block
  #     itself - that touches 9 renames feeding the whole Sysmon rule
  #     surface and needs its own dedicated regression pass, deliberately
  #     out of scope for a mapping-ceiling issue. Tracked as #328.
  ruby {
    code => '
      long_fields = {
        "[process][args]" => "process.args",
        "[process][parent][args]" => "process.parent.args",
        "[winlog][event_data][ScriptBlockText]" => "winlog.event_data.ScriptBlockText",
        "[winlog][event_data][ImagePath]" => "winlog.event_data.ImagePath"
      }
      ceiling = 32766
      byte_ceiling = 32000
      hit = []
      byte_hit = []
      long_fields.each do |bracket_path, label|
        actual_path = bracket_path
        val = event.get(bracket_path)
        if val.nil?
          val = event.get(label)
          actual_path = label
        end
        next unless val.is_a?(String)
        if val.length > ceiling
          # ignore_above (== ceiling) makes ES skip indexing this field on
          # its own, safely, before Lucene ever sees the term - that skip is
          # exactly what pipeline.truncated exists to make visible. No byte
          # check needed here: this branch and the one below are mutually
          # exclusive by construction (checking bytesize unconditionally,
          # then clamping, would silently swallow every char-ceiling hit
          # into byte_hit instead - since UTF-8 byte length is never less
          # than char length, byte_ceiling < ceiling means it would always
          # fire first - making pipeline.truncated permanently dead. Caught
          # by hand-deriving this fixture set against the real logic before
          # shipping it, not just trusting the first draft passed tests.)
          hit << label
        elsif val.bytesize > byte_ceiling
          # Under the ignore_above char ceiling, so ES will attempt to index
          # this term - but multi-byte UTF-8 content can still push the BYTE
          # length past the Lucene hard per-term limit even while the CHAR
          # length stays under `ceiling` (impossible for pure ASCII, where
          # bytes==chars exactly - only reachable via genuinely multi-byte
          # content, e.g. Unicode identifier obfuscation in ScriptBlockText).
          # Confirmed live: unclamped, this crashes the WHOLE document
          # (HTTP 400 document_parsing_exception -> illegal_argument_exception
          # "Document contains at least one immense term ... whose UTF8
          # encoding is longer than the max length 32766"), not just this
          # field - total event loss, strictly worse than the bug #263 set
          # out to fix. byteslice+scrub clamps at a safe byte length,
          # repairing any multi-byte character split by the cut.
          val = val.byteslice(0, byte_ceiling).scrub
          event.set(actual_path, val)
          byte_hit << label
        end
      end
      if hit.any?
        event.set("[pipeline][truncated]", "true")
        event.set("[pipeline][truncated_fields]", hit)
        event.tag("pipeline_truncated")
      end
      if byte_hit.any?
        event.set("[pipeline][byte_clamped]", "true")
        event.set("[pipeline][byte_clamped_fields]", byte_hit)
        event.tag("pipeline_byte_clamped")
      end
    '
  }

  # --- Category 3.5: WS3.4 PII minimization (data minimization at ingest) ---
  # SOC 2 Privacy / data-handling: keep only what detection & response need. Strip
  # high-risk payload/secret fields that carry user content or credentials but add
  # nothing to security analytics. Dropping them at ingest means they never land in
  # Elasticsearch, snapshots, or the right-to-erasure surface. See SOP-012.
  mutate {
    remove_field => [
      "[http][request][body][content]",   # request payloads (form data, uploads)
      "[http][response][body][content]",   # response payloads
      "[http][request][headers][cookie]",  # session cookies
      "[http][request][headers][authorization]", # bearer/basic creds
      "[http][request][headers][set-cookie]",
      "[url][password]", "[url][username]", # credentials embedded in URLs
      "[user][password]", "[user][full_name]", "[user][email]" # not needed for detection
    ]
  }
  # Redact obvious secrets left inline in the raw message (password=, token=, api_key=)
  # and in the grok-extracted [user][name]. Attacker-controlled "invalid user"
  # strings from SSH brute force (#161) are copied into user.name before this stage,
  # so the message-only gsub used to leave a pasted credential (e.g. login as
  # `password=hunter2`) verbatim in user.name — persisted to ES/snapshots past the
  # right-to-erasure surface (SOP-012). Redact both. Keeps the event for analytics.
  if [message] or [user][name] {
    mutate {
      gsub => [
        "message", "(?i)(password|passwd|pwd|token|api[_-]?key|secret|authorization)\s*[=:]\s*\S+", "\1=[REDACTED]",
        "[user][name]", "(?i)(password|passwd|pwd|token|api[_-]?key|secret|authorization)\s*[=:]\s*\S+", "\1=[REDACTED]"
      ]
    }
  }

  # --- Category 4: Threat Detection & Alerting ---
  # WS1.1: the hardcoded demo IOC (185.150.115.115) is GONE. Threat detection is now
  # driven by the live intel feed (WS1.3) via the Zeek Intel framework — see the
  # `zeek.intel` block above, which tags real matches CRITICAL_THREAT + intel_match.

  # --- Category 5: Framework Enrichment (MITRE ATT&CK + NIST CSF) ------------
  # Classify NETWORK (Zeek) detections with ECS threat.* + NIST CSF function so the
  # Executive dashboard's MITRE heatmap / NIST donut aggregate correctly.
  # WS1.2: ENDPOINT (Sigma) ATT&CK classification is no longer done here — those
  # detections are Elastic Detection Engine rules now, carrying their own MITRE
  # threat mapping; coverage shows in Security → Alerts / MITRE ATT&CK coverage and
  # the WS1.5 matrix. Only the Zeek scan/brute detections remain pipeline-classified.

  # -- Network detections (Zeek) --
  # T1046 — Zeek port-scan notice -> Discovery
  if [note] == "Scan::Port_Scan" {
    mutate { add_field => {
      "[threat][technique][id]"   => "T1046"
      "[threat][technique][name]" => "Network Service Discovery"
      "[threat][tactic][id]"      => "TA0007"
      "[threat][tactic][name]"    => "Discovery"
      "[threat][framework]"       => "MITRE ATT&CK"
      "[nist][function]"          => "Detect"
    } }
  }
  # T1110 — Zeek SSH brute-force notice -> Credential Access. Matches only the
  # aggregated SSH::Password_Guessing/Login_By_Password_Guesser notice.log
  # entries (mirrors the T1046 branch above), not every individual
  # failed-auth connection event: the previous auth_success-based match let
  # an unauthenticated actor inflate this count at will with a failed-login
  # burst, with zero credentials and zero privileged access (#261).
  if [note] in ["SSH::Password_Guessing", "SSH::Login_By_Password_Guesser"] {
    mutate { add_field => {
      "[threat][technique][id]"   => "T1110"
      "[threat][technique][name]" => "Brute Force"
      "[threat][tactic][id]"      => "TA0006"
      "[threat][tactic][name]"    => "Credential Access"
      "[threat][framework]"       => "MITRE ATT&CK"
      "[nist][function]"          => "Detect"
    } }
  }

  # -- Endpoint detections: see WS1.2 note above. Their ATT&CK/NIST mapping now
  #    lives in the Sigma rules (rules/sigma/*.yml) -> Elastic Detection Engine. --

  # --- Category 6: SOAR webhook signing (WS0.2) ---
  # The AI agent's /alert endpoint now requires an HMAC-SHA256 signature over the
  # exact request body. Build the body here and sign it so the bytes we sign are
  # the bytes the http output sends. Only structured, validated fields (IP/MAC) go
  # in the body — no free text that could perturb sprintf in the output stage.
  # WS1.1: fire on a real Zeek Intel match (threat.indicator.value set by the
  # zeek.intel block) instead of the never-set zeek.conn + threat.indicator.domain.
  # #267: also fire on a T1110 pipeline tag (Category 5 above), so the
  # aggregated SSH::Password_Guessing/Login_By_Password_Guesser notices
  # Zeek itself produces reach automated response, not just threat-intel
  # IOC hits. The live trigger only covered condition 1 of the 3 original
  # conditions rules/elastic_watcher/soar_quarantine_alert.json (now
  # retired, see that file's own comment) fired on when it was superseded
  # by this block - T1046/T1110 detections were tagged for dashboards but
  # never dispatched. T1110 is safe to wire directly: it requires a
  # completed TCP+SSH handshake (detect-bruteforcing.zeek's SumStats over
  # real ssh_auth_failed events), not spoofable by a bare source-IP forger.
  # T1046 (Scan::Port_Scan) is deliberately NOT included here - a
  # security-auditor review of this fix found scan-detection.zeek fires on
  # the initial SYN alone, no handshake required, so a spoofed-source SYN
  # sweep could otherwise turn this into an unrate-limited automated-
  # response amplifier against an attacker-chosen victim IP (this repo has
  # no rate limiting anywhere in the /alert path). T1046 stays pipeline-
  # tagged for dashboards/metrics exactly as before this fix - wiring it
  # into live dispatch is deferred until #331 (a source-spoofing defense
  # for scan-detection.zeek) actually exists.
  if ([event][dataset] == "zeek.intel" and [threat][indicator][value]) or [threat][technique][id] == "T1110" {
    ruby {
      init => 'require "openssl"; require "json"'
      code => '
        secret = ENV["SOC_AGENT_HMAC_SECRET"].to_s
        # #220: technique feeds the agent sliding host+technique suppression
        # window (should_suppress_technique in checkpoints.py). Populated
        # directly from Category 5s tag for the T1110 branch (#267).
        # Still empty for a zeek.intel-only IOC hit with no technique tag -
        # a threat-intel hit alone does not reveal which technique the
        # traffic represents, and this stack does not fabricate a
        # classification without evidence to back it.
        # NOTE: this whole Ruby block is a Logstash config string wrapped in
        # single quotes (the code setting a few lines above this one) - a
        # literal apostrophe anywhere inside it, including inside a comment,
        # closes that string early and breaks config parsing. No contractions
        # or apostrophes anywhere in this block, comments included.
        technique = event.get("[threat][technique][id]").to_s
        body = {
          "severity"   => "critical",
          "tenant_id"  => event.get("[tenant][id]").to_s,
          "source_ip"  => event.get("[source][ip]").to_s,
          "source_mac" => event.get("[source][mac]").to_s,
          "technique"  => technique
        }.to_json
        # audit P1-1: replay protection. Sign "<timestamp>." + body and send the
        # timestamp in x-elastic-timestamp; the agent rejects stale/replayed signatures.
        ts = Time.now.to_i.to_s
        sig = "sha256=" + OpenSSL::HMAC.hexdigest("SHA256", secret, ts + "." + body)
        event.set("[@metadata][soar_body]", body)
        event.set("[@metadata][soar_ts]", ts)
        event.set("[@metadata][soar_sig]", sig)
      '
    }
  }
}

output {
  # Unified security index. Zeek events are ECS-enriched in the filter above
  # (id.orig_h -> source.ip, etc.) and the colliding raw `id`/`source` fields are
  # gone, so they index here cleanly alongside endpoint telemetry — giving the
  # dashboards a single ECS data view with both network and host data.
  #
  # audit #169 / NIST SC-24: an event tagged _grokparsefailure/_jsonparsefailure
  # (the [pipeline][error] tag set above) is routed to a SEPARATE quarantine
  # index instead of the main data stream, so malformed input no longer
  # silently pollutes the primary security data. logstash-security-quarantine-*
  # matches the existing logstash-security-* template (same ECS mappings, same
  # ILM policy, same logstash_writer role grant) — no new template/role needed.
  if [pipeline][error] == "true" {
    elasticsearch {
      hosts    => ["${ELASTIC_HOSTS:https://elasticsearch:9200}"]
      index    => "logstash-security-quarantine-%{[tenant][id]}"
      action   => "create"
      data_stream => false
      # #257 (security-auditor review of #245): templates/ILM are applied
      # out-of-band by apply-templates.sh/apply-lifecycle.sh, authenticated
      # as elastic — this plugin must never try to auto-manage either
      # itself. Matches logstash_writer's role dropping the cluster-level
      # manage_index_templates/manage_ilm privileges that would otherwise be
      # required for it to do so; the two changes are meant to travel
      # together (a plugin trying to manage a template/ILM policy it no
      # longer has permission for is a startup error, not a silent no-op).
      manage_template => false
      ilm_enabled => false
      user     => "${LOGSTASH_ES_USER}"
      password => "${LOGSTASH_ES_PASS}"
      ssl_enabled => true
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  } else {
    elasticsearch {
      # HTTPS + authenticated. Credentials come from the least-privilege
      # `logstash_internal` user (role: logstash_writer), injected as env vars by
      # docker-compose.yml — never the `elastic` superuser, never hardcoded.
      hosts    => ["${ELASTIC_HOSTS:https://elasticsearch:9200}"]
      # Per-tenant data stream (WS0.3 + WS0.5): isolation is enforced by ES roles
      # scoped to the data stream name logstash-security-<tenant>. Still matches the
      # logstash-* data view, so dashboards keep working. provision_tenant.sh creates
      # the per-tenant role.
      #
      # WS0.5: the date suffix is gone — time is now managed by ILM rollover on the
      # data stream, not by daily index names. `action => create` is required because
      # data streams only accept op_type=create; ES auto-creates the stream from the
      # priority-200 data_stream template (logstash-security-template) on first write.
      index    => "logstash-security-%{[tenant][id]}"
      action   => "create"
      data_stream => false
      # #257: see the quarantine branch's identical comment above — same
      # out-of-band template/ILM management, same reason not to auto-manage.
      manage_template => false
      ilm_enabled => false
      user     => "${LOGSTASH_ES_USER}"
      password => "${LOGSTASH_ES_PASS}"
      ssl_enabled => true
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  }

  # Push Notification Output (Conditional)
  # WS1.1: ntfy topic is no longer hardcoded — it comes from the NTFY_TOPIC env
  # (set per deployment in .env, passed by docker-compose), with a safe default.
  if "CRITICAL_THREAT" in [tags] {
    http {
      url => "https://ntfy.sh/${NTFY_TOPIC:subsoc-alerts}"
      http_method => "post"
      format => "message"
      message => "🚨 CRITICAL: intel match on %{[threat][indicator][value]} (tenant=%{[tenant][id]}, src=%{[@metadata][notify_source_ip]})"
      headers => {
        "Title" => "Suburban-SOC Alert"
        "Priority" => "high"
        "Tags" => "warning,skull"
      }
    }
  }

  # SOAR trigger (Watcher-free replacement for rules/elastic_watcher/soar_quarantine_alert.json)
  # Fires the AI agent's /alert webhook at ingest time for high-confidence IOC hits,
  # instead of polling every 60s. Reaches the agent by its docker-compose service name
  # on soc-mesh-net. The /alert handler expects: severity, source_ip, source_mac, technique.
  # WS1.1: fire on a real Zeek Intel match. #267: also fire on a T1110
  # pipeline tag - same condition as the signing block in the filter stage
  # above, kept in lockstep on purpose (a signed-but-never-dispatched event
  # is a silent no-op, the exact failure mode #267 found and fixed). T1046
  # deliberately excluded - see the signing block's own comment for why
  # (security-auditor: scan-detection.zeek's SYN-only signal is spoofable,
  # and this repo has no rate limiting anywhere in the /alert path).
  if ([event][dataset] == "zeek.intel" and [threat][indicator][value]) or [threat][technique][id] == "T1110" {
    http {
      url => "http://soc_ai_agent:5000/alert"
      http_method => "post"
      # Send the exact pre-signed body built in the filter stage, with the HMAC in
      # the x-elastic-signature header and the freshness timestamp in
      # x-elastic-timestamp — both verified by the agent (WS0.2 + audit P1-1).
      format => "message"
      message => "%{[@metadata][soar_body]}"
      content_type => "application/json"
      headers => {
        "x-elastic-signature" => "%{[@metadata][soar_sig]}"
        "x-elastic-timestamp" => "%{[@metadata][soar_ts]}"
      }
    }
  }
}
