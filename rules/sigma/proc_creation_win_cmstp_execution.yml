title: CMSTP Execution via Malicious INF or Silent-Install Flags
id: 91d6dd3f-9728-4c13-83ae-9d95baee4893
status: experimental
description: |
    Detects cmstp.exe (Connection Manager Profile Installer) invoked with
    a silent-install flag (`/s`, `/ns`) or an .inf argument — a
    well-known UAC-bypass and AppLocker-bypass technique (Squiblydoo-style)
    where cmstp executes an arbitrary scriptlet or DLL referenced from the
    supplied profile. cmstp.exe execution is already rare on modern
    endpoints, so the OR-based match keeps this broad enough to catch the
    technique regardless of which specific invocation flag is used.
references:
    - https://attack.mitre.org/techniques/T1218/003/
author: Suburban-SOC
date: 2026-08-02
tags:
    - attack.defense_evasion
    - attack.t1218.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmstp.exe'
        CommandLine|contains:
            - '/s'
            - '/ns'
            - '.inf'
            - '\appdata\'
            - '\temp\'
            - '\users\public\'
    condition: selection
falsepositives:
    - Legitimate VPN/dial-up connection profile installation (rare on modern endpoints).
level: high
