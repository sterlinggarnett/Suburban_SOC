title: Network Share Enumeration via net.exe
id: 1d7c4a29-9e63-4b58-a802-3f6d1e9c7b40
status: experimental
description: |
    Detects `net view` (list shares/computers reachable from this host) and
    bare `net share` (list this host's own shares) — standard early
    discovery steps that reveal lateral-movement targets. Genuinely common
    in normal IT administration, so this is deliberately scoped as a
    lower-confidence signal (medium, not high) rather than a per-execution
    alert; its real value is as an input to the host+technique suppression
    window (#220) and correlation with other discovery-stage rules in this
    same batch, not as a standalone high-confidence detection.
references:
    - https://attack.mitre.org/techniques/T1135/
author: Suburban-SOC
date: 2026-08-05
tags:
    - attack.discovery
    - attack.t1135
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\net.exe'
        - Image|endswith: '\net1.exe'
        - OriginalFileName: 'net.exe'
        - OriginalFileName: 'net1.exe'
    selection_verb:
        CommandLine|contains:
            - ' view'
            - ' share'
    condition: selection_img and selection_verb
falsepositives:
    - Routine IT/helpdesk troubleshooting of a mapped-drive or file-share access issue.
    - Login/logon scripts or asset-inventory tooling that enumerate shares as part of normal operation.
level: medium
