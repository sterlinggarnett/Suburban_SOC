# pySigma processing pipeline (WS1.2) — maps Sigma field names to the ECS/winlog
# fields the Suburban-SOC Logstash pipeline actually produces (configs/logstash.conf
# Category 2). IMPORTANT: this stack uses process.args (NOT the ECS-standard
# process.command_line), so converted detections must query process.args to match
# real data. deploy_detections.sh sets the rule index to logstash-* after conversion.
#
# COMPLIANCE METADATA EXTRACTOR (Area 3):
# This pipeline relies on the elastic backend natively forwarding Sigma `tags:` to
# Kibana Detection Engine tags. To ensure alignment with `compliance_matrix.csv`,
# all Sigma rules MUST include `tags: [nist.800-53.*, cis.*, nist.csf.*]`
# so the deployer populates the Elasticsearch rule metadata correctly.
#
# Only the Sysmon process_creation channel gets ECS renames in logstash.conf; every
# other Windows channel (Security, System, WMI-Activity, PowerShell/Operational, and
# Sysmon's other event types) keeps Winlogbeat's raw nested shape —
# [winlog][event_id] / [winlog][event_data][<Field>] — so those transformations map
# straight to winlog.event_id / winlog.event_data.<Field> instead. Each is scoped
# with `rule_conditions` to its own logsource so field names that collide across
# channels (e.g. TargetUserName means different things in a Sysmon logon event vs. a
# Security group-membership event) don't cross-apply (issue #192).
name: suburban-soc-ecs
priority: 100
transformations:
  - id: field-mapping-sysmon-process-creation
    type: field_name_mapping
    mapping:
      Image: process.executable
      OriginalFileName: process.pe.original_file_name
      CommandLine: process.args
      ParentImage: process.parent.name
      ParentCommandLine: process.parent.args
      User: user.name
      TargetUserName: user.target.name
      TargetFilename: file.path
      Hashes: file.hash.sha256
    rule_conditions:
      - type: logsource
        product: windows
        category: process_creation

  # Sysmon CreateRemoteThread (EventID 8, issue #192 rule 6) — none of these fields
  # are in the logstash.conf Sysmon rename list, so they stay under winlog.event_data.
  - id: field-mapping-sysmon-create-remote-thread
    type: field_name_mapping
    mapping:
      EventID: winlog.event_id
      SourceImage: winlog.event_data.SourceImage
      TargetImage: winlog.event_data.TargetImage
      SourceUser: winlog.event_data.SourceUser
      TargetUser: winlog.event_data.TargetUser
    rule_conditions:
      - type: logsource
        product: windows
        category: create_remote_thread

  # Windows Security channel (issue #192 rules 1a/1b/1c/1d/2a/4) — logstash.conf
  # only stamps event.outcome for 4624/4625, it does not rename EventData.
  - id: field-mapping-windows-security
    type: field_name_mapping
    mapping:
      EventID: winlog.event_id
      TargetUserName: winlog.event_data.TargetUserName
      TargetSid: winlog.event_data.TargetSid
      PrivilegeList: winlog.event_data.PrivilegeList
      SubjectUserSid: winlog.event_data.SubjectUserSid
      IpAddress: winlog.event_data.IpAddress
      # M13 US2 (#232) — Kerberos 4768/4769 and DCSync 4662 fields. Every field
      # a Security-channel rule selects on MUST be listed here: logstash.conf
      # does not rename EventData for this channel, so an unmapped name compiles
      # into a query against a field that does not exist and the rule silently
      # never fires. That is exactly the #217 `ImagePath` defect, which passed
      # the fixture tests while being a production no-op (sigma_eval.py evaluates
      # raw Sigma field names, not these mapped ones — see its module docstring).
      ServiceName: winlog.event_data.ServiceName
      TicketEncryptionType: winlog.event_data.TicketEncryptionType
      PreAuthType: winlog.event_data.PreAuthType
      Status: winlog.event_data.Status
      AccessMask: winlog.event_data.AccessMask
      Properties: winlog.event_data.Properties
      SubjectUserName: winlog.event_data.SubjectUserName
      # NOT mapped here: TicketOptions, ObjectServer. Both reviewed and removed
      # (code-reviewer + security-auditor, US2 review) — no rule in the corpus
      # selects on either; add them back only alongside a rule that actually uses
      # them, so this list never silently drifts ahead of what's deployed.
      # M13 US6 (#229/#242) — RDP/PtH/disabled-account/group-recon fields.
      # Same #217-shape requirement as the US2 comment above: every field a
      # Security-channel rule selects on must be listed here.
      # NOT mapped here: ObjectType — round-1 added it speculatively for
      # auth_win_sensitive_group_recon.yml, but that rule only selects on
      # ObjectName; caught by code-reviewer as violating the exact
      # unused-field convention this comment itself was citing. Add it back
      # only alongside a rule that actually uses it.
      LogonType: winlog.event_data.LogonType
      AuthenticationPackageName: winlog.event_data.AuthenticationPackageName
      SubStatus: winlog.event_data.SubStatus
      ObjectName: winlog.event_data.ObjectName
    rule_conditions:
      - type: logsource
        product: windows
        service: security

  # Windows System channel (issue #192 rules 2b/3a/3b) — no logstash.conf handling
  # at all for this channel; fields stay under winlog.event_data.
  # ImagePath added #217 (security-auditor review): system_win_service_installed.yml's
  # filter_common_dirs referenced bare `ImagePath`, which had no mapping here — the
  # compiled query filtered a field that doesn't exist in the real data, making that
  # rule's whole FP-reduction fix a silent no-op in production despite passing the
  # fixture-based test (sigma_eval.py evaluates raw Sigma field names directly, not
  # through this ECS pipeline — exactly the divergence its own module docstring warns
  # about). Confirmed no other rule in the corpus references System-channel ImagePath.
  # ServiceName/ServiceType added M13 US3 (#233/#234): the new
  # remote-service-creation and driver-service rules select on these 7045
  # fields (the LOLBin-service-binary rule in the same batch reuses the
  # pre-existing ImagePath mapping instead) — same #217 shape as ImagePath
  # above, added up front this time rather than found broken after the fact.
  - id: field-mapping-windows-system
    type: field_name_mapping
    mapping:
      EventID: winlog.event_id
      param1: winlog.event_data.param1
      ImagePath: winlog.event_data.ImagePath
      ServiceName: winlog.event_data.ServiceName
      ServiceType: winlog.event_data.ServiceType
    rule_conditions:
      - type: logsource
        product: windows
        service: system

  # Sysmon FileCreate (EventID 11, M13 US3 #233) — logstash.conf's Sysmon
  # rename block applies channel-wide (every Sysmon EventID, not just
  # process_creation's EventID 1), so TargetFilename is ALREADY renamed to
  # file.path for these events in the real pipeline; this transformation
  # exists only because pySigma's rule_conditions scope by the SIGMA RULE's
  # own logsource category, which for this rule is file_event, not
  # process_creation — without a category: file_event entry here, the
  # converted query would target the raw pre-rename field name instead.
  - id: field-mapping-sysmon-file-event
    type: field_name_mapping
    mapping:
      TargetFilename: file.path
    rule_conditions:
      - type: logsource
        product: windows
        category: file_event

  # Microsoft-Windows-WMI-Activity/Operational (issue #192 rule 5).
  - id: field-mapping-windows-wmi
    type: field_name_mapping
    mapping:
      EventID: winlog.event_id
      Operation: winlog.event_data.Operation
    rule_conditions:
      - type: logsource
        product: windows
        service: wmi

  # Microsoft-Windows-PowerShell/Operational (issue #192 rule 8, stretch).
  - id: field-mapping-windows-powershell
    type: field_name_mapping
    mapping:
      EventID: winlog.event_id
      ScriptBlockText: winlog.event_data.ScriptBlockText
    rule_conditions:
      - type: logsource
        product: windows
        service: powershell

  # Zeek files.log (#217, security-auditor review): configs/logstash.conf
  # unconditionally renames Zeek's native string `source` field to
  # `zeek.source` for EVERY zeek_logs-sourced event, to avoid a string-vs-
  # object mapping collision with ECS `source.*` (see that file's Category 0
  # comment). net_zeek_executable_download.yml's `source: 'HTTP'` selection
  # referenced the pre-rename field name, so the compiled query filtered on a
  # field that never exists in the real data - the rule could not fire at
  # all, independent of and worse than the severity-tuning this issue was
  # actually about. mime_type is untouched by the pipeline and needs no
  # mapping here. Connection 4-tuple + proto/service added (#287 review,
  # tests/pipeline/test_field_mapping_drift.py): this file's own INVARIANT
  # comment below (field-mapping-zeek-dns) says every zeek/* transformation
  # must carry these, since logstash.conf renames them unconditionally for
  # every zeek_logs event regardless of stream — this transformation was
  # the one exception, silently violating its own documented rule since
  # #217. Harmless today only because no files-scoped rule currently scopes
  # a detection by source/destination; the next one to do so would have
  # been a silent no-op.
  - id: field-mapping-zeek-files
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
      source: zeek.source
    rule_conditions:
      - type: logsource
        product: zeek
        service: files

  # #228 (M13 US5): before this batch, zero transformations existed for
  # zeek/dns, zeek/ssl, zeek/conn, or zeek/http — every field a rule in these
  # 4 logsources selects on would compile against the pre-rename Zeek-native
  # name, the same silent-no-op shape field-mapping-zeek-files exists to
  # solve. Field names here match exactly what configs/logstash.conf's
  # Category 0 branch renames real Filebeat-shipped Zeek data to (the branch
  # real telemetry actually reaches, not the dead network_logs branch).
  #
  # INVARIANT (security-auditor, #228 review round 1): logstash.conf's
  # Category 0 mutate block renames the connection 4-tuple (id.orig_h/
  # id.resp_h/id.orig_p/id.resp_p) + proto/service UNCONDITIONALLY, for every
  # zeek_logs event regardless of stream. Any field renamed unconditionally
  # there must appear in every zeek/* transformation that exists below, not
  # just field-mapping-zeek-conn, or a rule that scopes a dns/ssl/http
  # detection to a source/destination (e.g. "burst per-source", "to a rare
  # host") is a silent no-op. This is why the 4-tuple is duplicated below in
  # every transformation that has one — pySigma's rule_conditions scoping
  # has no inheritance mechanism.
  #
  # SCOPE (review round 2): this invariant is only satisfied for the
  # logsources that HAVE a transformation (currently: files, dns, ssl, conn,
  # http, smtp, ssh — seven as of #332, six before it, not the four this
  # batch started with; update this count when the next one is added,
  # don't let it go stale again). zeek/notice and zeek/conn's sibling
  # zeek/intel have NO transformation at all — the two existing notice rules
  # (net_zeek_port_scan.yml, net_zeek_ssh_bruteforce.yml) only select on
  # `note`, which Category 0 leaves untouched, so this is harmless today. It
  # stops being harmless the moment a notice-scoped rule adds a
  # source/destination condition — add field-mapping-zeek-notice (same
  # 4-tuple) at that point, don't assume it's already covered because this
  # comment is nearby.
  #
  # UPDATE (#291, security-auditor follow-up): the six-count above refers
  # ONLY to field_name_mapping transformations. As of #291, every zeek/*
  # rule — including zeek/notice, which still has no field_name_mapping —
  # ALSO receives the separate add-condition-zeek-event-dataset
  # transformation (bottom of this file), scoped by product:zeek alone.
  # That transformation doesn't rename any field, so it doesn't extend the
  # 4-tuple invariant above; it's a distinct kind of coverage gap this
  # comment's own six-count was never meant to track.
  - id: field-mapping-zeek-dns
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
      query: dns.question.name
      qtype_name: dns.question.type
      # ECS is dns.response_code (flat, underscore), not dns.response.code —
      # matched exactly to configs/logstash.conf's Category 0 rename target
      # so the two halves never drift from each other, even though this
      # deviates from the real ECS field name (recorded here so a future
      # ECS/Security-Onion migration doesn't silently break this instead).
      rcode_name: dns.response_code
      # #292: TXT-record C2 download direction (payload in the answer, not
      # the query label) — dns.answers is a flat string array, not ECS's
      # canonical dns.answers.data/type/ttl object; see the matching
      # comment on configs/logstash.conf's Category 0 rename for why.
      answers: dns.answers
    rule_conditions:
      - type: logsource
        product: zeek
        service: dns

  - id: field-mapping-zeek-ssl
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
      server_name: tls.client.server_name
      cipher: tls.cipher
      curve: tls.curve
      version: tls.version
      validation_status: tls.validation_status
    rule_conditions:
      - type: logsource
        product: zeek
        service: ssl

  - id: field-mapping-zeek-conn
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
      # Needed by conn_icmp_tunnel_large's volume threshold. resp_bytes
      # deliberately omitted (code-reviewer, #228 round 2): no rule selects
      # on it yet - add it in the same commit as whichever rule first does,
      # per this file's own "map only when needed" convention (see uri's
      # history in field-mapping-zeek-http below).
      orig_bytes: source.bytes
    rule_conditions:
      - type: logsource
        product: zeek
        service: conn

  # smtp.log gets the same unconditional 4-tuple rename as every other Zeek
  # stream (Category 0), so it needs the same transformation per this file's
  # INVARIANT even though smtp_mass_outbound doesn't select on it today -
  # the point is the next SMTP rule that scopes by source doesn't silently
  # inherit a gap. trans_depth (the field that rule DOES select on) needs no
  # mapping: logstash.conf never touches it, same as note/auth_success/
  # mime_type, so the raw name already matches on both sides.
  - id: field-mapping-zeek-smtp
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
    rule_conditions:
      - type: logsource
        product: zeek
        service: smtp

  - id: field-mapping-zeek-http
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
      method: http.request.method
      status_code: http.response.status_code
      # code-reviewer + security-auditor both flagged this as the one that
      # actually matters: without it, the configs/network/filebeat.yml fix
      # for the host-header/host-metadata collision is unreachable from any
      # Sigma rule (a rule selecting `host` would compile against the raw,
      # unmapped name — which real ingested data uses for the ECS host.*
      # sensor-metadata object, not the HTTP Host header).
      host: zeek.http.host
      # `uri` was deliberately left unmapped during the prerequisite-fix
      # phase pending a rule that actually needs it; http_cobalt_strike_beacon
      # is that rule. Mapped here AND in logstash.conf's Category 0 branch
      # together, in the same commit, so the two can't drift.
      uri: url.path
      # `user_agent` deliberately omitted (code-reviewer, #228 round 2): no
      # rule selects on it yet - same "map only when needed" convention.
      # Needed by http_exfil_large_post's volume threshold.
      request_body_len: http.request.body.bytes
    rule_conditions:
      - type: logsource
        product: zeek
        service: http

  # #332: same unconditional 4-tuple + proto/service rename INVARIANT as
  # every other zeek/* transformation above — net_zeek_ssh_session_
  # cadence.yml doesn't select on source/destination itself today, but per
  # this file's own "the point is the NEXT rule that scopes by source
  # doesn't silently inherit a gap" convention (see field-mapping-zeek-smtp
  # above), this is added when zeek/ssh's first rule is, not deferred.
  # proto/service are included for consistency with every sibling
  # transformation even though ssh.log itself never actually carries those
  # keys (live-confirmed against a real captured session replayed through
  # the pinned zeek/zeek:8.2.1 image) — logstash.conf's Category 0 rename
  # is unconditional across every zeek stream regardless of whether a given
  # stream populates the key, and a mutate.rename on an absent field is a
  # harmless no-op, matching how every other transformation here already
  # includes proto/service unconditionally too. security-auditor follow-up:
  # this trades one gap direction for the opposite one on this specific
  # logsource — a future zeek/ssh rule selecting `service` compiles fine
  # against network.protocol, but that field is never actually populated
  # for ssh.log, so it would be a silent no-op the OTHER way (mapped but
  # never real, not unmapped-and-renamed like the INVARIANT above guards
  # against). Consistency with every sibling transformation is still the
  # right call; a future ssh-scoped rule selecting service/proto should
  # verify against real data first, not assume this mapping means the
  # field is populated.
  - id: field-mapping-zeek-ssh
    type: field_name_mapping
    mapping:
      id.orig_h: source.ip
      id.resp_h: destination.ip
      id.orig_p: source.port
      id.resp_p: destination.port
      proto: network.transport
      service: network.protocol
    rule_conditions:
      - type: logsource
        product: zeek
        service: ssh

  # #291 (security-auditor, #228 round 2): two related problems, one fix.
  # (1) Performance — several zeek/* rules compile to a leading-wildcard or
  # leading-.* regex query against a high-cardinality field with no explicit
  # ES mapping (dns.question.name / url.path — falls to strings_as_keyword),
  # e.g. net_zeek_dns_crypto_mining_pool.yml's 11-clause
  # dns.question.name:(*nanopool.org OR ...). A leading wildcard/regex gives
  # Lucene no prefix to seek on — effectively a full term-dictionary scan for
  # that field on every scheduled run. (2) Correctness — the INVARIANT above
  # (field-mapping-zeek-dns) deliberately pushes the connection 4-tuple into
  # every zeek/* transformation, so a rule scoped to e.g. service: conn has
  # NO field in its compiled query that actually confirms the match came
  # FROM conn.log rather than ssl.log/http.log/etc. sharing the same
  # 4-tuple-derived source.ip/destination.ip/source.port/destination.port —
  # a single physical connection can produce multiple Zeek log records for
  # the same 4-tuple, so an under-qualified rule can double-alert on one
  # real event. Injecting an event.dataset:zeek.<service> AND-clause fixes
  # (2) outright — live-verified end to end (see #291's PR) that a document
  # from a DIFFERENT stream sharing the same 4-tuple no longer matches.
  # (1) is a partial, not a full, fix (security-auditor follow-up review,
  # correcting this comment's own earlier overclaim): the cheap term clause
  # reduces how many documents reach scoring/collection, but Lucene builds
  # a wildcard/regex MultiTermQuery's automaton against the field's full
  # term dictionary independent of sibling AND clauses — it does not turn
  # the leading-wildcard scan itself into a prefix seek. The real fix for
  # (1) is at the mapping layer (e.g. an index_prefixes sub-field or a
  # reversed-suffix field for endswith-style matches) — tracked separately,
  # not claimed as closed by this transformation alone.
  #
  # template: true + $service substitutes each rule's own logsource.service
  # at conversion time (verified: dns rules get zeek.dns, conn rules get
  # zeek.conn, etc. — one generic transformation
  # instead of a 7-way copy-paste of field-mapping-zeek-*'s per-service
  # pattern, live-verified via `sigma convert` against all 19 real zeek
  # rules in the corpus). event.dataset is the correct target field name
  # directly (no further field_name_mapping needed) — configs/logstash.conf's
  # Category 0 stamps it from the real source log filename
  # (zeek.%{zeek_stream}) for every zeek_logs event, unconditionally, before
  # any of the dataset-scoped renames run.
  # DORMANT ASSUMPTION (code-reviewer + security-auditor review): scoped to
  # product:zeek alone, no service check — pySigma's template substitution
  # on a missing service renders the literal string "event.dataset:zeek.None"
  # (confirmed against pySigma's own source, not just inferred), a
  # permanently-unmatchable compiled query for a future zeek rule missing
  # logsource.service. Every zeek rule in the corpus has one today; guarded
  # (not just documented) by tests/detections/test_live_fire.py's
  # ZeekEventDatasetScopingTests, which fails LOUDLY on this shape (not a
  # silent skip) and runs in .github/workflows/detections.yml's REQUIRED
  # detections job (its own dedicated step, "Zeek rules carry the
  # event.dataset scoping condition"), not only the optional live-fire job.
  - id: add-condition-zeek-event-dataset
    type: add_condition
    template: true
    conditions:
      event.dataset: "zeek.$service"
    rule_conditions:
      - type: logsource
        product: zeek
