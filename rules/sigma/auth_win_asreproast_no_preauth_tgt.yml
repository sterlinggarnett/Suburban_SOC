title: AS-REP Roasting — TGT Requested for an Account Without Pre-Authentication
id: 4e81c6a2-7f39-4b50-8d1e-6a2b9c05f7d3
status: experimental
description: |
    Detects a Kerberos AS-REQ (Security 4768) for an account with
    pre-authentication disabled (PreAuthType 0). Without pre-auth the KDC
    returns an AS-REP encrypted with the account's password hash to any
    unauthenticated requester, which can then be cracked offline — no prior
    domain access needed. Machine accounts are excluded; they never legitimately
    carry the DONT_REQUIRE_PREAUTH flag, so their appearance here would be a
    different finding entirely.
    Very low volume in an environment where pre-auth is universally enforced,
    which is the normal state — a hit usually means either a genuinely
    misconfigured account or an attacker who just set the flag.
references:
    - https://attack.mitre.org/techniques/T1558/004/
author: Suburban-SOC
date: 2026-08-05
tags:
    - attack.credential_access
    - attack.t1558.004
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4768
        PreAuthType: '0'
    filter_machine_account:
        TargetUserName|endswith: '$'
    condition: selection and not filter_machine_account
falsepositives:
    - A legacy or third-party account deliberately configured with pre-authentication disabled for compatibility — inventory these and exclude them by name; each one is a standing credential-exposure risk worth tracking regardless.
level: high
