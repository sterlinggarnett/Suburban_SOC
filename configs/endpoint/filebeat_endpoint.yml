# =============================================================================
# Suburban-SOC — Filebeat endpoint configuration (Endpoint Dashboard, Component 3)
# Deploy on Linux hosts (incl. the WSL pipeline host) to ship auth + system logs
# to the SOC Logstash pipeline (:5044). Parsed by configs/logstash.conf Category 2
# (the `auth.log` grok branch keys on [log][file][path]).
#
# Install:  sudo filebeat -c filebeat_endpoint.yml -e
# =============================================================================

filebeat.inputs:
  - type: filestream
    id: auth-logs
    enabled: true
    paths:
      - /var/log/auth.log      # Debian/Ubuntu
      - /var/log/secure        # RHEL/CentOS
    # M13 US7 (#230/#243) security review: a `syslog: ~` parser here is
    # mutually exclusive with configs/logstash.conf's sshd grok, which is
    # anchored on the FULL raw line (`^%{SYSLOGTIMESTAMP} %{HOSTNAME}
    # sshd\[...\]: ...`) including the syslog header. Filebeat's syslog
    # parser, on success, extracts that same header into log.syslog.* and
    # replaces `message` with only the body — removing the literal "sshd["
    # substring the Logstash-side pre-filter (and every field the grok
    # captures) depends on. Nothing else in this pipeline consumes
    # log.syslog.* (grepped configs/ for it). Removed rather than rewriting
    # the grok to match a parsed-body shape: this is the smaller, safer
    # change, and it's what every existing auth.log rule (auth_win_*
    # equivalents don't apply here, but the pre-existing SSH dashboard
    # panels this grok already feeds) was built and tested against.

  - type: filestream
    id: syslog
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/messages

# Tag so Logstash routes these through the endpoint_logs branch.
tags: ["endpoint_logs", "filebeat"]

# Tenant attribution stamped at the edge (WS0.3). Set TENANT_ID per deployment
# (lowercase slug); every event carries [tenant][id] for per-tenant routing,
# access isolation, and response scoping. Defaults to "unassigned".
fields_under_root: true
fields:
  tenant:
    id: "${TENANT_ID:unassigned}"

# Ship to the SOC Logstash beats input. Override host via env if needed.
output.logstash:
  hosts: ["${LOGSTASH_HOST:localhost:5044}"]
  # WS3.1 (audit P2-2): Logstash's Beats input (:5044) is TLS-only, so plaintext
  # output fails the handshake. Verify the CA-signed Logstash cert against the stack
  # CA — ship ca.crt to the endpoint and point FILEBEAT_CA at it.
  ssl.enabled: true
  ssl.certificate_authorities: ["${FILEBEAT_CA:/etc/filebeat/certs/ca.crt}"]
  ssl.verification_mode: "${FILEBEAT_SSL_VERIFY:full}"

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
