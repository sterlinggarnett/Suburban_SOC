title: SSH Password Guessing / Brute Force (Zeek Notice)
id: c801fab3-5a62-440c-a4de-1a215af3a31a
status: experimental
description: |
    Detects SSH brute-force / password-guessing activity reported by Zeek's
    detect-bruteforcing policy through notice.log. Pairs with the
    CREDENTIAL_ACCESS emulation (tests/anomaly_simulation/sim_brute_ssh.sh).
    Requires 'policy/protocols/ssh/detect-bruteforcing' loaded alongside
    config.zeek - configs/zeek/local.zeek is NOT used by any real capture
    path (dead config since #286); the real wiring lives in
    scripts/setup/stream_capture.sh and
    configs/systemd/zeek-host-capture.service's ExecStart (#261).
    Deliberately status: experimental so deploy_detections.sh does not also
    deploy this as a Detection Engine rule (issue #192 pattern): the same
    SSH::Password_Guessing/Login_By_Password_Guesser notices already get
    threat.technique.id=T1110 tagged in-pipeline (configs/logstash.conf) on
    logstash-security-*, which slo_metrics.py's raw_alert_volume metric (#216)
    counts directly. Promoting this rule would double-count the same event
    once as a Zeek notice and again as a Detection Engine alert - keep both
    mutually exclusive by construction (exclude T1110 from one side) before
    changing this rule's status.
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://docs.zeek.org/en/master/logs/notice.html
author: Suburban-SOC
date: 2026-06-18
tags:
    - attack.credential_access
    - attack.t1110
logsource:
    product: zeek
    service: notice
detection:
    selection:
        note:
            - 'SSH::Password_Guessing'
            - 'SSH::Login_By_Password_Guesser'
    condition: selection
falsepositives:
    - Misconfigured clients or automation retrying stale credentials
    - Users repeatedly mistyping passwords
level: high
