title: PowerShell Credential-Harvesting Cmdlet Pattern
id: 8e1c5a93-4f26-4b07-9d15-3a8c6e2f9b70
status: experimental
description: |
    Detects PowerShell ScriptBlock logging (4104) capturing common
    credential-harvesting patterns: reading a browser's credential/cookie
    store path directly (bypassing the browser process entirely, a
    PowerShell-native alternative to the esentutl VSS-copy trick in this
    same batch), or referencing DPAPI's own unprotect API against captured
    material outside of the account's own normal profile context.
    Scoped to script-content patterns rather than a single cmdlet name
    because PowerShell's aliasing makes any single-name check trivially
    evadable.
    Two real gaps, stated plainly rather than implied covered (security
    review, #235/#236):
    1. Trivially evaded by simple string splitting — e.g. building the
       path via `-join`/concatenation so "Login Data" never appears as a
       contiguous literal in the logged block. 4104's deobfuscation only
       re-logs code that is subsequently PARSED AND EXECUTED (e.g. via
       Invoke-Expression); it does not decompose an ordinary runtime
       string value like a file-path argument. posh_ps_obfuscated_scriptblock.yml
       (this corpus) was previously cited here as a backstop for this —
       it is not: that rule requires 2-of-3 execute/download/encode
       indicators, none of which a plain credential-file Copy-Item
       one-liner carries.
    2. No console-input/keystroke telemetry exists in this environment to
       catch the equivalent technique run interactively rather than via a
       logged script block.
references:
    - https://attack.mitre.org/techniques/T1056/002/
author: Suburban-SOC
date: 2026-08-05
tags:
    - attack.collection
    - attack.credential_access
    - attack.t1056.002
logsource:
    product: windows
    service: powershell
detection:
    selection_id:
        EventID: 4104
    selection_browser_creds:
        ScriptBlockText|contains:
            - 'Login Data'
            - '\Cookies'
            - 'Local State'
    selection_dpapi:
        # 'ConvertFrom-SecureString' deliberately excluded (security review,
        # #235/#236): it's a standard, extremely common cmdlet in ordinary
        # credential-storage automation (scheduled-task creds, DSC configs,
        # Export-Clixml-based service-account stores) with no harvesting
        # connotation on its own — including it here fired on routine ops
        # scripting. The two remaining indicators are genuinely rarer.
        ScriptBlockText|contains:
            - 'DPAPI'
            - '[System.Security.Cryptography.ProtectedData]'
    condition: selection_id and (selection_browser_creds or selection_dpapi)
falsepositives:
    - A legitimate PowerShell-based credential-migration or password-manager-integration script that references these same file paths or DPAPI APIs for a sanctioned purpose — baseline and exclude by script hash/path if this is a recurring pattern in the environment.
level: high
