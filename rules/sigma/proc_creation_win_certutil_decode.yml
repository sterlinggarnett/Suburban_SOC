title: Payload Decoding via Certutil
id: a1c1f005-0005-4a05-9005-000000000005
status: stable
description: >
    Detects certutil.exe used to decode a base64/hex-encoded file, a common way
    to deobfuscate a dropped payload.
    #217: matches the flag form (-decode/-decodehex/-decodeasn, or the / variant)
    instead of the bare word 'decode', which also matched as a substring of any
    unrelated filename/parameter containing that word (e.g. certutil -hashfile
    decode_report.txt SHA256 has nothing to do with the decode operation).
    Security review (#235/#236, found while reviewing this rule's -encode
    mirror) tightened further: flag-form-only matching still collided with a
    hyphen-compound filename like base64-decoded-blob.bin (the hyphen
    naturally precedes "decoded"). Space-anchored (a leading space before
    the flag, which real certutil syntax always has). OriginalFileName
    fallback added at the same time for rename-resistance, matching the
    sibling -encode rule.
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\certutil.exe'
        - OriginalFileName: 'CertUtil.exe'
    selection_flag:
        CommandLine|contains:
            - ' -decode'
            - ' /decode'
    condition: selection_img and selection_flag
falsepositives:
    - Rare legitimate certificate encoding/decoding workflows.
level: medium
tags:
    - attack.defense_evasion
    - attack.t1140
