input {
  # Standard Beats input for endpoint logs (Winlogbeat / Sysmon / Filebeat)
  # WS3.1: TLS terminated here so Filebeat->Logstash telemetry is encrypted in
  # transit (no plaintext on :5044). Server cert is the dedicated logstash cert
  # signed by the stack CA (see setup); clients verify it against ca.crt.
  beats {
    port => 5044
    tags => ["endpoint_logs"]
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    # #219: ssl_certificate_authorities alone does not by itself guarantee
    # client-cert enforcement - configs/network/filebeat.yml asserted the
    # server "requires client authentication" with nothing in this file
    # actually setting that. Verified live, both directions, via
    # scripts/setup/verify_encryption.sh (which checks Logstash's own log
    # output, not just the TLS client's handshake summary - a clean
    # client-side "Verify return code: 0 (ok)" from a certless probe does NOT
    # by itself prove the server accepted the connection: under TLS 1.3 that
    # summary reflects the client verifying the SERVER's cert, which
    # completes before the server has even processed the client's empty
    # Certificate message):
    #   - WITH a valid client cert (the filebeat cert): connects normally.
    #   - WITHOUT one: Logstash immediately logs and closes the connection -
    #     "SSLHandshakeException: (certificate_required) Empty client
    #     certificate chain".
    ssl_client_authentication => "required"
  }
  
  # Network tap input (Zeek / Suricata / Syslog).
  # SECURITY (audit P1-8): this input is PLAINTEXT and is intentionally NOT
  # published to the host — docker-compose maps only :5044 (Beats, TLS), so :5514 is
  # reachable only by peers on the internal `soc-mesh-net` bridge, never the LAN.
  # That is the only reason plaintext is acceptable here. To harden for a routed/
  # production deployment, terminate TLS on this input (ssl_enabled => true with the
  # logstash cert, as the :5044 beats input does) and switch every :5514 shipper to
  # https — do NOT expose :5514 to the host without TLS.
  http {
    port => 5514
    host => "0.0.0.0"   # mesh-internal only; not in compose `ports:` (see above)
    tags => ["network_logs"]
  }
}

filter {
  # --- WS0.3: tenant attribution ---
  # Every event must carry a tenant id. The beats shippers edge-stamp [tenant][id];
  # the :5514 http input and any unstamped source default to "unassigned" so data is
  # never dropped, just clearly unattributed. The id becomes part of the index name,
  # so force lowercase for Elasticsearch index-name validity.
  if ![tenant][id] {
    mutate { add_field => { "[tenant][id]" => "unassigned" } }
  }
  mutate { lowercase => ["[tenant][id]"] }
  # #286 security-auditor HIGH: [tenant][id] was validated nowhere before this
  # — safe as long as it only ever fed a WRITE index name (ES itself rejects
  # a malformed one, e.g. containing "," or "*", so a bad value just errored
  # the write). #286 adds the first READ use of this field (the uid-keyed
  # correlation's `index => "logstash-security-%{[tenant][id]}"` below) —
  # unlike a write, a read index pattern is fail-OPEN: "*" reads every
  # tenant, "a,logstash-security-victim" is an explicit cross-tenant read.
  # Same slug grammar erase_tenant.sh already enforces (scripts/setup/
  # erase_tenant.sh:35) — fail closed to "unassigned" (a real, always-valid
  # tenant, same fallback the block above uses) rather than let a malformed
  # value reach either the write or the new read path. _invalid_tenant_id is
  # a high-fidelity forged/malformed-event signal: no legitimate shipper
  # produces one.
  if [tenant][id] !~ /\A[a-z0-9][a-z0-9-]{1,38}\z/ {
    mutate {
      replace => { "[tenant][id]" => "unassigned" }
      add_tag => ["_invalid_tenant_id"]
    }
  }

  # --- Category 0: Zeek logs shipped by Filebeat from /storage/PCAP/zeek_logs ---
  # Filebeat's ndjson parser already expanded each line into top-level fields, so
  # Zeek's native keys (id, source, ts, note, auth_success, mime_type) arrive as-is.
  # These come in tagged "endpoint_logs" (Beats input :5044), NOT "network_logs",
  # so they would otherwise skip all parsing. Here we (a) stamp event.dataset from
  # the source filename (conn.log -> zeek.conn) — the field the verifier, the
  # dashboards, and #286's uid-keyed correlation below all key on — and (b) tag
  # them "zeek" (WS1.4's per-source Data Quality panel dimension; #286 review:
  # despite this comment's own prior claim, the output{} block below has no
  # "zeek" in [tags] branch — every event, zeek-tagged or not, lands in the same
  # logstash-security-<tenant> data stream, not a separate zeek-* index).
  # Zeek's nested `id` object and string `source` field collide with the ECS
  # mappings in logstash-security-* (HTTP 400) otherwise.
  if [log][file][path] =~ "zeek_logs" {
    grok {
      match => { "[log][file][path]" => "/(?<zeek_stream>[a-z0-9_]+)\.log$" }
      tag_on_failure => ["_zeek_path_nomatch"]
    }
    if [zeek_stream] {
      mutate {
        add_field    => { "[event][dataset]" => "zeek.%{zeek_stream}" }
        # WS1.4: event.module is the per-source dimension for the Data Quality
        # heartbeat panel (last-seen per source per tenant).
        add_field    => { "[event][module]" => "zeek" }
        add_tag      => ["zeek"]
        remove_field => ["zeek_stream"]
      }
    }
    # #349: before #291, a grok-failed document (no event.dataset, since
    # the block above is gated on [zeek_stream]) was still fully
    # ECS-mapped and still matched by any zeek Sigma rule, since nothing
    # checked event.dataset. #291's event.dataset:zeek.<service> scoping
    # condition means a grok-failed document is now completely invisible
    # to every zeek-sourced detection - a real detection blackout with
    # zero visible signal, since _zeek_path_nomatch (added above) had no
    # consumer: no alert, no dashboard panel, no test. Stamps a
    # pipeline.* field from the tag, matching this file's own established
    # pipeline.truncated/pipeline.byte_clamped/pipeline.oversized_dns_
    # answer convention (#252/#263/#352), so metric_zeek_path_nomatch_
    # count() in slo_metrics.py can turn it into a measured, target-
    # checked SLO (target 0 - unlike those three siblings, this is a
    # detection-outage signal, not a data-quality baseline with no
    # calibration data yet).
    if "_zeek_path_nomatch" in [tags] {
      mutate { add_field => { "[pipeline][zeek_path_nomatch]" => "true" } }
    }

    # Zeek files.log/http.log use `source` as a plain string (e.g. "HTTP"); move
    # it aside so `source` can hold the ECS source.* object without a string-vs-
    # object mapping collision.
    if [source] {
      mutate { rename => { "[source]" => "[zeek][source]" } }
    }

    # Map Zeek-native connection fields (stored as literal dotted keys) to ECS so
    # the dashboards' panels populate. note/auth_success/mime_type are left intact
    # for the issue-#22 verifier.
    mutate {
      rename => {
        "[id.orig_h]"   => "[source][ip]"
        "[id.resp_h]"   => "[destination][ip]"
        "[id.orig_p]"   => "[source][port]"
        "[id.resp_p]"   => "[destination][port]"
        "[proto]"       => "[network][transport]"
        "[service]"     => "[network][protocol]"
        "[query]"       => "[dns][question][name]"
        # #228 (M13 US5): qtype_name/rcode_name were only ever mapped in the
        # network_logs branch below, which real Filebeat-shipped Zeek data
        # never reaches (see the zeek.ssl comment a few lines down for the
        # same gap already found and fixed once). dns_txt_record_abuse and
        # dns_dga_nxdomain_burst select on these; without this they'd be
        # silent no-ops identical in shape to #217's ImagePath defect.
        "[qtype_name]"  => "[dns][question][type]"
        # ECS is dns.response_code (flat, underscore) - matched exactly to
        # suburban-soc-ecs.yml's field-mapping-zeek-dns target.
        "[rcode_name]"  => "[dns][response_code]"
        # #292: the TXT-record C2 DOWNLOAD direction (payload in the
        # answer, short query name) was inexpressible — only the query
        # label was mapped. dns.answers deviates from ECS's canonical
        # object shape (dns.answers.data/type/ttl/...) the same way
        # rcode_name above deviates from dns.response.code: Zeek's
        # `answers` is a flat array of raw strings with no per-answer
        # type/ttl breakdown, so there is nothing to hang the object
        # subfields on. Matched exactly to suburban-soc-ecs.yml's
        # field-mapping-zeek-dns target; if anything else ever writes a
        # real ECS-shaped dns.answers.* object into this index, that's a
        # naming collision against this flat array, not a coincidence.
        "[answers]"     => "[dns][answers]"
        "[method]"      => "[http][request][method]"
        "[status_code]" => "[http][response][status_code]"
        # #228 rule-writing phase: uri/request_body_len needed by
        # http_cobalt_strike_beacon / http_exfil_large_post. `host` is
        # handled separately, upstream in filebeat.yml (input-processor
        # rename), not here - see that file's comment for why. user_agent
        # deliberately NOT renamed here (code-reviewer, #228 round 2): no
        # rule selects on it yet, and suburban-soc-ecs.yml doesn't map it
        # either - add it when a rule actually needs it.
        "[uri]"               => "[url][path]"
        "[request_body_len]"  => "[http][request][body][bytes]"
        # Needed by conn_icmp_tunnel_large's volume threshold.
        "[orig_bytes]"  => "[source][bytes]"
        # #441 Part B: needed by net_zeek_conn_outbound_volume_asymmetry's
        # threshold companion (resp_bytes was the deliberately-deferred
        # half of the orig_bytes rename above — "add it in the same commit
        # as whichever rule first does", per this block's own prior
        # comment and configs/detections/suburban-soc-ecs.yml's matching
        # field-mapping-zeek-conn note).
        "[resp_bytes]"  => "[destination][bytes]"
        # #286: mac-logging (config.zeek, below) writes these onto conn.log
        # ONLY — this is the fix for HALF of #286's two stacked breaks (the
        # rename existed only in the dead network_logs branch, same defect
        # shape as qtype_name/rcode_name above). source.mac is already
        # mapped `keyword` in logstash-security-template.json. The OTHER
        # half — getting this onto the zeek.intel event that actually
        # triggers SOAR containment — is the uid-keyed lookup in the
        # zeek.intel branch below, since intel.log never carries L2
        # addresses itself.
        "[orig_l2_addr]" => "[source][mac]"
        "[resp_l2_addr]" => "[destination][mac]"
      }
    }
    # #267: some zeek.notice types (e.g. detect-bruteforcing's
    # Password_Guessing) set Notice::Info$src without $conn, so notice.log
    # carries a bare top-level src field but no id sub-record — the generic
    # id.orig_h rename above never fires for them, leaving source.ip empty.
    # Scan::Port_Scan sets $conn too, so it is already covered; this is a
    # fallback only, never overwriting a value the generic rename already set.
    if [event][dataset] == "zeek.notice" and ![source][ip] and [src] {
      mutate { rename => { "[src]" => "[source][ip]" } }
    }

    # WS2.4: skip GeoIP for RFC1918 / loopback / link-local / ULA — internal IPs never
    # resolve, so the lookup is pure per-event overhead on internal conn telemetry.
    if [source][ip] and [source][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
      geoip { source => "[source][ip]" target => "[source]" }
    }
    if [destination][ip] and [destination][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
      geoip { source => "[destination][ip]" target => "[destination]" }
    }

    # WS2.4 (parse-drop fix): Zeek software.log emits a structured `version` record as
    # literal dotted keys (version.major/minor/addl). logstash-security-* maps `version`
    # as keyword, so the implied object collides -> document_parsing_exception (HTTP 400,
    # event dropped). Keep the human-readable string in ECS package.version and drop the
    # dotted numerics so nothing named version.* reaches ES.
    if [event][dataset] == "zeek.software" {
      if [unparsed_version] { mutate { rename => { "[unparsed_version]" => "[package][version]" } } }
      mutate {
        # Cover both shapes the Filebeat ndjson codec can deliver: literal dotted
        # string keys ("version.major") and a proper nested object (version.major).
        # The bare "[version]" removal alone resolves the collision; the rest make it
        # unambiguous regardless of codec behavior. remove_field on an absent key is a
        # no-op, so listing both forms is safe.
        remove_field => [
          "[version.major]", "[version.minor]", "[version.minor2]", "[version.minor3]", "[version.addl]",
          "[version][major]", "[version][minor]", "[version][minor2]", "[version][minor3]", "[version][addl]",
          "[version]"
        ]
      }
    }

    # --- #160: ECS-normalize zeek.ssl TLS fields (SNI + Cipher dashboard panels) ---
    # zeek.ssl arrives via Filebeat (tagged endpoint_logs) and is handled HERE in
    # Category 0 — NOT the network_logs branch below, which already maps these but
    # which real Filebeat-shipped Zeek data never reaches. Filebeat's ndjson codec
    # delivers server_name/cipher/curve/version/validation_status as top-level keys;
    # rename to ECS tls.* so the Network dashboard "SNI / Server Name (TLS)" and
    # "Cipher Suite Audit" panels (which query tls.client.server_name / tls.cipher)
    # populate. Scoped to zeek.ssl so the generic `version` key can't collide with
    # the zeek.software version handling above.
    if [event][dataset] == "zeek.ssl" {
      mutate {
        rename => {
          "[server_name]"       => "[tls][client][server_name]"
          "[cipher]"            => "[tls][cipher]"
          "[curve]"             => "[tls][curve]"
          "[version]"           => "[tls][version]"
          "[validation_status]" => "[tls][validation_status]"
        }
      }
    }

    # --- WS1.1: Zeek Intel framework hits (intel.log) -> ECS threat.indicator.* ---
    # The Intel framework (configs/intel/) matches live-feed indicators (WS1.3) against
    # connections and writes intel.log. Mapping the hit to ECS is what makes the SOAR
    # trigger fire on a REAL match — it replaces the dead `[threat][indicator][domain]`
    # condition (nothing ever set that field). Zeek JSON emits literal dotted keys.
    if [event][dataset] == "zeek.intel" {
      mutate {
        rename => {
          "[seen.indicator]"      => "[threat][indicator][value]"
          "[seen.indicator_type]" => "[threat][indicator][type]"
          "[seen.where]"          => "[threat][indicator][sighting]"
          "[sources]"             => "[threat][feed][name]"
        }
        add_tag => ["intel_match", "CRITICAL_THREAT"]
      }
      # Route the indicator value into the typed ECS field so detections/dashboards
      # can key on threat.indicator.ip / threat.indicator.domain.
      if [threat][indicator][type] == "Intel::ADDR" {
        mutate { add_field => { "[threat][indicator][ip]" => "%{[threat][indicator][value]}" } }
      } else if [threat][indicator][type] == "Intel::DOMAIN" {
        mutate { add_field => { "[threat][indicator][domain]" => "%{[threat][indicator][value]}" } }
      }

      # #286: uid-keyed conn.log<->intel.log correlation — MAC-based
      # containment's real load-bearing fix. mac-logging (config.zeek)
      # writes orig_l2_addr/resp_l2_addr onto conn.log ONLY; intel.log
      # never carries L2 addresses itself, so source.mac (the SOAR webhook
      # body's source_mac, built further down this pipeline) stays empty
      # for every zeek.intel-triggered containment without this. `uid` is
      # Zeek's own per-connection correlation key (present on both logs —
      # Intel::Info logs it whenever the match's Seen record carries
      # connection context, which every IP/host-based indicator match does)
      # and effectively collision-free, so an exact match is sufficient —
      # no time-window narrowing needed.
      #
      # DIRECTION-AWARE, on purpose (security-auditor round 1 HIGH): only
      # populate source.mac when the indicator matched the RESPONDER side
      # ([threat][indicator][sighting] == "Conn::IN_RESP", set from
      # seen.where above) — i.e. an internal device (source.ip = id.orig_h)
      # connecting OUT to a known-bad IP. In that direction, orig_l2_addr is
      # the internal originator's real MAC, observable on the monitored
      # link, and correctly pairs with source.ip for containment. For the
      # OTHER direction (Conn::IN_ORIG — a known-bad IP connecting IN to an
      # internal host), source.ip is the external attacker's IP, but
      # orig_l2_addr is NOT the attacker's MAC — it's the last-hop L2
      # address on the monitored link, i.e. the gateway/router's MAC. Since
      # operators are explicitly instructed (governance/exclusion_list.txt)
      # to list router MACs as protected assets, populating source.mac here
      # would make agent.py's is_excluded(ip=.., mac=..) match the ROUTER
      # and silently suppress containment of a genuine external attacker —
      # the opposite of this feature's intent. destination.mac (the
      # internal victim's MAC in that direction) is deliberately NOT
      # collected either: nothing consumes it (the broker always blocks by
      # source.ip; a MAC field only feeds the exclusion check and the audit
      # trail for source.ip's own device), and containment always targets
      # the external attacker's IP, never the internal victim's device.
      #
      # KNOWN LIMITATION (code-reviewer round 1: this undersold the failure
      # mode — corrected): this is a live query against this event's own
      # tenant index at the moment intel.log is processed, not a replay.
      # Zeek writes conn.log at connection TEARDOWN (inactivity timeout,
      # FIN/RST) — often minutes or more after a match on a still-active
      # connection fires, since intel matches typically trigger near
      # connection START (e.g. the first packet to a known-bad IP). That
      # means the traffic pattern this feature exists for MOST — a long-
      # lived, actively-beaconing C2 connection — is also the pattern MOST
      # likely to have no conn.log record yet when this lookup runs, not
      # merely an edge case. Short/already-closed connections (a blocked
      # scan probe, a single completed DNS lookup) are the case that reliably
      # works today. Accepted for this fix regardless: even a partial hit
      # rate is strictly better than the current "always empty" for every
      # match, and a delayed/asynchronous re-enrichment (replaying intel.log
      # once its conn.log record exists) is a larger design change, out of
      # scope here — tracked as a follow-up. The soar_mac_correlation_miss
      # tag below exists so this could be measured, but nothing consumes it
      # yet (security-auditor round 2: no slo_metrics.py metric, no
      # dashboard panel — the hit rate is not actually monitored today,
      # only queryable ad-hoc in Kibana; building that is a follow-up).
      #
      # FURTHER LIMITATIONS (security-auditor round 2):
      # - Conn::IN_RESP sightings come from Zeek's connection_established
      #   handler, which is TCP-only — a UDP or ICMP connection to a
      #   known-bad IP can never produce a sighting this gate keys on, so
      #   it can never be MAC-enriched regardless of timing.
      # - The RFC1918 check just above (source.ip must be internal) closes
      #   the case where an internal address is itself an intel indicator,
      #   but does NOT fix a routed topology where the originating device
      #   is on a different L2 segment than the sensor (a second VLAN, a
      #   mesh node behind a router, a WAN-side tap): orig_l2_addr there is
      #   still the gateway's MAC even though source.ip is genuinely
      #   internal. This needs either a MAC-to-IP consistency check against
      #   the asset inventory, or accepting that this feature's device-
      #   level attribution is only reliable when the sensor shares an L2
      #   segment with monitored devices — a topology precondition, not
      #   fixable in Logstash. Tracked as a follow-up.
      #
      # `uid` guard: security-auditor round 1 HIGH — Logstash conditionals
      # compile to Ruby/Joni regex, where ^/$ match LINE boundaries, not
      # string boundaries. A uid value with an embedded newline could pass a
      # ^...$ check on its first line while smuggling arbitrary Lucene
      # query_string syntax on a later line into the sprintf-interpolated
      # `query` below. \A/\z are true STRING anchors — use those, plus an
      # explicit length bound (real Zeek uids are ~18 chars; 64 is a
      # generous ceiling that still bounds the interpolated query size).
      # security-auditor round 2 MEDIUM: Conn::IN_RESP alone means "the bad
      # indicator matched the connection's RESPONDER" — it does NOT by
      # itself guarantee the ORIGINATOR (source.ip, whose MAC we're about
      # to trust) is actually an internal device. If an internal IP is ever
      # itself an intel indicator (a locally-added entry for a known-
      # compromised host, a honeypot, a recycled address in a feed), an
      # INBOUND connection to it also produces Conn::IN_RESP, with
      # source.ip = the external attacker and orig_l2_addr = the gateway
      # again — the exact suppression round 1 found, on a narrower trigger.
      # Require source.ip to actually BE internal (same RFC1918/ULA
      # predicate already used for the geoip guards above and at the SOAR
      # signing block below) before trusting its MAC.
      if [uid] and [uid] =~ /\A[A-Za-z0-9]{1,64}\z/
         and [threat][indicator][sighting] == "Conn::IN_RESP"
         and [source][ip] =~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|fc|fd)/ {
        elasticsearch {
          hosts   => ["${ELASTIC_HOSTS:https://elasticsearch:9200}"]
          index   => "logstash-security-%{[tenant][id]}"
          # Scoped to this SAME event's own (now-validated, see the tenant
          # guard above) tenant index (WS0.3/WS0.5 isolation) and to
          # zeek.conn specifically, so a uid collision across unrelated
          # event.dataset values (extremely unlikely regardless — Zeek uids
          # are effectively unique) can't matter.
          # Exact-match correctness here depends on `uid` mapping to
          # `keyword` (not analyzed `text`) in logstash-security-template.json
          # — it does, via that template's strings_as_keyword dynamic
          # catch-all, same as note/auth_success/mime_type (the other
          # Zeek-native passthrough fields this pipeline leaves unmapped
          # deliberately, per Category 0's own comment above).
          query   => "uid:%{[uid]} AND event.dataset:zeek.conn"
          fields  => { "[source][mac]" => "[source][mac]" }
          sort    => "@timestamp:desc"
          # security-auditor round 2 HIGH: an explicit `timeout` option was
          # here in round 1 to bound worst-case pipeline stall — REMOVED.
          # Could not verify against a live Logstash instance (no
          # `logstash --config.test_and_exit` available in this
          # environment) whether `timeout` is actually a declared option on
          # logstash-filter-elasticsearch (vs. only the OUTPUT plugin) — an
          # unrecognized option is a fatal ConfigurationError at pipeline
          # startup, which would silently blind the entire stack, a far
          # worse outcome than the stall this was meant to bound. Verify
          # against the real plugin version before re-adding (tester-
          # debugger follow-up); until then this filter has no explicit
          # request timeout, same as every other elasticsearch use in this
          # file.
          # security-auditor round 1 CRITICAL: logstash_internal (used
          # everywhere else in this pipeline) holds ONLY logstash_writer —
          # write/manage, no read privilege at all — so this query would
          # 403 on every single event using that credential, making this
          # entire fix silently inert. A dedicated, read-only credential
          # (#286, configs/elasticsearch/roles/logstash_enrich_reader.json)
          # exists specifically so this lookup can read without widening
          # the shared Logstash/agent credential's privileges — see
          # docker-compose.yml's #286 provisioning comment for why NOT
          # logstash_internal.
          user     => "${LOGSTASH_ENRICH_USER:logstash_enrich}"
          password => "${LOGSTASH_ENRICH_PASS:}"
          ssl_enabled => true
          ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
          # security-auditor round 1 MEDIUM: without this, a genuine query
          # failure (bad credential, ES down) is indistinguishable from
          # "conn.log not indexed yet" — both just leave source.mac unset.
          # Split them: a real failure tags _mac_enrich_failed (a config/
          # permission bug, should be investigated); the accepted race
          # below tags soar_mac_correlation_miss (expected, bounded by the
          # KNOWN LIMITATION above). Neither tag currently feeds a metric
          # or dashboard (security-auditor round 2: tracked as a follow-up,
          # not yet built) — until one exists, treat these as available for
          # ad-hoc Kibana investigation, not as an active alert.
          tag_on_failure => ["_mac_enrich_failed"]
        }
        # code-reviewer round 1: a zero-hit result and a never-attempted
        # lookup were indistinguishable from the outside (source.mac just
        # stays unset either way). Tag a definite miss so it's queryable —
        # but ONLY when the lookup itself succeeded and genuinely found
        # nothing; a query FAILURE already gets its own, more specific
        # _mac_enrich_failed tag above, and must not also count as a
        # "miss" (security-auditor round 2: the miss tag was firing on
        # failures too, silently absorbing every credential/connectivity
        # problem into what's supposed to be a benign, expected rate).
        if ![source][mac] and "_mac_enrich_failed" not in [tags] {
          mutate { add_tag => ["soar_mac_correlation_miss"] }
        }
      }

      # #177: the ntfy push output (below, in the output{} block) is a public
      # third-party relay — mask the source IP in that notification's text by
      # default (last octet -> .0), computed into [@metadata] so the indexed
      # [source][ip] field itself is never touched. NOTIFY_INCLUDE_RAW_IOCS=true
      # (same flag name/shape as the AI agent's) restores the unmasked IP.
      if [source][ip] {
        mutate { add_field => { "[@metadata][notify_source_ip]" => "%{[source][ip]}" } }
        if "${NOTIFY_INCLUDE_RAW_IOCS:false}" != "true" {
          mutate { gsub => [ "[@metadata][notify_source_ip]", "\.\d+$", ".0" ] }
          # gsub only matches a trailing IPv4 octet, so an IPv6 address (no dotted
          # tail) would otherwise pass through this untouched and reach the ntfy
          # output below fully unmasked (audit #177). Fail safe: anything still
          # containing a colon after the IPv4 attempt gets a fixed placeholder.
          if [@metadata][notify_source_ip] =~ ":" {
            mutate { replace => { "[@metadata][notify_source_ip]" => "[masked-ipv6]" } }
          }
        }
      }
      # The :5514 HTTP input enriches every request with transport metadata
      # (user_agent/http/url + the posting client's host.ip). None of these belong to a
      # Zeek intel record, and `user_agent` arrives as an ECS object which collides with
      # the strict keyword mapping -> document_parsing_exception (HTTP 400, event dropped
      # silently). Gate the strip on [user_agent] so it only touches the :5514 HTTP-input
      # path: Filebeat-shipped intel.log (:5044) carries none of these, and we must keep
      # its host.ip sensor provenance intact for multi-sensor correlation.
      if [user_agent] {
        mutate { remove_field => ["[user_agent]", "[http]", "[url]", "[host][ip]"] }
      }
    }
  }

  # --- Category 0b: Suricata eve.json (#443 sensor + #444 ingest, M23) ---
  # Filebeat ships this via the same Beats :5044 pipe as Zeek (configs/
  # network/filebeat.yml's suricata-eve input) — same "endpoint_logs" input
  # tag every Beats-shipped source gets (stamped by the shared :5044 input
  # block itself, line 8 above), detected here purely by file path, same
  # pattern as the Zeek block just above (Category 0) and not gated on
  # "endpoint_logs" in [tags] for the identical reason that block isn't.
  #
  # NOT exercised against a live Suricata/eve.json stream in this
  # environment — no real capture host (#443's own disclosed gap). Every
  # branch below is structurally verified (tests/pipeline/
  # test_suricata_eve_telemetry.py) against the field shapes Suricata's own
  # documented eve.json schema produces, not a captured sample.
  if [log][file][path] =~ /eve\.json/ {
    mutate {
      add_field => { "[event][module]" => "suricata" }
      # WS1.4 per-source dimension, same convention as zeek/windows/system/
      # auditd above — metric_suricata_ingest_lag_seconds() (slo_metrics.py,
      # #443) keys on this exact field/value.
      add_tag    => ["suricata"]
    }
    if [event_type] {
      # Mirrors Zeek's own per-stream event.dataset convention (zeek.conn,
      # zeek.dns, ...) — one dataset value per eve.json record type
      # (suricata.flow, suricata.http, suricata.dns, suricata.alert, ...).
      # event_type is a field Suricata's own schema always populates on
      # every record type, so this stamp carries no #217-class risk on its
      # own (unlike the alert.* -> rule.* mapping just below, which does).
      mutate { add_field => { "[event][dataset]" => "suricata.%{[event_type]}" } }
    } else {
      mutate { add_tag => ["_suricata_event_type_missing"] }
    }

    # alert.* -> ECS rule.*/threat.technique.* (#444's own scope item).
    # Bracket notation throughout (#328's dotted-string footgun, named
    # explicitly in #444's own issue text) — a dotted "alert.signature"
    # target would create a flat field literally named "alert.signature",
    # not descend into the nested [alert][signature] structure both this
    # condition and Suricata's own eve.json schema use.
    if [event_type] == "alert" {
      if [alert][signature] {
        mutate {
          rename => {
            "[alert][signature]"    => "[rule][name]"
            "[alert][signature_id]" => "[rule][id]"
            "[alert][category]"     => "[rule][category]"
          }
        }
        # ET-style rules embed ATT&CK technique IDs via a `metadata:
        # attack_technique T####` rule keyword, which Suricata surfaces as
        # alert.metadata.attack_technique (an array — a rule can tag more
        # than one technique). Reuses the threat.technique.* namespace the
        # Zeek Intel-match branch already populates elsewhere in this
        # pipeline — no new field family.
        if [alert][metadata][attack_technique] {
          mutate { rename => { "[alert][metadata][attack_technique]" => "[threat][technique][id]" } }
        }
      } else {
        # Defensive, not expected in practice — Suricata populates
        # alert.signature on every genuine alert record it generates
        # itself (unlike auditd's SYSCALL+EXECVE correlation above, which
        # can genuinely fail to join two separate log lines). Same
        # #217-shape discipline regardless: never let a document claim
        # rule.* content it doesn't actually have.
        mutate { add_tag => ["_suricata_alert_incomplete"] }
      }
    }

    # #444's own explicit either-is-defensible policy choice: deliberately
    # NOT wired into Category 6's SOAR trigger condition below. Suricata
    # alerts stay dashboard-only for this stage — a brand-new, unvalidated
    # source with no live tuning data yet. Revisit once #443 has run
    # against real traffic and alert quality is known.
  }

  # --- Category 1: Network & Application Telemetry ---
  if "network_logs" in [tags] {
    # Parse standard Zeek/Suricata JSON outputs if applicable
    json {
      source => "message"
      target => "network_parsed"
    }
    
    # Map raw fields to ECS Network & Application fields + Zeek IPs.
    # NOTE: targets MUST use Logstash bracket notation ([source][ip]) — a dotted
    # string target ("source.ip") creates a *flat* field literally named
    # "source.ip", which the GeoIP conditional below (`if [source][ip]`) never
    # matches, so GeoIP silently never ran. ECS transport/protocol also follow
    # Zeek semantics (matching the Beats/Zeek branch above): Zeek `proto` is the
    # L4 transport (tcp/udp/icmp) and `service` is the application protocol
    # (dns/http/ssl) — these were previously swapped.
    mutate {
      rename => {
        "[network_parsed][id.orig_h]"   => "[source][ip]"
        "[network_parsed][id.resp_h]"   => "[destination][ip]"
        "[network_parsed][id.orig_p]"   => "[source][port]"
        "[network_parsed][id.resp_p]"   => "[destination][port]"
        "[network_parsed][proto]"       => "[network][transport]"
        "[network_parsed][service]"     => "[network][protocol]"
        "[network_parsed][query]"       => "[dns][question][name]"
        "[network_parsed][qtype_name]"  => "[dns][question][type]"
        # #228 round-2 review: kept in sync with the Category 0 branch and
        # field-mapping-zeek-dns's dns.response_code target — this branch
        # isn't fully dead, ingestion IS reachable via the :5514 HTTP input.
        # DETECTION is a separate question (security-auditor, #292 review):
        # [event][dataset] is only ever set in Category 0's mutate block
        # above, gated on the `if [zeek_stream]` grok success a few lines up
        # (a path the grok fails to parse gets _zeek_path_nomatch and no
        # event.dataset either) — never here. #291's add-condition-zeek-
        # event-dataset transformation prefixes EVERY zeek/* compiled query
        # with event.dataset:zeek.<service>. So no event whose ECS fields
        # come ONLY from this Category 1 branch's own renames can ever match
        # a Sigma rule (this branch never sets event.dataset itself) —
        # NOT the same claim as "no :5514-ingested event can match": Category
        # 0's own gate above (`if [log][file][path] =~ "zeek_logs"`) is
        # content-based, not input-based, so a :5514 payload that supplies
        # its own matching log.file.path traverses Category 0 instead and
        # DOES get event.dataset stamped there — a separate, pre-existing
        # :5514-authentication gap, not something this branch's renames can
        # fix. Stamping event.dataset here
        # would not even be sufficient on its own: this branch's `json {
        # target => "network_parsed" }` buries every field not explicitly
        # renamed under network_parsed, but 6 of the 19 zeek rules select on
        # fields with no rename here at all (net_zeek_http_cobalt_strike_
        # beacon's uri, net_zeek_http_exfil_large_post's request_body_len,
        # net_zeek_conn_icmp_tunnel_large's orig_bytes, net_zeek_smtp_mass_
        # outbound's trans_depth, and net_zeek_executable_download/net_zeek_
        # smtp_attachment_executable's source/mime_type) — only the
        # remaining ~13 would become dual-path from an event.dataset stamp
        # alone.
        "[network_parsed][rcode_name]"  => "[dns][response_code]"
        # #292: kept in sync with the Category 0 branch above (same caveat).
        "[network_parsed][answers]"     => "[dns][answers]"
        "[network_parsed][method]"      => "[http][request][method]"
        "[network_parsed][status_code]" => "[http][response][status_code]"
        # Phase A: SOAR MAC enrichment — maps Zeek conn MAC fields to ECS
        # Requires @load policy/protocols/conn/mac-logging in local.zeek
        "[network_parsed][orig_l2_addr]" => "[source][mac]"
        "[network_parsed][resp_l2_addr]" => "[destination][mac]"
        # Component 2: SSL/TLS telemetry from Zeek ssl.log (Network Dashboard)
        # Requires @load base/protocols/ssl in local.zeek
        "[network_parsed][server_name]"       => "[tls][client][server_name]"
        "[network_parsed][cipher]"            => "[tls][cipher]"
        "[network_parsed][curve]"             => "[tls][curve]"
        "[network_parsed][version]"           => "[tls][version]"
        "[network_parsed][validation_status]" => "[tls][validation_status]"
        # Component 1: surface Zeek notice/ssh fields for MITRE/NIST tagging
        "[network_parsed][note]"         => "note"
        "[network_parsed][auth_success]" => "auth_success"
      }
    }

    # GeoIP Enrichment for Kibana Dashboards
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "[source]"
      }
    }
    if [destination][ip] {
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
      }
    }
    # #349: this branch (the :5514 HTTP input) never stamps event.dataset
    # itself - only Category 0 above does, gated on a log.file.path this
    # branch's own JSON-body ingestion doesn't require. #291's event.
    # dataset:zeek.<service> scoping condition means any event that
    # reaches this point with no event.dataset is unmatchable by every
    # zeek Sigma rule - not stamping event.dataset here too (a bigger
    # fix: this branch's `json { target => "network_parsed" }` shape
    # differs from Category 0's, and 6/19 zeek rules select on fields
    # this branch never renames at all - see the extensive comment on
    # this branch's own rename block above), just tagging it so it's
    # visibly quarantined instead of silently unmatchable with zero
    # signal. Named _network_logs_undated, not _zeek_undated (code-
    # reviewer + security-auditor, independently): this branch is
    # entered on the INPUT-level "network_logs" tag alone (any :5514
    # payload, per that input's own "Zeek / Suricata / Syslog" comment),
    # not on any check that the content is actually Zeek-shaped - a
    # future Suricata/syslog/arbitrary :5514 payload with no event.
    # dataset would get this tag too, and "_zeek_undated" would overclaim
    # what it means. Tag-level visibility only for now (searchable in
    # Kibana Discover) - not wired to its own SLO metric the way
    # _zeek_path_nomatch was, since gating it on genuine Zeek-shaped
    # content first (not just "any undated network_logs doc") is a
    # separate piece of work if this ever needs alerting, not a
    # same-shape copy-paste of #349's primary fix.
    if ![event][dataset] {
      mutate { add_tag => ["_network_logs_undated"] }
    }
  }

  # --- Category 2: Host, Process, & Identity Telemetry ---
  if "endpoint_logs" in [tags] {
    # WS1.4: per-source dimension for the Data Quality heartbeat (last-seen per
    # source per tenant). Windows (Winlogbeat) vs Linux auth (Filebeat).
    if [winlog] {
      mutate { add_field => { "[event][module]" => "windows" } }
    } else if [log][file][path] =~ /(auth\.log|secure)$/ {
      # M13 US7 (#230/#243) security review: configs/endpoint/filebeat_endpoint.yml
      # collects BOTH /var/log/auth.log (Debian/Ubuntu) AND /var/log/secure
      # (RHEL/CentOS) into this same input, but this condition only ever
      # matched the first - every RHEL/CentOS host silently never got
      # event.module=system stamped, and all 5 auth_linux_* rules require
      # exactly that field. Also anchored and escaped the dot (was an
      # unescaped "auth.log" wildcard-matching "authXlog" too).
      mutate { add_field => { "[event][module]" => "system" } }
    } else if [log][file][path] =~ /audit\/audit\.log$/ {
      # #442: Linux execve telemetry (configs/endpoint/audit.rules).
      mutate { add_field => { "[event][module]" => "auditd" } }
    }
    # If processing Windows Sysmon Events via Winlogbeat
    if [winlog][channel] == "Microsoft-Windows-Sysmon/Operational" {
      # #328: targets MUST use Logstash bracket notation ([process][args]) —
      # a dotted string target ("process.args") creates a *flat* field
      # literally named "process.args", not the nested structure any
      # bracket-syntax filter reading [process][args] expects (the exact
      # footgun this file already documents at its network-rename block,
      # ~line 441 — it just was not applied here). Confirmed live during
      # #263's review: event.get("[process][args]") returned nil for real
      # Sysmon-sourced events under the old dotted-string form, silently
      # dead-coding the #252/#263 truncation filter's process.args/
      # process.parent.args tagging (worked around there with a flat-key
      # fallback at the time; that workaround is removed now that this is
      # fixed at the source — see this file's #252/#263 comment).
      mutate {
        rename => {
          "[winlog][event_data][Image]"             => "[process][executable]"
          "[winlog][event_data][OriginalFileName]"  => "[process][pe][original_file_name]"
          "[winlog][event_data][CommandLine]"       => "[process][args]"
          "[winlog][event_data][ParentImage]"       => "[process][parent][name]"
          "[winlog][event_data][ParentCommandLine]" => "[process][parent][args]"
          "[winlog][event_data][User]"              => "[user][name]"
          "[winlog][event_data][TargetUserName]"    => "[user][target][name]"
          "[winlog][event_data][TargetFilename]"    => "[file][path]"
          "[winlog][event_data][Hashes]"            => "[file][hash][sha256]"
        }
      }
      # #339: the rename above only fixed the NESTING of Hashes (#328) - the
      # CONTENT is still Sysmon's raw algorithm-prefixed string
      # ("SHA256=<hex>", or a composite "SHA1=...,MD5=...,SHA256=...,
      # IMPHASH=..." when HashAlgorithms:* is configured), not a bare hash
      # any IOC hunt on file.hash.sha256 could match. Extracts just the
      # SHA256 component (grok searches, not anchors, so this finds
      # "SHA256=" at any position in a composite string - live-verified
      # against the real pinned logstash:9.3.2 image for a single value, a
      # composite value, a Hashes value with no SHA256 component at all,
      # and a >64-hex-char value (security-auditor review: without the
      # trailing (?![A-Fa-f0-9]) boundary, a malformed/forged value one
      # char too long would silently match and index a truncated 64-char
      # PREFIX of a longer string as if it were the real hash, with no
      # failure tag at all - the boundary makes that same case correctly
      # fail closed instead). Custom tag_on_failure (not the default _grokparsefailure) -
      # a Hashes value with no SHA256 (e.g. HashAlgorithms configured for
      # MD5 only) is a normal, expected condition, not a pipeline-health
      # problem the #169/NIST SC-24 parse-error-rate SLO should count. On
      # that failure the field is removed rather than left holding the
      # raw prefixed string mislabeled as a parsed hash.
      if [file][hash][sha256] {
        grok {
          match => { "[file][hash][sha256]" => "SHA256=(?<[file][hash][sha256]>[A-Fa-f0-9]{64})(?![A-Fa-f0-9])" }
          overwrite => ["[file][hash][sha256]"]
          tag_on_failure => ["_sysmon_hash_no_sha256"]
        }
        if "_sysmon_hash_no_sha256" in [tags] {
          mutate { remove_field => ["[file][hash][sha256]"] }
        }
      }
      # #338: #328 fixed [user][name] to actually populate from Sysmon's
      # User field (previously silently broken by the same flat-key bug
      # #339/#233 fixed elsewhere) - but that field reaches this pipeline
      # Windows-formatted as DOMAIN\user (e.g. CONTOSO\bob), while the
      # ABAC translate lookup below (Category 2.5) keys
      # configs/lookups/abac-attributes.csv on bare usernames. Every
      # Sysmon event now gets user.abac_attribute:"unassigned" (100% miss
      # rate) unless normalized here first. Scoped to the Sysmon branch
      # only, not applied globally to [user][name] - the SSH auth-log
      # grok's own [user][name] (a few lines below, outside this if-block)
      # can carry an attacker-controlled "invalid user <string>" value,
      # and stripping anything before a backslash there would silently
      # discard forensic detail from a value that's raw evidence, not a
      # domain-qualified account name. code uses single-quoted Logstash
      # config strings, matching this file's own convention for every
      # other multi-line ruby block - a double-quoted attempt made a
      # literal backslash need escaping at BOTH the Logstash-config-string
      # AND Ruby-regex layers and never parsed cleanly (code-reviewer
      # finding, live-verified against the real pinned logstash:9.3.2
      # image both ways).
      #
      # security-auditor finding (MEDIUM): rename, not copy, would
      # otherwise DESTROY the domain - and configs/lookups/abac-
      # attributes.csv has no domain-qualified keys today (no real
      # Windows telemetry flows through this environment yet, #326, so
      # there's no real domain name to key against), meaning a LOCAL
      # account that happens to share a bare username with a real
      # privileged entry (e.g. a workstation's own local "tjlam" account,
      # unrelated to the real domain-joined one in the CSV) would
      # silently inherit that entry's ABAC attributes. Preserving the
      # domain in its own field doesn't close that gap by itself (the
      # lookup below still keys on the bare name alone until the CSV
      # gains domain-qualified keys) - it makes the ambiguity VISIBLE
      # instead of silent, so a future rule/analyst can cross-check
      # user.domain against the expected roster. rpartition (not
      # split.last) so a value with no backslash at all is left alone;
      # empty-string guards on both sides handle a malformed/degenerate
      # value (a trailing or bare backslash) by leaving the field
      # untouched entirely rather than indexing a blank user.name or a
      # blank user.domain - live-verified for 7 cases (normal, no
      # domain, multiple backslashes, trailing backslash, bare backslash,
      # leading backslash, field absent) against the real pinned image.
      if [user][name] {
        ruby {
          code => '
            v = event.get("[user][name]")
            if v && v.include?("\\")
              parts = v.rpartition("\\")
              unless parts.last.empty?
                event.set("[user][domain]", parts.first) unless parts.first.empty?
                event.set("[user][name]", parts.last)
              end
            end
          '
        }
      }
      # M13 US3 (#233/#234) found the OriginalFileName rename was missing:
      # field-mapping-sysmon-process-creation in
      # configs/detections/suburban-soc-ecs.yml had claimed
      # OriginalFileName -> process.pe.original_file_name since before this
      # batch, but nothing here ever performed that rename, so every rule
      # filtering on OriginalFileName (8 rules added in this batch, verified
      # by grep) compiled to a query against a field real data never
      # populates — a silent permanent no-op, the same #217 shape (a mapping
      # claim the pipeline doesn't honor). Confirmed no pre-existing rule
      # used OriginalFileName before this batch, so this had never surfaced.
      # Security review (#233) then found the SAME shape a second time,
      # still latent: ecs.yml also claims ParentCommandLine ->
      # process.parent.args, which this block never performed either — added
      # above too, pre-emptively, though no rule uses it yet (a landmine for
      # whichever future rule is first to reference it).
      # ----------------------------------------------------------------------
      # WS1.2: Sigma detection logic is NO LONGER inlined here. The 10 rules in
      # rules/sigma/*.yml are the single source of truth, deployed to the Elastic
      # Detection Engine by scripts/setup/deploy_detections.sh (pySigma). They run
      # against logstash-* and raise alerts in Security → Alerts, with native MITRE
      # ATT&CK coverage. This block now only normalizes Sysmon fields to ECS above;
      # detection + ATT&CK/NIST classification live in the rules, not the pipeline.
      # ----------------------------------------------------------------------
    }

    # Component 3: Windows Security events (4624/4625 login tracking)
    # #297: Winlogbeat's own ECS mapping types winlog.event_id as `keyword`
    # (a string), same as winlog.channel just above — Ruby's `==` has no
    # implicit numeric coercion, so comparing it against a bare integer
    # literal (4625) never matches and this enrichment silently never ran.
    # Live-confirmed against the real logstash:9.3.2 binary before this fix:
    # a synthetic event with [winlog][event_id] = "4625" (string) produced
    # no [event][outcome] field at all.
    if [winlog][channel] == "Security" {
      # security-auditor review: `replace` (not `add_field`) matches this
      # same field's own established convention 60 lines below (the sshd
      # branch) — add_field APPENDS to an array if [event][outcome] is
      # ever already set here by a future upstream change, where replace
      # creates-or-overwrites either way.
      if [winlog][event_id] == "4625" {
        mutate { replace => { "[event][outcome]" => "failure" } }
      }
      if [winlog][event_id] == "4624" {
        mutate { replace => { "[event][outcome]" => "success" } }
      }

      # #342: ECS-enrich for dashboard/hunt use — the missing
      # `source.ip`/`user.target.name` this channel never renamed is what
      # makes a Windows-side auth failure invisible to any ECS-field-based
      # pivot today. Deliberately COPY, not rename (unlike
      # the Sysmon block above): configs/detections/suburban-soc-ecs.yml's
      # own field-mapping-windows-security transformation compiles every
      # deployed Security-channel Sigma rule to query the RAW
      # winlog.event_data.<Field> shape, not an ECS name — and 3 deployed
      # rules/elastic/threshold/*.ndjson rules (auth-win-bruteforce-
      # source-spray, auth-win-bruteforce-failed-logons, auth-win-explicit-
      # cred-account-sweep, all level:high, hand-authored outside the
      # pySigma pipeline) bucket/cardinality-count directly on
      # winlog.event_data.IpAddress/TargetUserName by name. A `rename`
      # would silently break all of them — confirmed by grep before
      # writing this, not assumed. TargetUserName's copy is unconditional
      # (a missing source field is a safe no-op — 4720/4732/etc. don't
      # carry IpAddress at all, and copy from a genuinely absent field
      # never fires either copy).
      mutate {
        copy => { "[winlog][event_data][TargetUserName]" => "[user][target][name]" }
      }
      # security-auditor review: IpAddress's copy is gated (unlike
      # TargetUserName above) — Winlogbeat emits sentinel placeholders,
      # not just the literal "-", for local/console/no-network-source
      # logons: "0.0.0.0" and "::" are BOTH valid values for the ES `ip`
      # field type (unlike "-"), so they would index cleanly as a
      # legitimate-looking terms bucket on the "Brute Force Sources" panel
      # instead of failing loudly. Gating the copy itself (not just the
      # geoip call below) keeps every sentinel out of source.ip entirely.
      # This exact 4-value set is also excluded, independently (no shared
      # constant across Ruby/Lucene), by rules/elastic/threshold/auth-win-
      # bruteforce-source-spray.ndjson's own query (#370) - the RAW
      # winlog.event_data.IpAddress field it buckets on needs the same
      # gate this copy does, for the same reason. If a 5th sentinel is
      # ever found, update both.
      if [winlog][event_data][IpAddress] and [winlog][event_data][IpAddress] not in ["-", "0.0.0.0", "::", ""] {
        mutate {
          copy => { "[winlog][event_data][IpAddress]" => "[source][ip]" }
        }
      }
      # geoip-enrich the copied source IP so Endpoint-dashboard panels that
      # bucket on source.geo.* (e.g. "Failed SSH by Country", scoped below
      # to event.module:system so it can't silently absorb these) also
      # cover Windows-side auth failures. Same RFC1918/loopback/link-
      # local/ULA guard as the sshd branch below, PLUS an optional
      # "::ffff:" IPv4-mapped-IPv6 prefix neither guard originally handled
      # — security-auditor review: domain controllers commonly log the
      # Kerberos Client Address (4768/4769, both collected per
      # configs/endpoint/winlogbeat.yml) in "::ffff:x.x.x.x" form, which
      # the string-anchored RFC1918 alternation never matched, so every
      # internal DC's own Kerberos traffic silently attempted (and failed)
      # a geoip lookup. Elasticsearch's `ip` field type treats
      # "::ffff:10.0.0.5" and "10.0.0.5" as the same value, so only this
      # regex guard was ever fooled, not any query against indexed data.
      if [source][ip] and [source][ip] !~ /^(::ffff:)?(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
        geoip { source => "[source][ip]" target => "[source]" }
      }
    }

    # If processing Linux Auth Logs (/var/log/auth.log or /var/log/secure)
    # Cheap literal pre-filter: auth.log is dominated by sudo/cron/systemd/PAM
    # lines that can never match the sshd grok. Gating on "sshd[" keeps those
    # tens-of-thousands of lines out of the grok engine entirely (ingest-lag
    # hygiene) and shrinks the attacker-controlled-input surface for backtracking.
    # M13 US7 (#230/#243) security review: same RHEL/CentOS gap as the
    # event.module condition above - /var/log/secure carries identically-
    # formatted sshd lines on that OS family and was never matched here.
    if [log][file][path] =~ /(auth\.log|secure)$/ and "sshd[" in [message] {
      # #161: capture into ECS BRACKET notation ([source][ip], not the dotted
      # "source.ip"). The dotted form creates a *flat* key that the geoip
      # conditional below (`if [source][ip]`) never matches — the exact trap the
      # network_logs NOTE documents, and why source geoip silently never ran for
      # SSH sources. `(?:invalid user )?` also captures brute-force attempts
      # against non-existent accounts (the bulk of attacker traffic), which the
      # old pattern dropped entirely.
      #
      # SECURITY (grok anchoring): the username is ATTACKER-CONTROLLED and is
      # echoed BEFORE the client IP that sshd appends. A non-greedy, unanchored
      # capture lets `user=victim from 8.8.8.8 port 22` bind [source][ip] to the
      # injected IP and drop the real one (source-IP/country spoof, geoip-guard
      # evasion, HUNT-002 poisoning). So the pattern is fully anchored (^…$) and
      # the username is GREEDY: the trailing, sshd-supplied `from <ip> port <n>`
      # is always the LAST match and therefore always wins. NOTSPACE (not WORD)
      # for the auth method covers `keyboard-interactive/pam`. timeout_millis
      # bounds worst-case backtracking on adversarial input.
      # M13 US7 (#230/#243) security review: modern OpenSSH (~6.8+) appends a
      # key-fingerprint suffix to publickey accept/fail lines - "... port
      # 54321 ssh2: RSA SHA256:<b64>" - which the old pattern's `\s*$` right
      # after the optional " ssh2" could never match (a literal colon and
      # fingerprint text isn't whitespace), silently grokparsefailure-ing
      # every publickey auth line, success or failure. `(?:\:.*)?` consumes
      # that optional trailing fingerprint; it sits entirely AFTER the
      # username/IP/port capture the anchoring above protects, so it cannot
      # reopen that injection vector - it only ever matches content sshd
      # itself appends at the very end of an already-fully-anchored line.
      grok {
        match => { "message" => "^%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:[host][name]} sshd\[%{POSINT:[process][pid]}\]: %{WORD:[event][outcome]} %{NOTSPACE:[system][auth][method]} for (?:invalid user )?%{GREEDYDATA:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]}(?:\s+ssh2)?(?:\:.*)?\s*$" }
        timeout_millis => 1000
      }
      # Normalize the sshd auth verb to ECS event.outcome. Raw logs emit
      # "Failed password ..." / "Accepted publickey ..." -> grok captures
      # "Failed"/"Accepted"; the Endpoint dashboard panels query
      # event.outcome:failure, so without this the SSH panels never match.
      if [event][outcome] =~ /(?i)^fail/ {
        mutate { replace => { "[event][outcome]" => "failure" } }
      } else if [event][outcome] =~ /(?i)^accept/ {
        mutate { replace => { "[event][outcome]" => "success" } }
      }
      # #161: geoip-enrich the SSH client (attacker) source IP so the Endpoint
      # dashboard "Failed SSH by Country" panel (buckets on
      # source.geo.country_name) populates. Inbound brute-force sources only get
      # source.geo here — the zeek/network geoip filters never touch auth.log.
      # Guard RFC1918/loopback/link-local/ULA — internal IPs never resolve (same
      # base guard as the Category 0 zeek branch, PLUS an optional "::ffff:"
      # IPv4-mapped-IPv6 prefix the zeek branch doesn't carry — #342
      # security-auditor review: sshd can log a dual-stack-socket client
      # address in that form depending on OS/config, same artifact class
      # as the Windows Kerberos Client Address the Security-channel guard
      # just above was extended for; Zeek's conn.log addresses come from
      # already-normalized packet-level parsing, not a socket API, so it
      # doesn't carry this same artifact and was left as-is).
      if [source][ip] and [source][ip] !~ /^(::ffff:)?(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1|fe80:|fc|fd)/ {
        geoip { source => "[source][ip]" target => "[source]" }
      }
    }

    # Component 4: Linux process-execution (execve) telemetry (#442 —
    # prerequisite for #441 Part A's 5 proc_creation_lnx_* rules). Ships the
    # RAW auditd log (/var/log/audit/audit.log, via the new
    # configs/endpoint/filebeat_endpoint.yml filestream input + the audit
    # rules in configs/endpoint/audit.rules) — deliberately NOT the Filebeat
    # auditd module + Elasticsearch ingest-pipeline path. Every other source
    # in this pipeline (Sysmon, sshd, Zeek) is parsed centrally right here in
    # Logstash, going through the same tenant-stamping/geoip/byte-clamp
    # filters every other event does; a Filebeat-module + ES-ingest-pipeline
    # path would bypass all of that and introduce a second, inconsistent
    # parsing architecture for one source.
    #
    # auditd writes ONE record per physical line (no multiline join needed,
    # unlike a source that wraps a single event across lines) but splits one
    # execve across at least two DIFFERENT lines sharing a correlation id,
    # printed as `msg=audit(<epoch>.<msec>:<serial>):`:
    #   type=SYSCALL msg=audit(...): ... ppid=1000 pid=1234 auid=1000(alice) uid=1000 ... comm="bash" exe="/usr/bin/bash" ...
    #   type=EXECVE  msg=audit(...): argc=2 a0="bash" a1="-c" a2="<full argv, may itself contain spaces>"
    # Joined with Logstash's `aggregate` filter (bundled in the full
    # docker.elastic.co/logstash/logstash image already used by this stack,
    # same as the `elasticsearch`/`geoip` filters already used unconditionally
    # elsewhere in this file — no plugin-install step needed), keyed on that
    # audit id. SYSCALL arrives first (kernel emits it at syscall entry) and
    # only ever seeds the correlation map — it carries no argv, so it is
    # never itself the emitted document; EXECVE arrives second, supplies
    # process.args, and is the document that completes the join and emits.
    #
    # Deliberately does NOT populate process.parent.name: auditd's SYSCALL
    # record only gives ppid (a PID NUMBER), and this pipeline has no
    # PID->exe-name process-tree cache. Claiming that mapping without a real
    # producer behind it is exactly this repo's own #217 anti-pattern (a
    # field mapping that reads correctly but nothing actually populates) —
    # left unmapped instead, matching configs/detections/suburban-soc-ecs.yml's
    # field-mapping-auditd-process-creation transformation, which maps only
    # Image/CommandLine/User for this logsource, not ParentImage/
    # ParentCommandLine.
    #
    # OPERATIONAL CAVEAT, not yet resolved: `aggregate` correlates by
    # task_id ONLY correctly when every event sharing a task_id is handled
    # by the SAME pipeline worker thread — Elastic's own docs for this
    # filter warn it is unsafe with `pipeline.workers` > 1 unless that's
    # guaranteed some other way. configs/logstash.yml sets no
    # `pipeline.workers`, so this container runs Logstash's default
    # (one per CPU core) — SYSCALL and its EXECVE sibling could land on
    # different workers under real concurrent load and never correlate.
    # Not resolved here: pinning `pipeline.workers: 1` is a whole-pipeline
    # throughput tradeoff affecting every OTHER source in this file too,
    # not a change to make unilaterally alongside one new branch. Confirm
    # against a real multi-core deployment before relying on this in
    # production — either verify Logstash's worker-to-task_id affinity
    # behavior directly, or pin pipeline.workers: 1 as a deliberate,
    # separately-reviewed decision.
    #
    # NOT exercised against a live auditd stream in this environment (no
    # reachable Docker daemon / Linux audit host) — confirm against a real
    # host before relying on this in production, same caveat this repo's
    # other environment-blocked static-only changes carry (#454,
    # tests/pipeline/test_mac_correlation.py's own docstring).
    if [log][file][path] =~ /audit\/audit\.log$/ {
      grok {
        match => { "message" => "^type=%{WORD:[audit][record_type]} msg=audit\(%{NOTSPACE:[audit][id]}\):" }
        tag_on_failure => ["_audit_header_nomatch"]
      }

      if [audit][record_type] == "SYSCALL" {
        # auid resolves to a bare uid unless auditd.conf sets
        # `log_format = ENRICHED` (configs/endpoint/audit.rules' own header),
        # which annotates it inline as auid=1000(alice) — the optional
        # `(?:\(...\))?` group degrades gracefully to uid-only when that
        # isn't set, rather than failing the whole grok.
        grok {
          match => { "message" => "ppid=%{POSINT:[process][parent][pid]} pid=%{POSINT:[process][pid]} auid=%{POSINT:[user][id]}(?:\(%{DATA:[user][name]}\))?%{DATA}comm=\"%{DATA:[process][name]}\" exe=\"%{DATA:[process][executable]}\"" }
          tag_on_failure => ["_audit_syscall_field_nomatch"]
        }
        # Correlation only — see this block's own header comment for why
        # SYSCALL is never the emitted document.
        aggregate {
          task_id => "%{[audit][id]}"
          code => "
            map['process_parent_pid'] = event.get('[process][parent][pid]')
            map['process_pid']        = event.get('[process][pid]')
            map['process_name']       = event.get('[process][name]')
            map['process_executable'] = event.get('[process][executable]')
            map['user_id']            = event.get('[user][id]')
            map['user_name']          = event.get('[user][name]')
          "
          map_action => "create_or_update"
        }
        drop {}
      } else if [audit][record_type] == "EXECVE" {
        # a0/a1/.../aN are each individually double-quoted and MAY contain
        # embedded whitespace (e.g. a shell invoked as `bash -c "<full
        # pasted command>"` puts the ENTIRE command in one argv element) —
        # a plain `kv` filter's default whitespace-token splitting would
        # break a value like that apart mid-string, so this is a
        # quote-aware regex scan instead. Same "regex over kv/grok for a
        # raw, adversarial string" judgment call as this file's own #339
        # Sysmon SHA256 extraction above. scan() returns matches in the
        # order found in the string, which is already a0, a1, a2... since
        # auditd always emits them in ascending index order — no separate
        # sort-by-index step needed.
        ruby {
          code => '
            msg = event.get("message").to_s
            args = msg.scan(/a\d+="((?:[^"\\]|\\.)*)"/).flatten
            event.set("[process][args]", args.join(" ")) unless args.empty?
          '
        }
        aggregate {
          task_id => "%{[audit][id]}"
          code => "
            if map['process_executable']
              event.set('[process][executable]', map['process_executable'])
              event.set('[process][name]', map['process_name']) if map['process_name']
              event.set('[process][pid]', map['process_pid'].to_i) if map['process_pid']
              event.set('[process][parent][pid]', map['process_parent_pid'].to_i) if map['process_parent_pid']
              event.set('[user][id]', map['user_id']) if map['user_id']
              event.set('[user][name]', map['user_name']) if map['user_name']
            end
          "
          map_action => "update"
          end_of_task => true
          timeout => 5
        }
        # #217-shape guard: only stamp event.dataset — and therefore only
        # let this document match a linux/process_creation Sigma rule —
        # when the SYSCALL half of the pair actually correlated. Without
        # this, an EXECVE record whose SYSCALL sibling never arrived,
        # never matched, or already timed out of the aggregate map would
        # still carry event.module:auditd and LOOK like a real, matchable
        # process-execution record to every downstream consumer, while
        # carrying none of the fields any proc_creation_lnx_* rule
        # actually selects on.
        if [process][executable] {
          mutate { add_field => { "[event][dataset]" => "auditd.execve" } }
        } else {
          mutate { add_tag => ["_audit_correlation_incomplete"] }
        }
      } else {
        # PROCTITLE/CWD/PATH/other records from the same execve group carry
        # no field this pipeline maps today — drop them; only SYSCALL+EXECVE
        # matter for #441's rules.
        drop {}
      }
    }
  }

  # --- Category 2.5: ABAC Contextual Data Enrichment (NIST 800-162) ---
  if [user][name] {
    translate {
      field => "[user][name]"
      destination => "[user][abac_attribute]"
      dictionary_path => "/usr/share/logstash/config/lookups/abac-attributes.csv"
      fallback => "unassigned"
      refresh_interval => 300
    }
  }
  if [winlog][event_data][LogonType] {
    translate {
      field => "[winlog][event_data][LogonType]"
      destination => "[event][logon_type_desc]"
      dictionary_path => "/usr/share/logstash/config/lookups/windows-logon-type.csv"
      fallback => "unknown"
      refresh_interval => 300
    }
  }

  # --- Category 3: Operational Metadata Enrichment ---
  # Component 4 (audit P2-4): ingest timestamp for the Document Lag panel, pinned to
  # UTC so it matches @timestamp regardless of the JVM/host timezone. The previous
  # sprintf %{+...} form rendered in JVM-local TZ, skewing the document-lag math.
  ruby { code => "event.set('[event][created]', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ'))" }
  mutate {
    add_field => {
      "[@metadata][pipeline]" => "security-enrichment"
    }
    # Ensure all field copies capture structural tracking metrics
    copy => {
      "[agent][name]" => "agent.hostname"
      "[log][file][path]" => "log.file.path"
    }
  }

  # Component 4: tag parse failures for the Data Quality dashboard
  if "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] {
    mutate {
      add_field => { "[pipeline][error]" => "true" }
    }
  }

  # Redact obvious secrets left inline in the raw message (password=, token=, api_key=)
  # and in the grok-extracted [user][name]. Attacker-controlled "invalid user"
  # strings from SSH brute force (#161) are copied into user.name before this stage,
  # so the message-only gsub used to leave a pasted credential (e.g. login as
  # `password=hunter2`) verbatim in user.name — persisted to ES/snapshots past the
  # right-to-erasure surface (SOP-012). Redact both. Keeps the event for analytics.
  #
  # #337 security-auditor review: this block MUST run BEFORE the #252/#263
  # byte-clamp filter below, not after (its original position, moved here
  # in this fix) — "\1=[REDACTED]" GROWS the matched substring (a 5-char
  # "pwd:x" match becomes the 14-char "pwd=[REDACTED]", +9 bytes per hit),
  # so redacting an ALREADY-clamped user.name value could push it back
  # over Lucene's 32766-byte hard limit with no clamp left downstream to
  # catch it — the byte-clamp's own ≤32000-byte guarantee silently broken
  # by the very next filter stage. Redact-then-measure is correct;
  # measure-then-redact is not, even though neither order affects
  # TODAY's producers (sshd's line length is bounded by the syslog
  # daemon, Sysmon's User is a bounded DOMAIN\user) — this is closing an
  # invariant break, not a live gap.
  if [message] or [user][name] {
    mutate {
      gsub => [
        "message", "(?i)(password|passwd|pwd|token|api[_-]?key|secret|authorization)\s*[=:]\s*\S+", "\1=[REDACTED]",
        "[user][name]", "(?i)(password|passwd|pwd|token|api[_-]?key|secret|authorization)\s*[=:]\s*\S+", "\1=[REDACTED]"
      ]
    }
  }

  # #252: process.args/process.parent.args/ScriptBlockText/ImagePath/
  # url.path/winlog.event_data.CommandLine/network_parsed.uri (#290, #344)
  # carry attacker-controlled content and are mapped ignore_above (#249/#250,
  # raised from 1024 to 8191; #263 raised again to 32766, the Lucene keyword
  # term byte ceiling, after 8191 turned out to still be below real
  # PowerShell 4104 chunk sizes and encoded command-line lengths, letting
  # both PowerShell rules AND system_win_suspicious_service_binpath_lolbin.yml
  # be bypassed by payload length). A value longer than that ceiling is
  # silently dropped from the index while staying in _source - a query can
  # never find it. Tag it instead of leaving the drop invisible -
  # metric_field_truncation_count() in slo_metrics.py turns this into a
  # measured rate. Keep `ceiling` below in lockstep with the template's
  # ignore_above - a mismatch would tag values that are actually indexed
  # fine as falsely truncated (tests/pipeline/test_field_truncation.py's
  # CeilingConsistencyTests enforces this as a CI gate, not just a comment).
  #
  # #263 review (security-auditor + tester-debugger, live-verified): two
  # bugs found in this exact block.
  # (1) ignore_above is a CHARACTER count but Lucene's own per-term hard
  #     limit is a UTF-8 BYTE count (32766) - a value under the char ceiling
  #     but byte-heavy (multi-byte UTF-8, e.g. Unicode identifier/homoglyph
  #     obfuscation in ScriptBlockText - a real T1027 technique, not
  #     theoretical) doesn't get gracefully ignore_above-dropped, it makes
  #     Elasticsearch reject the WHOLE DOCUMENT: confirmed live, HTTP 400
  #     document_parsing_exception -> illegal_argument_exception "Document
  #     contains at least one immense term ... UTF8 encoding is longer than
  #     the max length 32766". That's total event loss - strictly worse than
  #     the original bug (one field silently unindexed, document and every
  #     other field survives). Guarded below by clamping to byte_ceiling
  #     (kept under 32766 for margin: lowercase_normalizer's case-folding,
  #     applied by ES after this filter runs, can grow a small number of
  #     Unicode code points' byte length, e.g. U+0130 -> 2 bytes becomes a
  #     3-byte decomposition) before the value ever reaches Elasticsearch.
  # (2) The Sysmon `mutate.rename` block above (~line 514) targeted bare
  #     dotted strings ("process.args", not "[process][args]"), which
  #     Logstash creates as a FLAT field literally named "process.args" -
  #     not the nested structure this filter's long_fields keys expect
  #     (same footgun this file already documents at its network-rename
  #     block, ~line 441). Confirmed live: event.get("[process][args]")
  #     returned nil for real Sysmon-sourced events, so process.args/
  #     process.parent.args were never actually tagged - dead code since
  #     whenever the Sysmon rename block was introduced. winlog.event_data.
  #     ScriptBlockText was unaffected (nothing renames it, always
  #     genuinely nested). Worked around at the time by falling back to the
  #     flat dotted key when the nested lookup missed, rather than fixing
  #     the rename block itself - tracked as #328, since that touches 9
  #     renames feeding the whole Sysmon rule surface and needed its own
  #     dedicated regression pass. #328 fixed the rename block directly
  #     (bracket notation, matching the network-rename block's own
  #     convention); the flat-key fallback below is removed as of that fix
  #     - nothing in this pipeline produces a flat "process.args"-shaped
  #     key anymore, so it was dead code once the root cause was fixed, not
  #     a compatibility shim worth keeping.
  ruby {
    code => '
      ceiling = 32766
      byte_ceiling = 32000
      # #337: long_fields values are [label, field_ceiling] pairs, not
      # bare labels - byte-clamp is only ever attempted when
      # field_ceiling*4 exceeds Lucenes 32766-byte hard limit (see the
      # field_ceiling * 4 > 32766 guard below); every entry below at a
      # LOWER ceiling (8191/1024) is structurally safe
      # from the Lucene immense-term crash by design (8191*4=32764 and
      # 1024*4=4096 both stay under the 32766-byte hard limit even for
      # all-multi-byte content, same margin reasoning documented in
      # logstash-security-template.jsons own _meta description) - those
      # entries only need the char_hit truncation-visibility tag, never a
      # byte clamp.
      long_fields = {
        "[process][args]" => ["process.args", ceiling],
        "[process][parent][args]" => ["process.parent.args", ceiling],
        "[winlog][event_data][ScriptBlockText]" => ["winlog.event_data.ScriptBlockText", ceiling],
        "[winlog][event_data][ImagePath]" => ["winlog.event_data.ImagePath", ceiling],
        # #290 security-auditor HIGH: url.path was raised to ignore_above:32766
        # (from no explicit ceiling at all) to fix a case-normalization gap,
        # without being added here — silently reintroducing the #263 Lucene
        # immense-term whole-document-rejection bug (HTTP 400, the ENTIRE
        # event lost, not just this field) on a fully attacker-controlled
        # field (the HTTP request URI). Live-confirmed against the real
        # elasticsearch:9.3.2 image before this fix: a 20000-char/40000-byte
        # url.path (under the 32766 CHAR ceiling, over the 32766 BYTE Lucene
        # limit) crashed the whole document, dropping source.ip/@timestamp
        # along with it. NOTE: this comment sits inside the Logstash
        # single-quoted code string for this filter — no apostrophes or
        # single quote characters allowed anywhere in this ruby block,
        # comments included, or the whole pipeline config fails to parse
        # at startup (confirmed the hard way while verifying this exact
        # fix).
        "[url][path]" => ["url.path", ceiling],
        # #344: unlike the 5 entries above, this field needs NO template
        # change — the long_command_fields dynamic_template (logstash-
        # security-template.json) already maps anything matching
        # *CommandLine at ignore_above:32766, and Windows Security-channel
        # events (EventID 4688 command-line auditing) keep Winlogbeats
        # raw, un-renamed winlog.event_data.CommandLine shape — unlike the
        # Sysmon channel, which renames its own CommandLine to
        # process.args, already covered above. A dynamic-template match is
        # invisible to this hash unless listed by hand
        # (CeilingConsistencyTests test_every_ceiling_field_has_a_byte_
        # clamp_entry only walks EXPLICIT template properties, by design —
        # it cannot see fields that only ever reach ES through a glob
        # match), so this field was silently unclamped since #263 raised
        # that dynamic_templates ceiling — same whole-document Lucene
        # immense-term rejection risk as every other entry here. NOTE:
        # 4688 is not in configs/endpoint/winlogbeat.ymls Security
        # event_id list today (Sysmon EID 1 already covers process-
        # creation command lines) — this entry is pre-emptive hardening,
        # not a live gap, so enabling 4688 later cannot silently
        # reintroduce the bug.
        "[winlog][event_data][CommandLine]" => ["winlog.event_data.CommandLine", ceiling],
        # #344 security-auditor follow-up: network_parsed.uri is the one
        # OTHER concrete instance of this same class in the repo today —
        # matches *uri at ignore_above:32766 via the same dynamic_template,
        # and Category 1s own rename block (~line 501) documents that it
        # is deliberately left unrenamed (net_zeek_http_cobalt_strike_
        # beacon.yml selects on it directly). Unlike CommandLine, this one
        # IS live-reachable today: the :5514 HTTP input is unauthenticated
        # and posts straight into this branch. Same fully attacker-
        # controlled shape as #290s url.path (an HTTP request URI).
        "[network_parsed][uri]" => ["network_parsed.uri", ceiling],
        # #337: user.name/related.user were mapped keyword with NO
        # ignore_above at all — unlike every other field in the template,
        # which falls to strings_as_keyword default-1024 the moment its
        # unmapped, an EXPLICIT keyword property with no ignore_above gets
        # Elasticsearchs own default (2147483647) instead — no char-
        # ceiling backstop, so a long value reaches Lucene directly and
        # hits the same immense-term whole-document-rejection crash
        # #263/#290/#344 fixed for their own fields, just with nothing to
        # catch it first. Raised to ceiling (32766) in the template in the
        # same fix, which is why this hash needs an entry for it too — the
        # exact CeilingConsistencyTests requirement every prior 32766-
        # ceiling field has already gone through.
        "[user][name]" => ["user.name", ceiling],
        # #337 security-auditor review: unlike user.name, related.user is
        # NOT raised to ceiling - ECS defines related.* as an ARRAY field,
        # and this hash only clamps String values (next unless
        # val.is_a?(String), below), so a 32766-tier entry for an array
        # field would satisfy CeilingConsistencyTests CI gate while
        # silently no-oping the moment a real producer populates it (the
        # exact dns.answers trap this templates own _meta already
        # documents). Mapped ignore_above:8191 instead (matching its
        # related.hosts sibling, same array shape) - safely below this
        # tiers own byte-clamp-not-needed threshold either way, so the
        # array-vs-string distinction is moot at 8191 specifically (see
        # the field_ceiling * 4 > 32766 guard below - this branch never
        # runs for an 8191-tier field, array or string).
        "[related][user]" => ["related.user", 8191],
        # #337: the remaining fields the Sysmon rename block (~line 578)
        # also produces are tracked here too, closing #252s own stated
        # purpose (make silent ignore_above drops MEASURABLE) for them —
        # none of these needs byte-clamp (see the field_ceiling * 4 >
        # 32766 guard below), only the truncation-visibility tag.
        "[process][executable]" => ["process.executable", 8191],
        "[process][parent][name]" => ["process.parent.name", 8191],
        "[file][path]" => ["file.path", 1024],
        "[user][target][name]" => ["user.target.name", 1024],
        "[process][pe][original_file_name]" => ["process.pe.original_file_name", 1024],
        "[file][hash][sha256]" => ["file.hash.sha256", 1024]
      }
      hit = []
      byte_hit = []
      long_fields.each do |bracket_path, (label, field_ceiling)|
        val = event.get(bracket_path)
        next unless val.is_a?(String)
        # #337 security-auditor follow-up: Ruby String#length counts
        # UNICODE CODE POINTS, but Elasticsearchs ignore_above compares
        # against Javas String#length - UTF-16 CODE UNITS - and the two
        # only diverge for ASTRAL-PLANE characters (code point >
        # U+FFFF, most emoji among them): Ruby counts one as 1, Java/ES
        # counts it as 2 (a surrogate pair). A value with exactly
        # field_ceiling+1 astral characters reads as UNDER the ceiling by
        # code-point count while ES silently ignore_above-drops it by its
        # own UTF-16-unit count - the exact silent-drop-with-no-tag #252
        # exists to prevent, reintroduced for heavily-astral content.
        # UTF-16LE byte count / 2 gives the identical count Java/ES uses.
        utf16_length = val.encode("UTF-16LE").bytesize / 2
        if utf16_length > field_ceiling
          # ignore_above (== field_ceiling) makes ES skip indexing this
          # field on its own, safely, before Lucene ever sees the term -
          # that skip is exactly what pipeline.truncated exists to make
          # visible. No byte check needed here: this branch and the one
          # below are mutually exclusive by construction (checking
          # bytesize unconditionally, then clamping, would silently
          # swallow every char-ceiling hit into byte_hit instead - since
          # UTF-8 byte length is never less than char length, byte_ceiling
          # < field_ceiling means it would always fire first - making
          # pipeline.truncated permanently dead. Caught by hand-deriving
          # this fixture set against the real logic before shipping it,
          # not just trusting the first draft passed tests.)
          hit << label
        elsif field_ceiling * 4 > ceiling && val.bytesize > byte_ceiling
          # #337 security-auditor follow-up: guards on the PROPERTY this
          # branch actually depends on (field_ceiling*4 - the worst-case
          # byte length for all-multi-byte content - exceeding Lucenes
          # real 32766-byte hard limit, referenced via the `ceiling`
          # variable above rather than a second hardcoded 32766 literal
          # that could drift from it), not an exact field_ceiling ==
          # ceiling match. The original exact-match version was correct
          # for the two tiers that exist today (8191*4=32764,
          # 1024*4=4096, both safely under) but would have silently
          # skipped this guard for ANY future tier strictly between 8192
          # and 32765 - the same "nobody remembered to update every
          # place" failure class #290 already hit once. This form is
          # correct for every tier automatically, current or future, with
          # identical behavior today (CeilingConsistencyTests pins the
          # exact formula - see test_lower_tier_byte_clamp_guard_
          # formula_matches_python_mirror).
          #
          # Under the ignore_above char ceiling, so ES will attempt to index
          # this term - but multi-byte UTF-8 content can still push the BYTE
          # length past the Lucene hard per-term limit even while the CHAR
          # length stays under `ceiling` (impossible for pure ASCII, where
          # bytes==chars exactly - only reachable via genuinely multi-byte
          # content, e.g. Unicode identifier obfuscation in ScriptBlockText).
          # Confirmed live: unclamped, this crashes the WHOLE document
          # (HTTP 400 document_parsing_exception -> illegal_argument_exception
          # "Document contains at least one immense term ... whose UTF8
          # encoding is longer than the max length 32766"), not just this
          # field - total event loss, strictly worse than the bug #263 set
          # out to fix. byteslice+scrub clamps at a safe byte length,
          # repairing any multi-byte character split by the cut.
          val = val.byteslice(0, byte_ceiling).scrub
          event.set(bracket_path, val)
          byte_hit << label
        end
      end
      if hit.any?
        event.set("[pipeline][truncated]", "true")
        event.set("[pipeline][truncated_fields]", hit)
        event.tag("pipeline_truncated")
      end
      if byte_hit.any?
        event.set("[pipeline][byte_clamped]", "true")
        event.set("[pipeline][byte_clamped_fields]", byte_hit)
        event.tag("pipeline_byte_clamped")
      end
    '
  }

  # #352 (security-auditor follow-up to #292/#351): [dns][answers] is
  # deliberately NOT in the long_fields hash above — it's a flat ARRAY of
  # raw strings (see the [answers] mutate.rename block's own comment,
  # Component 1 area), and that hash's byte-clamp only ever operates on
  # String values (`next unless val.is_a?(String)`, above) — exactly the
  # dns.answers-shaped trap that hash's own #337 comments already warn
  # about for related.user. An individual answer over the template's
  # ignore_above:8191 (#292) is still silently unindexed with no error and
  # no pipeline.truncated tag either way. Per the WARNING in
  # logstash-security-template.json's own _meta description, raising
  # ignore_above further isn't safe without first making the byte-clamp
  # array-aware — Zeek dns.log answers have no protocol bound short of
  # DNS's 65535-byte RDLENGTH, so this is a residual visibility gap, not a
  # truncation-prevention job: this filter deliberately does NOT clamp or
  # raise anything, it only tags. A >8191-char TXT answer is itself a
  # high-fidelity anomaly worth surfacing even before net_zeek_dns_txt_
  # answer_abuse.yml's own length-heuristic rule gets a chance to see it —
  # real TXT-based C2 (Cobalt Strike DNS-TXT, Empire) chunks payload into
  # ~250-byte answers because of UDP response-size limits, so an answer
  # this large is not how organic C2 traffic is shaped.
  # security-auditor round 2 MEDIUM: a SCALAR [dns][answers] (this corpus
  # own established fixture convention - #292s fixtures.json/test_live_
  # fire.py both model `answers` as scalar, and Elasticsearch indexes a
  # 1-element array and a bare scalar IDENTICALLY per test_live_fire.pys
  # own note) got NO check at all in this fixs first draft - and the
  # scalar shape is exactly what an unauthenticated :5514 POST (Category 0,
  # ~line 39) produces, not a hypothetical. Now checked identically to
  # array elements, same tag either way - one queryable signal for both
  # shapes, not two.
  # HONEST DISCLOSURE (tester-debugger, #352 review): this checks >8191
  # chars because that is the real template ceiling (#292), and it is
  # correct defense-in-depth for ANY producer of dns.answers - but
  # live-verified against the real pinned zeek/zeek:8.2.1 image (a
  # hand-crafted, wire-checked 40-chunk/10000-byte TXT resource record
  # replayed through it) that Zeek's OWN DNS analyzer independently
  # truncates a TXT records joined answers[] string at ~4096 characters,
  # roughly half this ceiling, with NO truncation marker anywhere in
  # dns.log. That means this specific check is structurally unreachable
  # for real TXT-record traffic today - not a live gap, and not
  # something this Logstash-side check can fix (Zeek discards the data
  # before Logstash ever sees it). Filed as #389 - the actual silent-
  # truncation point for TXT content is Zeek itself, needing a Zeek-side
  # fix, out of scope here. See metric_oversized_dns_answer_count()'s own
  # docstring (scripts/setup/ai_agent/slo_metrics.py) for the fuller
  # "why keep 8191 rather than lower it" reasoning - this comment and
  # that docstring are meant to be read together, not each a complete
  # account on its own.
  if [dns][answers] {
    ruby {
      code => '
        answers = event.get("[dns][answers]")
        # security-auditor round 3: .flatten (not a bare ternary) -
        # a NESTED array (e.g. [["<9000 chars>"]], live-confirmed against
        # the real running Elasticsearch to be silently unindexed past
        # ignore_above:8191 exactly like a flat array element, since ES
        # flattens arrays-of-arrays for a keyword-mapped field) would
        # otherwise never match is_a?(String) below and skip the check
        # entirely - reachable via the same unauthenticated :5514 POST
        # already documented above, one extra bracket away from the flat
        # shape that IS checked.
        elements = answers.is_a?(Array) ? answers.flatten : [answers]
        # Same UTF-16 code-unit counting as the long_fields filter above
        # (Elasticsearchs ignore_above compares Javas String#length, not
        # Rubys/Pythons code-point count) - see that filters own comment
        # for the astral-plane divergence this avoids. a.bytesize (Rubys
        # own UTF-8 byte count) is provably >= the UTF-16 code-unit count
        # for every code point, so a.bytesize <= 8191 already proves the
        # UTF-16 count cannot exceed 8191 either - skips the UTF-16LE
        # re-encode allocation for the overwhelming majority of ordinary
        # (short) DNS answers, on a pipeline with its own ingest-lag SLO.
        # valid_encoding? guards the encode call itself - a value with an
        # invalid byte sequence would otherwise raise inside this ruby
        # filter (logstash-filter-ruby catches it and tags
        # _rubyexception, but nothing in this pipeline currently monitors
        # that tag - security-auditor round 3, low reachability, same
        # pre-existing exposure the long_fields filter above already has
        # at its own .encode("UTF-16LE") call).
        oversized = elements.any? do |a|
          a.is_a?(String) && a.valid_encoding? && a.bytesize > 8191 &&
            (a.encode("UTF-16LE").bytesize / 2) > 8191
        end
        if oversized
          event.set("[pipeline][oversized_dns_answer]", "true")
          event.tag("pipeline_oversized_dns_answer")
        end
        # #389: Zeeks own DNS analyzer independently hard-truncates a
        # joined TXT-answer answers[] string at exactly 4096 UTF-16
        # code units, with no marker anywhere in dns.log - the check
        # above can never catch this (it fires past 8191, roughly double
        # Zeeks real internal cap; Zeek discards the excess before
        # Logstash ever sees it). An element landing at EXACTLY 4096 is
        # the interim, cheap detection signal #389s own review round
        # proposed while the real fix (Zeek-side) is out of scope here -
        # not proof of truncation (a genuinely 4096-code-unit answer is
        # possible, if unlikely), but high-fidelity enough to page an
        # analyst toward checking the source records true wire length.
        # A bytesize-under-4096 pre-filter would be wrong here (unlike
        # the oversized check above, an exact-length target has no valid
        # fast lower bound to skip on) - always UTF-16-encoding short
        # answers is cheap since they are short.
        zeek_truncated = elements.any? do |a|
          a.is_a?(String) && a.valid_encoding? &&
            (a.encode("UTF-16LE").bytesize / 2) == 4096
        end
        if zeek_truncated
          event.set("[pipeline][dns_answer_truncated_by_zeek]", "true")
          event.tag("pipeline_dns_answer_truncated_by_zeek")
        end
      '
    }
  }

  # --- Category 3.5: WS3.4 PII minimization (data minimization at ingest) ---
  # SOC 2 Privacy / data-handling: keep only what detection & response need. Strip
  # high-risk payload/secret fields that carry user content or credentials but add
  # nothing to security analytics. Dropping them at ingest means they never land in
  # Elasticsearch, snapshots, or the right-to-erasure surface. See SOP-012.
  mutate {
    remove_field => [
      "[http][request][body][content]",   # request payloads (form data, uploads)
      "[http][response][body][content]",   # response payloads
      "[http][request][headers][cookie]",  # session cookies
      "[http][request][headers][authorization]", # bearer/basic creds
      "[http][request][headers][set-cookie]",
      "[url][password]", "[url][username]", # credentials embedded in URLs
      "[user][password]", "[user][full_name]", "[user][email]" # not needed for detection
    ]
  }

  # --- Category 4: Threat Detection & Alerting ---
  # WS1.1: the hardcoded demo IOC (185.150.115.115) is GONE. Threat detection is now
  # driven by the live intel feed (WS1.3) via the Zeek Intel framework — see the
  # `zeek.intel` block above, which tags real matches CRITICAL_THREAT + intel_match.

  # --- Category 5: Framework Enrichment (MITRE ATT&CK + NIST CSF) ------------
  # Classify NETWORK (Zeek) detections with ECS threat.* + NIST CSF function so the
  # Executive dashboard's MITRE heatmap / NIST donut aggregate correctly.
  # WS1.2: ENDPOINT (Sigma) ATT&CK classification is no longer done here — those
  # detections are Elastic Detection Engine rules now, carrying their own MITRE
  # threat mapping; coverage shows in Security → Alerts / MITRE ATT&CK coverage and
  # the WS1.5 matrix. Only the Zeek scan/brute detections remain pipeline-classified.

  # -- Network detections (Zeek) --
  # T1046 — Zeek port-scan notice -> Discovery
  if [note] == "Scan::Port_Scan" {
    mutate { add_field => {
      "[threat][technique][id]"   => "T1046"
      "[threat][technique][name]" => "Network Service Discovery"
      "[threat][tactic][id]"      => "TA0007"
      "[threat][tactic][name]"    => "Discovery"
      "[threat][framework]"       => "MITRE ATT&CK"
      "[nist][function]"          => "Detect"
    } }
  }
  # T1110 — Zeek SSH brute-force notice -> Credential Access. Matches only the
  # aggregated SSH::Password_Guessing/Login_By_Password_Guesser notice.log
  # entries (mirrors the T1046 branch above), not every individual
  # failed-auth connection event: the previous auth_success-based match let
  # an unauthenticated actor inflate this count at will with a failed-login
  # burst, with zero credentials and zero privileged access (#261).
  if [note] in ["SSH::Password_Guessing", "SSH::Login_By_Password_Guesser"] {
    mutate { add_field => {
      "[threat][technique][id]"   => "T1110"
      "[threat][technique][name]" => "Brute Force"
      "[threat][tactic][id]"      => "TA0006"
      "[threat][tactic][name]"    => "Credential Access"
      "[threat][framework]"       => "MITRE ATT&CK"
      "[nist][function]"          => "Detect"
    } }
  }

  # -- Endpoint detections: see WS1.2 note above. Their ATT&CK/NIST mapping now
  #    lives in the Sigma rules (rules/sigma/*.yml) -> Elastic Detection Engine. --

  # --- Category 6: SOAR webhook signing (WS0.2) ---
  # The AI agent's /alert endpoint now requires an HMAC-SHA256 signature over the
  # exact request body. Build the body here and sign it so the bytes we sign are
  # the bytes the http output sends. Only structured, validated fields (IP/MAC) go
  # in the body — no free text that could perturb sprintf in the output stage.
  # WS1.1: fire on a real Zeek Intel match (threat.indicator.value set by the
  # zeek.intel block) instead of the never-set zeek.conn + threat.indicator.domain.
  # #267: also fire on a T1110 pipeline tag (Category 5 above), so the
  # aggregated SSH::Password_Guessing/Login_By_Password_Guesser notices
  # Zeek itself produces reach automated response, not just threat-intel
  # IOC hits. The live trigger only covered condition 1 of the 3 original
  # conditions rules/elastic_watcher/soar_quarantine_alert.json (now
  # retired, see that file's own comment) fired on when it was superseded
  # by this block - T1046/T1110 detections were tagged for dashboards but
  # never dispatched. T1110 is safe to wire directly: it requires a
  # completed TCP+SSH handshake (detect-bruteforcing.zeek's SumStats over
  # real ssh_auth_failed events), not spoofable by a bare source-IP forger.
  # T1046 (Scan::Port_Scan) is deliberately NOT included here - a
  # security-auditor review found scan-detection.zeek fires on the initial
  # SYN alone, no handshake required, so a spoofed-source SYN sweep could
  # otherwise turn this into an unrate-limited automated-response amplifier
  # against an attacker-chosen victim IP. #331 investigated two sensor-side
  # fixes (gating counting on connection_established/connection_rejected;
  # a global per-hour notice-volume cap) and rejected BOTH after live
  # security review: the first doesn't defend against spoofing at all at
  # this deployment's capture vantage point (zeek-host-capture.service
  # captures at the monitored host's OWN interface, so that host's real
  # reply to a spoofed SYN is exactly as visible to Zeek as a reply to a
  # genuine one), and the second introduced a cheap, silent denial-of-
  # detection primitive (a sub-second burst of spoofed sources exhausts
  # the cap, then a real concurrent scan generates no notice for the rest
  # of the window). scan-detection.zeek is UNCHANGED by #331 as a result -
  # source-authenticity verification isn't achievable at this vantage
  # point without discarding real detections, so #331's actual fix lives
  # in scripts/setup/ai_agent/slo_metrics.py instead (a distinct-source
  # cardinality dimension on the zeek_notices metric, so a spoofed flood
  # is visible as a metric anomaly rather than tried to be prevented at
  # the sensor). T1046 stays pipeline-tagged only, not wired into live
  # dispatch, for the same original reason as before #331: this repo has
  # no rate limiting anywhere in the /alert path, and no source-
  # authenticity signal exists for this notice at all.
  if ([event][dataset] == "zeek.intel" and [threat][indicator][value]) or [threat][technique][id] == "T1110" {
    ruby {
      init => 'require "openssl"; require "json"'
      code => '
        secret = ENV["SOC_AGENT_HMAC_SECRET"].to_s
        # #220: technique feeds the agent sliding host+technique suppression
        # window (should_suppress_technique in checkpoints.py). Populated
        # directly from Category 5s tag for the T1110 branch (#267).
        # Still empty for a zeek.intel-only IOC hit with no technique tag -
        # a threat-intel hit alone does not reveal which technique the
        # traffic represents, and this stack does not fabricate a
        # classification without evidence to back it.
        # NOTE: this whole Ruby block is a Logstash config string wrapped in
        # single quotes (the code setting a few lines above this one) - a
        # literal apostrophe anywhere inside it, including inside a comment,
        # closes that string early and breaks config parsing. No contractions
        # or apostrophes anywhere in this block, comments included.
        technique = event.get("[threat][technique][id]").to_s
        body = {
          "severity"   => "critical",
          "tenant_id"  => event.get("[tenant][id]").to_s,
          "source_ip"  => event.get("[source][ip]").to_s,
          "source_mac" => event.get("[source][mac]").to_s,
          "technique"  => technique
        }.to_json
        # audit P1-1: replay protection. Sign "<timestamp>." + body and send the
        # timestamp in x-elastic-timestamp; the agent rejects stale/replayed signatures.
        ts = Time.now.to_i.to_s
        sig = "sha256=" + OpenSSL::HMAC.hexdigest("SHA256", secret, ts + "." + body)
        event.set("[@metadata][soar_body]", body)
        event.set("[@metadata][soar_ts]", ts)
        event.set("[@metadata][soar_sig]", sig)
      '
    }
  }
}

output {
  # Unified security index. Zeek events are ECS-enriched in the filter above
  # (id.orig_h -> source.ip, etc.) and the colliding raw `id`/`source` fields are
  # gone, so they index here cleanly alongside endpoint telemetry — giving the
  # dashboards a single ECS data view with both network and host data.
  #
  # audit #169 / NIST SC-24: an event tagged _grokparsefailure/_jsonparsefailure
  # (the [pipeline][error] tag set above) is routed to a SEPARATE quarantine
  # index instead of the main data stream, so malformed input no longer
  # silently pollutes the primary security data. logstash-security-quarantine-*
  # matches the existing logstash-security-* template (same ECS mappings, same
  # ILM policy, same logstash_writer role grant) — no new template/role needed.
  if [pipeline][error] == "true" {
    elasticsearch {
      hosts    => ["${ELASTIC_HOSTS:https://elasticsearch:9200}"]
      index    => "logstash-security-quarantine-%{[tenant][id]}"
      action   => "create"
      data_stream => false
      # #257 (security-auditor review of #245): templates/ILM are applied
      # out-of-band by apply-templates.sh/apply-lifecycle.sh, authenticated
      # as elastic — this plugin must never try to auto-manage either
      # itself. Matches logstash_writer's role dropping the cluster-level
      # manage_index_templates/manage_ilm privileges that would otherwise be
      # required for it to do so; the two changes are meant to travel
      # together (a plugin trying to manage a template/ILM policy it no
      # longer has permission for is a startup error, not a silent no-op).
      manage_template => false
      ilm_enabled => false
      user     => "${LOGSTASH_ES_USER}"
      password => "${LOGSTASH_ES_PASS}"
      ssl_enabled => true
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  } else {
    elasticsearch {
      # HTTPS + authenticated. Credentials come from the least-privilege
      # `logstash_internal` user (role: logstash_writer), injected as env vars by
      # docker-compose.yml — never the `elastic` superuser, never hardcoded.
      hosts    => ["${ELASTIC_HOSTS:https://elasticsearch:9200}"]
      # Per-tenant data stream (WS0.3 + WS0.5): isolation is enforced by ES roles
      # scoped to the data stream name logstash-security-<tenant>. Still matches the
      # logstash-* data view, so dashboards keep working. provision_tenant.sh creates
      # the per-tenant role.
      #
      # WS0.5: the date suffix is gone — time is now managed by ILM rollover on the
      # data stream, not by daily index names. `action => create` is required because
      # data streams only accept op_type=create; ES auto-creates the stream from the
      # priority-200 data_stream template (logstash-security-template) on first write.
      index    => "logstash-security-%{[tenant][id]}"
      action   => "create"
      data_stream => false
      # #257: see the quarantine branch's identical comment above — same
      # out-of-band template/ILM management, same reason not to auto-manage.
      manage_template => false
      ilm_enabled => false
      user     => "${LOGSTASH_ES_USER}"
      password => "${LOGSTASH_ES_PASS}"
      ssl_enabled => true
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    }
  }

  # Push Notification Output (Conditional)
  # WS1.1: ntfy topic is no longer hardcoded — it comes from the NTFY_TOPIC env
  # (set per deployment in .env, passed by docker-compose), with a safe default.
  if "CRITICAL_THREAT" in [tags] {
    http {
      url => "https://ntfy.sh/${NTFY_TOPIC:subsoc-alerts}"
      http_method => "post"
      format => "message"
      message => "🚨 CRITICAL: intel match on %{[threat][indicator][value]} (tenant=%{[tenant][id]}, src=%{[@metadata][notify_source_ip]})"
      headers => {
        "Title" => "Suburban-SOC Alert"
        "Priority" => "high"
        "Tags" => "warning,skull"
      }
    }
  }

  # SOAR trigger (Watcher-free replacement for rules/elastic_watcher/soar_quarantine_alert.json)
  # Fires the AI agent's /alert webhook at ingest time for high-confidence IOC hits,
  # instead of polling every 60s. Reaches the agent by its docker-compose service name
  # on soc-mesh-net. The /alert handler expects: severity, source_ip, source_mac, technique.
  # WS1.1: fire on a real Zeek Intel match. #267: also fire on a T1110
  # pipeline tag - same condition as the signing block in the filter stage
  # above, kept in lockstep on purpose (a signed-but-never-dispatched event
  # is a silent no-op, the exact failure mode #267 found and fixed). T1046
  # deliberately excluded - see the signing block's own comment for why
  # (#331 found no sensor-side fix that makes Scan::Port_Scan spoof-proof
  # without discarding real detections, and this repo still has no rate
  # limiting anywhere in the /alert path either).
  if ([event][dataset] == "zeek.intel" and [threat][indicator][value]) or [threat][technique][id] == "T1110" {
    http {
      url => "http://soc_ai_agent:5000/alert"
      http_method => "post"
      # Send the exact pre-signed body built in the filter stage, with the HMAC in
      # the x-elastic-signature header and the freshness timestamp in
      # x-elastic-timestamp — both verified by the agent (WS0.2 + audit P1-1).
      format => "message"
      message => "%{[@metadata][soar_body]}"
      content_type => "application/json"
      headers => {
        "x-elastic-signature" => "%{[@metadata][soar_sig]}"
        "x-elastic-timestamp" => "%{[@metadata][soar_ts]}"
      }
    }
  }
}
