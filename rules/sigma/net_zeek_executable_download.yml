title: Executable or Script Payload Downloaded Over HTTP (Zeek Files)
id: ffde19ce-a7f2-4637-a25d-eb839b694697
status: experimental
description: |
    Detects transfer of executable or script payloads over HTTP as recorded in
    Zeek's files.log (shipped via Filebeat). Pairs with the EXPLOITATION
    emulation (tests/anomaly_simulation/sim_malware_download.sh).
    #217: demoted medium -> low rather than adding an allowlist filter.
    files.log does not carry the HTTP hostname/server (that lives in the
    separately-logged http.log, correlated only via connection uid, which
    this stack's Sigma logsource/fixture convention for zeek/files doesn't
    carry either) - so a legitimate-CDN/update-server allowlist isn't
    achievable at this logsource without fabricating an unverified field.
    Network-layer executable-download detection alone genuinely can't
    distinguish attacker staging from routine software updates without more
    context; correlate with http.log (by uid) or endpoint telemetry before
    escalating a hit from this rule.
    Added application/x-pie-executable (#228, M13 US5 review, kept in sync
    with the identical list in net_zeek_smtp_attachment_executable.yml):
    modern libmagic reports this MIME type for position-independent ELF
    executables, which is the default output of every current Linux distro's
    toolchain — the original list without it missed the majority of
    present-day Linux binaries.
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://docs.zeek.org/en/master/logs/files.html
author: Suburban-SOC
date: 2026-06-18
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    product: zeek
    service: files
detection:
    selection_transport:
        source: 'HTTP'
    selection_payload:
        mime_type:
            - 'application/x-dosexec'
            - 'application/x-msdownload'
            - 'application/vnd.microsoft.portable-executable'
            - 'application/x-elf'
            - 'application/x-executable'
            - 'application/x-pie-executable'
            - 'application/x-sharedlib'
            - 'application/x-sh'
            - 'application/x-shellscript'
    condition: selection_transport and selection_payload
falsepositives:
    - Legitimate software distribution, installers, and update downloads
    - Internal patch-management or deployment traffic
level: low
